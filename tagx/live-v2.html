<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Cache-Control" content="no-store"><title>TAGX Live V2</title><style>body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Tahoma,Arial;background:#fff;color:#172033}header,main{padding:18px max(14px,4vw)}header{border-bottom:1px solid #e5e7eb}.bar{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.chip{padding:7px 10px;border-radius:999px;background:#f1f5f9;font-size:12px;font-weight:800}.ok{background:#ecfdf5;color:#047857}.warn{background:#fff7ed;color:#b45309}.bad{background:#fef2f2;color:#b91c1c}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.card,.panel{border:1px solid #e2e8f0;border-radius:16px;padding:14px;margin-bottom:16px}.ticker{font-size:28px;font-weight:900}.move{font-size:18px;font-weight:900}.meta{font-size:13px;color:#64748b;line-height:1.65}.empty{grid-column:1/-1;padding:22px;text-align:center;color:#64748b}.tablewrap{overflow:auto}table{width:100%;border-collapse:collapse;min-width:760px}th,td{padding:9px;border-bottom:1px solid #edf1f5;text-align:right;font-size:13px}th{color:#64748b}.tag{display:inline-block;padding:4px 7px;border-radius:999px;background:#eff6ff;color:#1d4ed8;font-size:11px;font-weight:800}@media(max-width:900px){.grid{grid-template-columns:1fr 1fr}}@media(max-width:560px){.grid{grid-template-columns:1fr}}</style></head><body><header><div class="meta">TAGX LIVE V2 · DISCOVERY-FIRST</div><h1>الرادار المبكر</h1><div class="meta">يظهر Discovery أولًا دون أي بوابة إضافية. Extended Hours يثري البيانات فقط ولا يستطيع تصفير القائمة.</div><div class="bar"><span id="state" class="chip">بدء</span><span id="count" class="chip">—</span><span id="stamp" class="chip">—</span><span id="diag" class="chip">—</span></div></header><main><section class="panel"><h2>أعلى الحالات الآن</h2><div id="top" class="grid"><div class="empty">تحميل Discovery…</div></div></section><section class="panel"><h3>الرادار الكامل</h3><div class="tablewrap"><table><thead><tr><th>السهم</th><th>السعر</th><th>الحركة</th><th>15m</th><th>RVOL</th><th>Float</th></tr></thead><tbody id="rows"></tbody></table></div></section></main><script>'use strict';const $=s=>document.querySelector(s);const num=v=>{const n=parseFloat(String(v??'').replace('%','').replace(/,/g,''));return Number.isFinite(n)?n:null};const pct=v=>v==null?'—':(v>=0?'+':'')+v.toFixed(1)+'%';async function get(path,ms=8000){const c=new AbortController(),t=setTimeout(()=>c.abort(),ms);try{const r=await fetch('../tag/data/'+path+'?cb='+Date.now(),{cache:'no-store',signal:c.signal});if(!r.ok)throw new Error('HTTP '+r.status);return await r.json()}finally{clearTimeout(t)}}function baseScore(x){const c=num(x.Change)??-999,rv=num(x['Rel Volume'])??0,fl=num(x.Float),vol=num(x.Volume)??0;let s=0;if(c>=1&&c<8)s+=30;else if(c>=8&&c<18)s+=24;else if(c>=18&&c<30)s+=10;else if(c>=30)s-=20;if(rv>=2)s+=25;else if(rv>=1)s+=12;if(fl!=null&&fl<=20)s+=15;if(vol>=100000)s+=10;if(c< -8)s-=30;return s}function paint(a,ext){const em=ext?.rows||{};const now=Date.now();let rows=a.map(x=>{const e=em[x.Ticker];const ts=Date.parse(e?.timestampUTC||'');const fresh=Number.isFinite(ts)&&(now-ts)<=20*60000;const c=fresh?num(e.sessionChangePct):num(x.Change);const p=fresh?num(e.last):num(x.Price);const v=fresh?num(e.priceVelocity15mPct):null;return{...x,_c:c,_p:p,_v:v,_fresh:fresh,_s:baseScore(x)+(v!=null&&v>0?12:0)+(v!=null&&v<=-5?-35:0)}}).filter(x=>x._c!=null).sort((x,y)=>y._s-x._s);$('#count').textContent='Discovery '+a.length+' · Visible '+rows.length;$('#diag').textContent=ext?'Extended merged':'Discovery only';$('#top').innerHTML=rows.length?rows.slice(0,4).map(x=>'<article class="card"><span class="tag">Radar</span><div class="ticker">'+x.Ticker+'</div><div class="move">'+pct(x._c)+' · $'+(x._p?.toFixed(x._p<1?3:2)??'—')+'</div><div class="meta">15m '+pct(x._v)+' · RVOL '+((num(x['Rel Volume'])??0).toFixed(2))+' · Float '+(num(x.Float)?.toFixed(2)??'—')+'M</div></article>').join(''):'<div class="empty">Discovery وصل لكنه لا يحتوي صفوفًا قابلة للقراءة.</div>';$('#rows').innerHTML=rows.slice(0,100).map(x=>'<tr><td><b>'+x.Ticker+'</b></td><td>$'+(x._p?.toFixed(x._p<1?3:2)??'—')+'</td><td>'+pct(x._c)+'</td><td>'+pct(x._v)+'</td><td>'+((num(x['Rel Volume'])??0).toFixed(2))+'</td><td>'+(num(x.Float)?.toFixed(2)??'—')+'M</td></tr>').join('');return rows.length}async function run(){const st=$('#state');st.className='chip warn';st.textContent='Discovery…';try{const d=await get('discovery.json');if(!Array.isArray(d.rows))throw new Error('rows missing');$('#stamp').textContent=d.snapshotTimestampET||d.updatedAt||'—';paint(d.rows,null);st.className='chip ok';st.textContent='Discovery ظاهر';try{const e=await get('extended-hours.json',6000);paint(d.rows,e);$('#stamp').textContent=e.updatedAtET||d.snapshotTimestampET||'—';st.textContent='محدّث'}catch{st.className='chip warn';st.textContent='Discovery فقط'} }catch(e){st.className='chip bad';st.textContent='فشل Discovery';$('#diag').textContent=String(e.message||e);$('#top').innerHTML='<div class="empty">تعذر تحميل discovery.json. هذه مشكلة مصدر/نشر وليست فلتر.</div>'}}run();setInterval(run,60000);</script></body></html>
