<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TAGX</title><style>body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Tahoma,Arial;background:#fff;color:#172033}header,main{padding:20px max(16px,5vw)}header{border-bottom:1px solid #e5e7eb}.bar{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.chip{padding:7px 10px;border-radius:999px;background:#f1f5f9;font-size:12px;font-weight:800}.ok{background:#ecfdf5;color:#047857}.warn{background:#fff7ed;color:#b45309}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.card,.panel{border:1px solid #e2e8f0;border-radius:16px;padding:15px;margin-bottom:16px}.ticker{font-size:27px;font-weight:900}.meta{font-size:13px;color:#64748b;line-height:1.65}.empty{grid-column:1/-1;padding:24px;text-align:center;color:#64748b}.tablewrap{overflow:auto}table{width:100%;border-collapse:collapse;min-width:760px}th,td{padding:10px;border-bottom:1px solid #edf1f5;text-align:right;font-size:13px}th{color:#64748b}.tag{display:inline-block;padding:4px 7px;border-radius:999px;background:#eff6ff;color:#1d4ed8;font-size:11px;font-weight:800}@media(max-width:900px){.grid{grid-template-columns:1fr 1fr}}@media(max-width:560px){.grid{grid-template-columns:1fr}}</style></head><body><header><div class="meta">TAGX · resilient radar</div><h1>الرادار المبكر</h1><div class="meta">Discovery يظهر دائمًا، وExtended Hours يضيف السعر والزخم عند توفره. لا توجد أي قيود أو تصفية شرعية في الترتيب أو العرض.</div><div class="bar"><span id="state" class="chip">تحميل</span><span id="count" class="chip">—</span><span id="stamp" class="chip">—</span></div></header><main><section class="panel"><h2>أفضل الحالات البحثية الآن</h2><div id="top" class="grid"><div class="empty">جاري التحميل…</div></div></section><section class="panel"><h3>Research Radar</h3><div class="tablewrap"><table><thead><tr><th>السهم</th><th>السعر</th><th>الحركة</th><th>15m</th><th>RVOL</th><th>Float</th></tr></thead><tbody id="rows"></tbody></table></div></section></main><script>'use strict';const $=s=>document.querySelector(s),N=v=>{const n=parseFloat(String(v??'').replace('%','').replace(/,/g,''));return Number.isFinite(n)?n:null},F=v=>v==null?'—':(v>=0?'+':'')+v.toFixed(1)+'%';async function J(p){const c=new AbortController(),t=setTimeout(()=>c.abort(),7000);try{const r=await fetch('../tag/data/'+p+'?v='+Date.now(),{cache:'no-store',signal:c.signal});if(!r.ok)throw Error();return await r.json()}finally{clearTimeout(t)}}function age(e){const t=Date.parse(e?.timestampUTC||'');return Number.isFinite(t)?(Date.now()-t)/60000:1e9}function score(x){let s=0,c=x.c,rv=N(x['Rel Volume'])??0,fl=N(x.Float),v=x.v;if(c>=2&&c<8)s+=30;else if(c>=8&&c<18)s+=24;else if(c>=18&&c<30)s+=8;if(rv>=2)s+=24;else if(rv>=1)s+=10;if(fl!=null&&fl<=20)s+=12;if((N(x.Volume)??0)>=100000)s+=8;if(v!=null&&v>0)s+=12;if(c>=35||v!=null&&v<=-5)s-=60;return s}async function run(){const rs=await Promise.allSettled([J('discovery.json'),J('extended-hours.json')]);const d=rs[0].status==='fulfilled'?rs[0].value:null,e=rs[1].status==='fulfilled'?rs[1].value:null;if(!d||!Array.isArray(d.rows)){ $('#state').className='chip warn';$('#state').textContent='Discovery غير متاح';return}const em=e?.rows||{};let a=d.rows.map(x=>{const z=em[x.Ticker],fresh=z&&age(z)<=15;return{...x,p:fresh?N(z.last):N(x.Price),c:fresh?N(z.sessionChangePct):N(x.Change),v:fresh?N(z.priceVelocity15mPct):null,fresh}}).filter(x=>x.c!=null&&x.c>-8&&x.c<35).sort((x,y)=>score(y)-score(x));$('#state').className='chip ok';$('#state').textContent='محدّث';$('#count').textContent='Discovery '+d.rows.length+' · Radar '+a.length;$('#stamp').textContent=e?.updatedAtET||d.snapshotTimestampET||'—';$('#top').innerHTML=a.length?a.slice(0,4).map(x=>'<article class="card"><span class="tag">Research Radar</span><div class="ticker">'+x.Ticker+'</div><div><b>'+F(x.c)+'</b> · $'+(x.p?.toFixed(x.p<1?3:2)??'—')+'</div><div class="meta">15m '+F(x.v)+' · RVOL '+((N(x['Rel Volume'])??0).toFixed(2))+' · Float '+(N(x.Float)?.toFixed(2)??'—')+'M</div></article>').join(''):'<div class="empty">لا توجد حالات بحثية مناسبة حاليًا.</div>';$('#rows').innerHTML=a.slice(0,60).map(x=>'<tr><td><b>'+x.Ticker+'</b></td><td>$'+(x.p?.toFixed(x.p<1?3:2)??'—')+'</td><td>'+F(x.c)+'</td><td>'+F(x.v)+'</td><td>'+((N(x['Rel Volume'])??0).toFixed(2))+'</td><td>'+(N(x.Float)?.toFixed(2)??'—')+'M</td></tr>').join('')}run();setInterval(run,60000);</script></body></html>
