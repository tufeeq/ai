<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#fff"><title>TAGX — الاكتشاف المبكر</title><style>*{box-sizing:border-box}body{margin:0;background:#fff;color:#172033;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Tahoma,Arial,sans-serif}header{padding:24px max(18px,5vw) 16px;border-bottom:1px solid #e8edf3}.ey{font-size:12px;letter-spacing:2px;color:#64748b;font-weight:800}h1{margin:6px 0;font-size:clamp(25px,5vw,40px)}p{color:#64748b}.bar{display:flex;gap:9px;align-items:center;flex-wrap:wrap;padding:14px max(18px,5vw);border-bottom:1px solid #e8edf3;position:sticky;top:0;background:#fff;z-index:5}.btn{border:0;background:#0f172a;color:#fff;padding:10px 16px;border-radius:12px;font-weight:800;cursor:pointer}.btn:disabled{opacity:.55;cursor:wait}.chip{padding:7px 11px;border-radius:999px;background:#f1f5f9;font-size:13px;font-weight:700}.ok{background:#ecfdf5;color:#047857}.warn{background:#fff7ed;color:#b45309}.bad{background:#fef2f2;color:#b91c1c}main{padding:22px max(18px,5vw) 60px;max-width:1450px;margin:auto}.hero,.panel{border:1px solid #e2e8f0;border-radius:20px;padding:18px;background:#fff;margin-bottom:18px}.hero{background:#f8fafc}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:14px}.opp{border:1px solid #dfe7ef;border-radius:17px;padding:16px;background:#fff}.opp:first-child{border:2px solid #16a34a}.ticker{font-size:29px;font-weight:900}.move{font-size:19px;font-weight:900;color:#15803d}.meta{font-size:13px;color:#64748b;line-height:1.7}.empty{padding:28px;text-align:center;color:#64748b;grid-column:1/-1}.tablewrap{overflow:auto}table{width:100%;border-collapse:collapse;min-width:760px}th,td{padding:11px 9px;border-bottom:1px solid #edf1f5;text-align:right;font-size:13px}th{color:#64748b;background:#fafbfc}.err{display:none;margin-bottom:16px;padding:13px;border-radius:12px;background:#fef2f2;color:#991b1b}.err.show{display:block}@media(max-width:900px){.grid{grid-template-columns:1fr 1fr}}@media(max-width:560px){.grid{grid-template-columns:1fr}}</style></head><body><header><div class="ey">TAGX · EARLY MARKET INTELLIGENCE</div><h1>الاكتشاف المبكر وصناعة القرار</h1><p>البيانات تبقى ظاهرة أثناء التحديث، ولا يتم تعليق الواجهة إذا تعطل أحد المصادر.</p></header><div class="bar"><button id="refresh" class="btn">تحديث الآن</button><span id="state" class="chip">جاهز</span><span id="count" class="chip">—</span><span id="stamp" class="chip">—</span></div><main><div id="error" class="err"></div><section class="hero"><h2>أفضل فرص TAGX المبكرة الآن</h2><div id="top" class="grid"><div class="empty">جاري تحميل أحدث بيانات السوق…</div></div></section><section class="panel"><h3>الرادار المبكر</h3><div class="tablewrap"><table><thead><tr><th>السهم</th><th>السعر</th><th>الحركة</th><th>أول رصد</th><th>RVOL</th><th>Float M</th><th>المرحلة</th></tr></thead><tbody id="rows"></tbody></table></div></section></main><script>'use strict';const $=s=>document.querySelector(s),N=v=>{const n=parseFloat(String(v??'').replace('%','').replace(/,/g,''));return Number.isFinite(n)?n:null},F=v=>v==null?'—':(v>=0?'+':'')+v.toFixed(1)+'%';let last=null,busy=false;function stage(x){let c=N(x.Change),f=N(x._firstObservedChange),r=N(x['Rel Volume']);if(c==null)return'DATA';if(c>=35)return'LATE';if(c>=20)return'IGNITION';if(c>=8)return'PRE';if((r??0)>=2||Math.abs(c-(f??c))>=5)return'WAKE';return'DISCOVERY'}function score(x){let c=N(x.Change)??99,r=N(x['Rel Volume'])??0,fl=N(x.Float),f=N(x._firstObservedChange)??c,v=N(x.Volume)??0,s=35;if(f<10)s+=18;else if(f<20)s+=9;if(c>=3&&c<20)s+=12;if(c>=25)s-=25;if(c>=50)s-=25;if(r>=2)s+=10;if(fl!=null&&fl<=20)s+=8;if(v>=100000)s+=5;if(stage(x)==='LATE')s-=30;return s}function eligible(x){let c=N(x.Change);return c!=null&&c<25&&stage(x)!=='LATE'}async function getJSON(path,timeout=9000){const ctl=new AbortController(),t=setTimeout(()=>ctl.abort(),timeout);try{const r=await fetch('../tag/data/'+path+'?v='+Date.now(),{cache:'no-store',signal:ctl.signal});if(!r.ok)throw Error('HTTP '+r.status);return await r.json()}finally{clearTimeout(t)}}function render(d){last=d;let a=Array.isArray(d?.rows)?d.rows:[];$('#count').textContent='Discovery '+a.length;$('#stamp').textContent=d?.snapshotTimestampET||'وقت اللقطة غير متاح';let e=a.filter(eligible).sort((x,y)=>score(y)-score(x));$('#top').innerHTML=e.length?e.slice(0,4).map((x,i)=>'<article class="opp"><div class="meta">#'+(i+1)+' · '+stage(x)+'</div><div class="ticker">'+(x.Ticker||'—')+'</div><div class="move">'+F(N(x.Change))+'</div><div class="meta">السعر $'+(N(x.Price)?.toFixed(N(x.Price)<1?3:2)??'—')+' · أول رصد '+F(N(x._firstObservedChange))+'<br>RVOL '+(N(x['Rel Volume'])?.toFixed(2)??'—')+' · Float '+(N(x.Float)?.toFixed(2)??'—')+'M</div></article>').join(''):'<div class="empty">لا توجد حالات مبكرة مؤهلة الآن.</div>';$('#rows').innerHTML=e.slice(0,50).map(x=>'<tr><td><b>'+x.Ticker+'</b></td><td>$'+(N(x.Price)?.toFixed(2)??'—')+'</td><td>'+F(N(x.Change))+'</td><td>'+F(N(x._firstObservedChange))+'</td><td>'+((N(x['Rel Volume'])??0).toFixed(2))+'</td><td>'+(N(x.Float)?.toFixed(2)??'—')+'</td><td>'+stage(x)+'</td></tr>').join('')||'<tr><td colspan="7">لا توجد بيانات مؤهلة حاليًا.</td></tr>'}async function refresh(){if(busy)return;busy=true;const b=$('#refresh'),s=$('#state'),er=$('#error');b.disabled=true;b.textContent='يتم التحديث…';s.className='chip warn';s.textContent='جلب البيانات';er.className='err';try{const d=await getJSON('discovery.json');if(!d||!Array.isArray(d.rows))throw Error('صيغة discovery.json غير صالحة');render(d);s.className='chip ok';s.textContent='محدّث الآن'}catch(e){s.className='chip bad';s.textContent='تعذر التحديث';er.textContent='تعذر جلب لقطة جديدة خلال 9 ثوانٍ. أبقيت آخر بيانات ناجحة ظاهرة بدل إيقاف الأداة. '+(e?.name==='AbortError'?'انتهت مهلة المصدر.':'');er.className='err show';if(!last){$('#top').innerHTML='<div class="empty">المصدر غير متاح مؤقتًا. اضغط «تحديث الآن» لإعادة المحاولة.</div>'}}finally{busy=false;b.disabled=false;b.textContent='تحديث الآن'}}$('#refresh').addEventListener('click',refresh);refresh();setInterval(refresh,60000);</script></body></html>
