# Nutq — Docker Compose (Dokploy: Compose type "Docker Compose").
#   Repository    tufeeq/ai
#   Compose path  ./nutq/docker-compose.yml
#   Domains tab   service: web   container port: 8080   HTTPS: Let's Encrypt
#   Environment   paste the variables from .env.example (secrets go here only).

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    init: true
    mem_limit: ${NUTQ_MEM_LIMIT:-256m}
    environment:
      PORT: "8080"
      DATA_DIR: /data
      AI_BASE_URL: ${AI_BASE_URL:-https://ai.tryn.cc/v1}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_MODEL: ${AI_MODEL:-gpt-4o-mini}
      AI_TIMEOUT_MS: ${AI_TIMEOUT_MS:-180000}
      AZURE_SPEECH_KEY: ${AZURE_SPEECH_KEY:-}
      AZURE_SPEECH_REGION: ${AZURE_SPEECH_REGION:-}
      AZURE_SPEECH_ENDPOINT: ${AZURE_SPEECH_ENDPOINT:-}
      DEFAULT_VOICE: ${DEFAULT_VOICE:-ar-SA-HamedNeural}
      MAX_INPUT_CHARS: ${MAX_INPUT_CHARS:-200}
      TRANSLATE_RPM: ${TRANSLATE_RPM:-10}
      AUDIO_RPM: ${AUDIO_RPM:-60}
    volumes:
      - nutq-data:/data
    expose:
      - "8080"
    # Local use only:
    # ports:
    #   - "8080:8080"

volumes:
  nutq-data:
