name: TAGit Precursor Research Fast

on:
  push:
    paths:
      - '.github/workflows/tagit-precursor-research-fast.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  research:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          filter: blob:none
          sparse-checkout: |
            tag/data/discovery-fast.json
            tagit/precursor-research.mjs
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --check tagit/precursor-research.mjs
      - run: node tagit/precursor-research.mjs
      - name: Commit research report
        run: |
          git config user.name tagit-research-bot
          git config user.email actions@users.noreply.github.com
          git add -f tag/data/tagit-precursor-research.json
          git diff --cached --quiet && exit 0
          git commit -m 'data: update TAGit precursor research'
          git pull --rebase origin main
          git push origin HEAD:main
