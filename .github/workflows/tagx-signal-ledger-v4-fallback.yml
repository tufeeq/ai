name: TAGX Signal Ledger v4 Fallback

on:
  workflow_dispatch:
  schedule:
    - cron: '2-57/5 8-23 * * 1-5'

permissions:
  contents: write

concurrency:
  group: tagx-signal-ledger-main
  cancel-in-progress: true

jobs:
  ledger:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - run: git pull --rebase origin main
      - name: Build authoritative TAGX signal ledger
        run: |
          python - <<'PY'
          import json, pathlib, datetime

          disc_path=pathlib.Path('tag/data/discovery.json')
          reactive_path=pathlib.Path('tag/data/finviz.json')
          out=pathlib.Path('tag/data/tagx-signal-ledger.json')
          if not disc_path.exists(): raise SystemExit('discovery.json unavailable')
          discovery=json.loads(disc_path.read_text(encoding='utf-8'))
          reactive=json.loads(reactive_path.read_text(encoding='utf-8')) if reactive_path.exists() else {'rows':[]}
          snap_et=str(discovery.get('snapshotTimestampET') or '')
          if not snap_et: raise SystemExit('discovery timestamp unavailable')
          day=snap_et[:10]

          def rows(p):
              if isinstance(p,list): return p
              if not isinstance(p,dict): return []
              for k in ('rows','data','results','stocks','items','records','topMovers'):
                  if isinstance(p.get(k),list): return p[k]
              return []
          def ticker(r): return str(r.get('Ticker') or r.get('ticker') or r.get('Symbol') or r.get('symbol') or '').upper().strip()
          def val(r,*ks):
              for k in ks:
                  if r.get(k) not in (None,''): return r.get(k)
              return None
          def f(v):
              try: return float(str(v if v is not None else '').replace('%','').replace(',','').replace('$','').strip())
              except Exception: return None
          def lane_list(r):
              v=r.get('_discoveryLanes')
              if isinstance(v,list) and v: return [str(x) for x in v]
              return ['general_legacy']
          def point(r,source,ts,rank=None):
              p={'timestampET':ts,'source':source,'changePct':f(val(r,'Change','changePct','change','Change %')),
                 'price':f(val(r,'Price','price','Last','last')),'volume':f(val(r,'Volume','volume','Vol')),
                 'relativeVolume':f(val(r,'Rel Volume','Relative Volume','relativeVolume')),
                 'avgVolume':f(val(r,'Avg Volume','Average Volume','avgVolume')),
                 'float':f(val(r,'Float','float','Shares Float','sharesFloat'))}
              if source=='proactive': p['discoveryLanes']=lane_list(r)
              if rank is not None: p['top20Rank']=rank
              return p
          def sort_path(path): return sorted(path[-300:], key=lambda p:str(p.get('timestampET') or ''))

          try: old=json.loads(out.read_text(encoding='utf-8')) if out.exists() and out.stat().st_size else {}
          except Exception: old={}
          if old.get('sessionDateET') != day or old.get('schemaVersion') != 4:
              old={'schemaVersion':4,'sessionDateET':day,'tickers':{},'snapshots':[]}
          tickers=old.setdefault('tickers',{})

          proactive_now=set()
          for r in rows(discovery):
              t=ticker(r)
              if not t: continue
              proactive_now.add(t); lanes=lane_list(r); p=point(r,'proactive',snap_et)
              e=tickers.get(t) or {'ticker':t,'company':val(r,'Company','company'),'sector':val(r,'Sector','sector'),
                  'industry':val(r,'Industry','industry'),'firstSeenET':snap_et,'firstSource':'proactive','proactiveEver':True,
                  'proactiveFirstSeenET':snap_et,'proactiveFirstChangePct':p['changePct'],'proactiveFirstLanes':lanes,
                  'proactiveLanesEver':lanes[:],'moverEver':False,'path':[]}
              if not e.get('proactiveEver'):
                  e['proactiveFirstSeenET']=snap_et; e['proactiveFirstChangePct']=p['changePct']; e['proactiveFirstLanes']=lanes
              e['proactiveEver']=True
              ever=set(e.get('proactiveLanesEver') or []); ever.update(lanes); e['proactiveLanesEver']=sorted(ever)
              if not e.get('proactiveFirstLanes'): e['proactiveFirstLanes']=lanes
              e['lastSeenET']=snap_et; e['lastSource']='proactive'; e['lastChangePct']=p['changePct']; e['lastPrice']=p['price']; e['lastVolume']=p['volume']
              path=e.setdefault('path',[])
              if not any(q.get('timestampET')==snap_et and q.get('source')=='proactive' for q in path[-3:]): path.append(p)
              e['path']=sort_path(path); tickers[t]=e

          rts=str(reactive.get('snapshotTimestampET') or reactive.get('updatedAtET') or reactive.get('updatedAt') or snap_et)
          rr=[]
          for r in rows(reactive):
              t=ticker(r); ch=f(val(r,'Change','changePct','change','Change %'))
              if t and ch is not None: rr.append((ch,t,r))
          top20=sorted((x for x in rr if x[0]>0),key=lambda x:x[0],reverse=True)[:20]
          ranks={t:i+1 for i,(_,t,_) in enumerate(top20)}

          for ch,t,r in rr:
              if t not in tickers and t not in ranks: continue
              rank=ranks.get(t); source='top20_mover' if rank else 'reactive_context'; p=point(r,source,rts,rank); e=tickers.get(t)
              if e is None:
                  e={'ticker':t,'company':val(r,'Company','company'),'sector':val(r,'Sector','sector'),'industry':val(r,'Industry','industry'),
                     'firstSeenET':rts,'firstSource':source,'proactiveEver':False,'moverEver':bool(rank),'path':[]}
              if rank and not e.get('moverEver'):
                  e['moverFirstSeenET']=rts; e['moverFirstChangePct']=p['changePct']; e['moverFirstRank']=rank
              if rank: e['moverEver']=True; e['lastTop20Rank']=rank
              e['lastSeenET']=rts; e['lastSource']=source; e['lastChangePct']=p['changePct']; e['lastPrice']=p['price']; e['lastVolume']=p['volume']
              path=e.setdefault('path',[])
              if not any(q.get('timestampET')==rts and q.get('source')==source for q in path[-3:]): path.append(p)
              e['path']=sort_path(path); tickers[t]=e

          for e in tickers.values():
              pc=e.get('proactiveFirstChangePct'); mc=e.get('moverFirstChangePct')
              if e.get('moverEver'):
                  if e.get('proactiveEver') and isinstance(pc,(int,float)) and pc<10: cls='PROACTIVE_EARLY_LT10'
                  elif e.get('proactiveEver') and isinstance(pc,(int,float)) and pc<20: cls='PROACTIVE_EARLY_LT20'
                  elif e.get('proactiveEver'): cls='PROACTIVE_LATE'
                  elif isinstance(mc,(int,float)) and mc>=20: cls='UNIVERSE_COVERAGE_MISS_LATE'
                  else: cls='MOVER_ONLY_EARLY_OR_FORMING'
              elif e.get('proactiveEver'): cls='PROACTIVE_NOT_TOP20_YET'
              else: cls='UNKNOWN'
              e['originClass']=cls
              changes=[p.get('changePct') for p in e.get('path',[]) if isinstance(p.get('changePct'),(int,float))]
              if changes: e['maxObservedChangePct']=max(changes)

          cur=[tickers[t] for _,t,_ in top20 if t in tickers]
          e10=[e for e in cur if e.get('proactiveEver') and isinstance(e.get('proactiveFirstChangePct'),(int,float)) and e['proactiveFirstChangePct']<10]
          e20=[e for e in cur if e.get('proactiveEver') and isinstance(e.get('proactiveFirstChangePct'),(int,float)) and e['proactiveFirstChangePct']<20]
          miss=[e for e in cur if not e.get('proactiveEver')]
          lmiss=[e for e in miss if isinstance(e.get('moverFirstChangePct'),(int,float)) and e['moverFirstChangePct']>=20]
          lane_attr={}
          for lane in ('general','nano_low_float','general_legacy'):
              captured=[e for e in cur if lane in (e.get('proactiveFirstLanes') or [])]
              u10=[e for e in captured if isinstance(e.get('proactiveFirstChangePct'),(int,float)) and e['proactiveFirstChangePct']<10]
              u20=[e for e in captured if isinstance(e.get('proactiveFirstChangePct'),(int,float)) and e['proactiveFirstChangePct']<20]
              lane_attr[lane]={'currentTop20Captured':len(captured),'earlyUnder10':len(u10),'earlyUnder20':len(u20),'tickersUnder20':[e.get('ticker') for e in u20]}

          now=datetime.datetime.now(datetime.timezone.utc).isoformat()
          old.update({'schemaVersion':4,'ledgerAuthority':'PROACTIVE_DISCOVERY_SCHEDULED_FALLBACK','updatedAt':now,
              'snapshotTimestampET':snap_et,'reactiveSnapshotTimestampET':rts,'session':discovery.get('session'),'tickers':tickers,
              'tickerCount':len(tickers),'currentProactiveCount':len(proactive_now),'groundTruthDefinition':'CURRENT_REACTIVE_TOP20_BY_POSITIVE_CHANGE',
              'currentTop20Count':len(cur),'currentTop20ProactiveEarlyUnder10':len(e10),'currentTop20ProactiveEarlyUnder20':len(e20),
              'currentTop20CoverageMissCount':len(miss),'currentTop20LateCoverageMissCount':len(lmiss),'currentTop20LaneAttribution':lane_attr,
              'coverageAuditStatus':'INTRAPERIOD_TOP20_DIAGNOSTIC_ONLY','currentTop20':[{'rank':i+1,'ticker':t,'changePct':ch,
                'proactiveEver':bool(tickers.get(t,{}).get('proactiveEver')),'proactiveFirstChangePct':tickers.get(t,{}).get('proactiveFirstChangePct'),
                'proactiveFirstLanes':tickers.get(t,{}).get('proactiveFirstLanes'),'originClass':tickers.get(t,{}).get('originClass')} for i,(ch,t,_) in enumerate(top20)]})
          snaps=old.setdefault('snapshots',[]); snaps.append({'timestampET':snap_et,'reactiveTimestampET':rts,'proactiveCount':len(proactive_now),
            'top20Count':len(cur),'top20EarlyProactiveUnder10':len(e10),'top20EarlyProactiveUnder20':len(e20),'coverageMiss':len(miss),
            'lateCoverageMiss':len(lmiss),'laneAttribution':lane_attr}); old['snapshots']=snaps[-300:]
          out.write_text(json.dumps(old,ensure_ascii=False,indent=2),encoding='utf-8')
          print('TAGX fallback ledger','top20',len(cur),'early<10',len(e10),'early<20',len(e20),'miss',len(miss),'late',len(lmiss),'lanes',lane_attr)
          PY
      - name: Commit ledger
        run: |
          git config user.name "TAGX Signal Ledger"
          git config user.email "actions@users.noreply.github.com"
          git add tag/data/tagx-signal-ledger.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Update TAGX signal ledger v4 fallback"
          git pull --rebase origin main
          git push origin main