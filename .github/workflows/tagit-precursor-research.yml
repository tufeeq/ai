name: TAGit Precursor Research

on:
  push:
    paths:
      - 'tagit/precursor-research.mjs'
      - '.github/workflows/tagit-precursor-research.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  research:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --check tagit/precursor-research.mjs
      - run: node tagit/precursor-research.mjs
      - name: Commit research report
        run: |
          git config user.name tagit-research-bot
          git config user.email actions@users.noreply.github.com
          git add tag/data/tagit-precursor-research.json
          git diff --cached --quiet && exit 0
          git commit -m 'data: update TAGit precursor research'
          for i in 1 2 3; do git pull --rebase origin main && git push origin HEAD:main && exit 0; sleep $((i*4)); done
          exit 1
