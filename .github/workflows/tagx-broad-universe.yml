name: TAGX Broad US Equity Universe
on:
  workflow_dispatch:
  schedule:
    - cron: '2,17,32,47 8-23 * * 1-5'
    # The quote service rejects a reference older than 24 h, so weekends need refreshes too.
    - cron: '7 */6 * * 0,6'
  push:
    branches: [ main, 'claude/**' ]
    paths:
      - '.github/workflows/tagx-broad-universe.yml'
      - 'tagit-next/pipeline/universe.py'
permissions:
  contents: write
concurrency:
  group: tagx-broad-us-universe-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build free broad universe (Nasdaq.com screener + SEC + FINRA)
        env:
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT || 'TAGit NEXT research tufeeq11@gmail.com' }}
        run: |
          (cd tagit-next/pipeline && python -m unittest -q test_universe)
          python tagit-next/pipeline/universe.py
      - name: Commit broad universe
        if: github.ref == 'refs/heads/main'
        run: |
          git config user.name 'TAGX Broad Universe Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add tag/data/universe-broad.json
          git diff --cached --quiet && exit 0
          git commit -m 'data: refresh broad US equity universe'
          for i in 1 2 3; do git pull --rebase origin main && git push origin HEAD:main && exit 0; sleep $((i*5)); done
          exit 1
