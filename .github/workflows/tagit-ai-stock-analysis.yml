name: TAGit GPT Web Stock Analysis

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'tag/data/live-quotes.json'
      - '.github/workflows/tagit-ai-stock-analysis.yml'
  schedule:
    - cron: '*/10 * * * 1-5'

permissions:
  contents: write

concurrency:
  group: tagit-gpt-stock-analysis
  cancel-in-progress: true

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_MODEL: gpt-5.6
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Sync latest main
        run: git pull --rebase origin main

      - name: Research current opportunities with GPT + web search
        shell: bash
        run: |
          python - <<'PY'
          import json, pathlib, datetime, urllib.request, urllib.error, os, sys

          now = datetime.datetime.now(datetime.timezone.utc)
          ROOT = pathlib.Path('tag/data')
          OUT = ROOT / 'ai-stock-analysis.json'

          def load(path):
              try:
                  return json.loads(pathlib.Path(path).read_text(encoding='utf-8'))
              except Exception:
                  return {}

          def num(v):
              try:
                  return float(v)
              except Exception:
                  return None

          live = load(ROOT / 'live-quotes.json')
          old = load(OUT)

          # Avoid unnecessary paid calls when a recent GPT report already exists.
          if os.environ.get('GITHUB_EVENT_NAME') != 'workflow_dispatch':
              old_t = old.get('updatedAtUTC')
              if old_t and old.get('provider') == 'OPENAI_RESPONSES_WEB_SEARCH':
                  try:
                      age = (now - datetime.datetime.fromisoformat(old_t.replace('Z', '+00:00'))).total_seconds()
                      if age < 480:
                          print('GPT research cache is still fresh; exiting')
                          raise SystemExit(0)
                  except ValueError:
                      pass

          # Build a compact shortlist: emerging first, then strongest accumulation candidates.
          rows, seen = [], set()
          sources = [
              ('EMERGING', live.get('emergingCandidates') or []),
              ('ACCUMULATION', live.get('accumulationCandidates') or [])
          ]
          for signal_type, arr in sources:
              for x in arr:
                  ticker = str(x.get('ticker') or '').upper().strip()
                  if not ticker or ticker in seen:
                      continue
                  seen.add(ticker)
                  q = (live.get('quotes') or {}).get(ticker, {}) if isinstance(live.get('quotes'), dict) else {}
                  merged = dict(q)
                  merged.update(x)
                  merged['signalType'] = signal_type
                  rows.append(merged)
                  if len(rows) >= 8:
                      break
              if len(rows) >= 8:
                  break

          # Nothing to analyze.
          if not rows:
              OUT.write_text(json.dumps({
                  'schemaVersion': 4,
                  'provider': 'OPENAI_RESPONSES_WEB_SEARCH',
                  'model': os.environ.get('OPENAI_MODEL', 'gpt-5.6'),
                  'updatedAtUTC': now.isoformat(),
                  'liveFeedUpdatedAtUTC': live.get('updatedAtUTC'),
                  'analysisCount': 0,
                  'analyses': {},
                  'note': 'No active shortlist to research.'
              }, ensure_ascii=False, indent=2), encoding='utf-8')
              raise SystemExit(0)

          context = []
          for r in rows:
              context.append({
                  'ticker': r.get('ticker'),
                  'signalType': r.get('signalType'),
                  'price': r.get('price'),
                  'changePct': r.get('changePct'),
                  'sessionVolume': r.get('sessionVolume'),
                  'relativeVolume': r.get('relativeVolume'),
                  'floatM': r.get('floatM'),
                  'accumulationScore': r.get('accumulationScore'),
                  'liquidityAccumulation': r.get('liquidityAccumulation'),
                  'range15mPct': r.get('range15mPct'),
                  'volumeAcceleration5m': r.get('volumeAcceleration5m'),
                  'volumeAcceleration15m': r.get('volumeAcceleration15m'),
                  'turnover5mPctFloat': r.get('turnover5mPctFloat'),
                  'turnover15mPctFloat': r.get('turnover15mPctFloat'),
                  'priceVelocity5mPct': r.get('priceVelocity5mPct'),
                  'priceVelocity15mPct': r.get('priceVelocity15mPct'),
                  'earlyRegimeShiftScore': r.get('earlyRegimeShiftScore'),
                  'ignitionScore': r.get('ignitionScore'),
                  'technicalCoverage': r.get('technicalCoverage'),
                  'technicalScore': r.get('technicalScore'),
                  'technicalBias': r.get('technicalBias'),
                  'rsi14': r.get('rsi14'),
                  'macd': r.get('macd'),
                  'macdSignal': r.get('macdSignal'),
                  'macdHist': r.get('macdHist'),
                  'ema9': r.get('ema9'),
                  'ema20': r.get('ema20'),
                  'volume5mRatio': r.get('volume5mRatio'),
                  'volumeTrend': r.get('volumeTrend'),
                  'buyVolumePct': r.get('buyVolumePct'),
                  'fibTrend': r.get('fibTrend'),
                  'fibSupport': r.get('fibSupport'),
                  'fibResistance': r.get('fibResistance'),
                  'quoteTime': r.get('timestampET')
              })

          api_key = os.environ.get('OPENAI_API_KEY', '').strip()
          model = os.environ.get('OPENAI_MODEL', 'gpt-5.6').strip() or 'gpt-5.6'

          if not api_key:
              OUT.write_text(json.dumps({
                  'schemaVersion': 4,
                  'provider': 'OPENAI_RESPONSES_WEB_SEARCH',
                  'model': model,
                  'status': 'OPENAI_API_KEY_MISSING',
                  'updatedAtUTC': now.isoformat(),
                  'liveFeedUpdatedAtUTC': live.get('updatedAtUTC'),
                  'analysisCount': 0,
                  'analyses': {},
                  'note': 'Add repository secret OPENAI_API_KEY to enable GPT web research. No rules-based text is substituted for GPT.'
              }, ensure_ascii=False, indent=2), encoding='utf-8')
              print('OPENAI_API_KEY is not configured; wrote explicit non-AI status.')
              raise SystemExit(0)

          schema = {
              'type': 'object',
              'properties': {
                  'analyses': {
                      'type': 'array',
                      'items': {
                          'type': 'object',
                          'properties': {
                              'ticker': {'type': 'string'},
                              'company': {'type': 'string'},
                              'asOf': {'type': 'string'},
                              'executiveSummary': {'type': 'string'},
                              'shortTermSetup': {'type': 'string'},
                              'liquidityRead': {'type': 'string'},
                              'technicalRead': {'type': 'string'},
                              'fundamentalGrowth': {'type': 'string'},
                              'catalysts': {'type': 'array', 'items': {'type': 'string'}},
                              'risks': {'type': 'array', 'items': {'type': 'string'}},
                              'dilutionAndFinancing': {'type': 'string'},
                              'latestNewsTake': {'type': 'string'},
                              'confidence': {'type': 'integer', 'minimum': 0, 'maximum': 100},
                              'verdict': {'type': 'string', 'enum': ['WATCH', 'CONFIRMED_WITH_RISK', 'EXTENDED', 'AVOID', 'INSUFFICIENT_EVIDENCE']},
                              'sources': {
                                  'type': 'array',
                                  'items': {
                                      'type': 'object',
                                      'properties': {
                                          'title': {'type': 'string'},
                                          'url': {'type': 'string'},
                                          'publisher': {'type': 'string'},
                                          'date': {'type': 'string'}
                                      },
                                      'required': ['title', 'url', 'publisher', 'date'],
                                      'additionalProperties': False
                                  }
                              }
                          },
                          'required': ['ticker','company','asOf','executiveSummary','shortTermSetup','liquidityRead','technicalRead','fundamentalGrowth','catalysts','risks','dilutionAndFinancing','latestNewsTake','confidence','verdict','sources'],
                          'additionalProperties': False
                      }
                  }
              },
              'required': ['analyses'],
              'additionalProperties': False
          }

          system = '''أنت محلل أبحاث أسهم أمريكية صغيرة عالي الدقة داخل TAGit. لا تكتفِ بالبيانات المرسلة لك: استخدم أداة web_search فعليًا لكل سهم قبل إصدار الحكم. ابحث بالرمز واسم الشركة، وراجع قدر الإمكان المصادر الأولية والحديثة: SEC/EDGAR، علاقات المستثمرين للشركة، الإفصاحات والنتائج، العروض المسجلة وATM/S-1/S-3/424B، التمويل والديون، warrants، reverse split أو مخاطر الإدراج، ثم الأخبار الموثوقة. افحص فرص النمو الأساسية منفصلة عن الزخم اللحظي. ابحث أيضًا عن أي catalyst حديث، ومخاطر dilution، وحجم/float أو short-interest عندما يتوفر من مصدر موثوق. استخدم بيانات TAGit اللحظية كطبقة فنية: حجم الجلسة، relative volume، تسارع الحجم، price compression، turnover، RSI، MACD، EMA9/20 وFibonacci. لا تختلق أرقامًا أو أخبارًا. إذا تعارضت المصادر فاذكر ذلك بوضوح. لا تعتبر ارتفاع الحجم وحده ضمانًا للصعود. أعط حكمًا بحثيًا لا توصية قطعية ولا ضمان ربح. يجب أن تكون المصادر مرتبطة مباشرة بما بحثته وأن تكون حديثة قدر الإمكان. أجب بالعربية ضمن الـJSON المطلوب.'''

          user = 'حلل الأسهم التالية وفق البيانات اللحظية الملتقطة الآن، ثم ابحث في الويب عن الشركة والأخبار والإفصاحات والتمويل والمخاطر والمحفزات قبل كتابة النتيجة:\n' + json.dumps(context, ensure_ascii=False)

          payload = {
              'model': model,
              'reasoning': {'effort': 'medium'},
              'tools': [
                  {
                      'type': 'web_search',
                      'search_context_size': 'medium'
                  }
              ],
              'tool_choice': 'auto',
              'include': ['web_search_call.action.sources'],
              'input': [
                  {'role': 'system', 'content': system},
                  {'role': 'user', 'content': user}
              ],
              'text': {
                  'verbosity': 'medium',
                  'format': {
                      'type': 'json_schema',
                      'name': 'tagit_stock_research',
                      'strict': True,
                      'schema': schema
                  }
              },
              'store': False,
              'max_output_tokens': 12000
          }

          req = urllib.request.Request(
              'https://api.openai.com/v1/responses',
              data=json.dumps(payload).encode('utf-8'),
              headers={
                  'Authorization': 'Bearer ' + api_key,
                  'Content-Type': 'application/json',
                  'Accept': 'application/json'
              },
              method='POST'
          )

          try:
              with urllib.request.urlopen(req, timeout=150) as resp:
                  raw = json.loads(resp.read().decode('utf-8'))
          except urllib.error.HTTPError as e:
              body = e.read().decode('utf-8', errors='replace')[:4000]
              print('OpenAI HTTP error', e.code, body)
              raise

          # Raw REST responses do not expose the SDK convenience response.output_text,
          # so collect output_text parts from assistant message items.
          parts = []
          for item in raw.get('output') or []:
              if item.get('type') != 'message':
                  continue
              for c in item.get('content') or []:
                  if c.get('type') == 'output_text' and c.get('text'):
                      parts.append(c['text'])
          text = ''.join(parts).strip()
          if not text:
              raise RuntimeError('OpenAI response contained no output_text')

          parsed = json.loads(text)
          analyses = {}
          requested = {str(c['ticker']).upper() for c in context}
          for a in parsed.get('analyses') or []:
              ticker = str(a.get('ticker') or '').upper().strip()
              if ticker and ticker in requested:
                  a['ticker'] = ticker
                  a['mode'] = 'GPT_WEB_RESEARCH'
                  a['model'] = model
                  a['generatedAtUTC'] = now.isoformat()
                  analyses[ticker] = a

          out = {
              'schemaVersion': 4,
              'provider': 'OPENAI_RESPONSES_WEB_SEARCH',
              'status': 'OK',
              'model': model,
              'updatedAtUTC': now.isoformat(),
              'liveFeedUpdatedAtUTC': live.get('updatedAtUTC'),
              'technicalUpdatedAtUTC': live.get('technicalUpdatedAtUTC'),
              'analysisCount': len(analyses),
              'analyses': analyses,
              'usage': raw.get('usage'),
              'responseId': raw.get('id'),
              'note': 'Each result is generated by GPT after OpenAI built-in web search plus current TAGit technical/liquidity context. Research aid only.'
          }
          OUT.write_text(json.dumps(out, ensure_ascii=False, indent=2), encoding='utf-8')
          print(json.dumps({'model': model, 'analysisCount': len(analyses), 'tickers': list(analyses)}, ensure_ascii=False))
          PY

      - name: Commit GPT research cache
        run: |
          test -f tag/data/ai-stock-analysis.json || exit 0
          git config user.name "TAGit GPT Research Bot"
          git config user.email "actions@users.noreply.github.com"
          git add tag/data/ai-stock-analysis.json
          git diff --cached --quiet && exit 0
          git commit -m "data: refresh TAGit GPT web research"
          for i in 1 2 3; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep $((i*3))
          done
          exit 1
