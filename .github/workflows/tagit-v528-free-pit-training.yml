name: TAGit v5.28 Recurrent Continuation Memory PIT Validation
on:
  push:
    paths:
      - 'tagit/free-pit-training-v528.py'
      - '.github/workflows/tagit-v528-free-pit-training.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      TAGIT_MAX_SYMBOLS: '650'
      TAGIT_HISTORY_DAYS: '730'
      APCA_API_KEY_ID: ${{ secrets.APCA_API_KEY_ID }}
      APCA_API_SECRET_KEY: ${{ secrets.APCA_API_SECRET_KEY }}
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -q numpy scikit-learn
      - name: Syntax check
        run: python -m py_compile tagit/free-pit-training-v528.py
      - name: Run recurrent continuation validation
        run: python tagit/free-pit-training-v528.py
      - name: Verify evidence contract
        run: |
          python - <<'PY'
          import json
          p='tag/data/tagit-v528-free-pit-training.json'
          d=json.load(open(p))
          assert d['status']=='COMPLETE'
          assert d['realDiscoveryPrecisionPct'] is None
          assert d['holdoutStatus']=='CONSUMED_RESEARCH_HOLDOUT'
          assert d['providerIntegrity']['marketWidePrecisionClaimAllowed'] is False
          print('evidence contract ok')
          PY
      - name: Commit validation evidence
        run: |
          git config user.name 'tagit-data-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add tag/data/tagit-v528-free-pit-training.json tag/data/tagit-v528-free-pit-cases.json
          if ! git diff --cached --quiet; then
            git commit -m 'data: add TAGit v5.28 recurrent continuation validation evidence'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
