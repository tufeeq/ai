name: TAGX Fast Discovery Lane

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["TAG5 Mover Snapshot"]
    types: [completed]
    branches: [main]
  schedule:
    - cron: '1,6,11,16,21,26,31,36,41,46,51,56 8-23 * * 1-5'

permissions:
  contents: write

concurrency:
  group: tagx-fast-discovery-main
  cancel-in-progress: true

jobs:
  fast-discovery:
    if: >-
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Sync latest main
        run: git pull --rebase origin main

      - name: Guard U.S. session
        id: guard
        run: |
          python - <<'PY'
          import datetime, os
          from zoneinfo import ZoneInfo
          et=datetime.datetime.now(datetime.timezone.utc).astimezone(ZoneInfo('America/New_York'))
          mins=et.hour*60+et.minute
          active=et.weekday()<5 and 240<=mins<=1200
          with open(os.environ['GITHUB_OUTPUT'],'a') as f: f.write(f'active={str(active).lower()}\n')
          print('ET',et.isoformat(),'active',active)
          PY

      - name: Fetch proactive and marketwide anomaly lanes
        if: steps.guard.outputs.active == 'true'
        env:
          FINVIZ_TOKEN: ${{ secrets.FINVIZ_TOKEN }}
        run: |
          test -n "$FINVIZ_TOKEN" || (echo "FINVIZ_TOKEN missing" && exit 1)
          for SPEC in \
            "general|cap_smallunder,sh_avgvol_o100,sh_price_u20,sh_relvol_o0.5" \
            "nano_low_float|cap_smallunder,sh_avgvol_o100,sh_price_u10,sh_float_u20" \
            "abnormal_volume|cap_smallunder,sh_price_u20,sh_relvol_o3" \
            "penny_anomaly|cap_smallunder,sh_price_u5,sh_relvol_o2"; do
            NAME="${SPEC%%|*}"; FILTERS="${SPEC#*|}"
            URL="https://elite.finviz.com/export.ashx?v=141&f=${FILTERS}&auth=${FINVIZ_TOKEN}"
            curl --fail --silent --show-error --location --retry 3 --retry-delay 2 --retry-all-errors "$URL" -o "/tmp/tagx-${NAME}.csv"
            test -s "/tmp/tagx-${NAME}.csv" || exit 1
          done

      - name: Build fast discovery trace with anomaly-first score
        if: steps.guard.outputs.active == 'true'
        run: |
          python - <<'PY'
          import csv,json,datetime,pathlib,math
          from zoneinfo import ZoneInfo
          now=datetime.datetime.now(datetime.timezone.utc); et=now.astimezone(ZoneInfo('America/New_York'))
          out=pathlib.Path('tag/data/discovery-fast.json')
          try: old=json.loads(out.read_text()) if out.exists() else {}
          except: old={}
          same_day=str(old.get('sessionDateET') or '')==et.date().isoformat()
          prev={str(x.get('Ticker') or '').upper():x for x in (old.get('rows') or [])} if same_day else {}
          merged={}; lanes={}
          lane_names=('general','nano_low_float','abnormal_volume','penny_anomaly')
          for name in lane_names:
            with open(f'/tmp/tagx-{name}.csv',newline='',encoding='utf-8-sig') as f:
              for r in csv.DictReader(f):
                t=str(r.get('Ticker') or r.get('Symbol') or '').strip().upper()
                if not t: continue
                if t not in merged: merged[t]=dict(r)
                lanes.setdefault(t,[]).append(name)
          rows=[]
          def p(v):
            try:return float(str(v or '').replace('%','').replace(',','').replace('$',''))
            except:return None
          def clamp(v,a=0,b=100): return max(a,min(b,v))
          repaired_first_price=0
          for t,r in merged.items():
            oldr=prev.get(t,{})
            ls=lanes.get(t,[])
            r['Ticker']=t; r['_fastDiscoveryLanes']=ls
            r['_snapshotTimestampUTC']=now.isoformat();r['_snapshotTimestampET']=et.isoformat()
            r['_firstFastObservedTimestampUTC']=oldr.get('_firstFastObservedTimestampUTC',now.isoformat())
            r['_firstFastObservedTimestampET']=oldr.get('_firstFastObservedTimestampET',et.isoformat())
            r['_firstFastObservedChange']=oldr.get('_firstFastObservedChange',r.get('Change'))
            r['_firstFastObservedVolume']=oldr.get('_firstFastObservedVolume',r.get('Volume'))
            r['_firstFastObservedPrice']=oldr.get('_firstFastObservedPrice',r.get('Price'))

            first_change=p(r.get('_firstFastObservedChange')); first_vol=p(r.get('_firstFastObservedVolume')); first_price=p(r.get('_firstFastObservedPrice'))
            cur_change=p(r.get('Change')); cur_vol=p(r.get('Volume')); cur_price=p(r.get('Price')); relvol=p(r.get('Rel Volume') or r.get('Relative Volume'))

            legacy_inconsistent=(first_price is not None and cur_price is not None and first_change is not None and cur_change is not None and abs(first_price-cur_price)/max(abs(cur_price),1e-9)<=0.002 and abs(cur_change-first_change)>=3 and (1+cur_change/100)>0 and (1+first_change/100)>0)
            if legacy_inconsistent:
              derived=cur_price*(1+first_change/100)/(1+cur_change/100)
              if derived>0:
                first_price=derived; r['_firstFastObservedPrice']=round(derived,6); r['_firstFastObservedPriceAuthority']='DERIVED_FROM_COMMON_PREV_CLOSE_LEGACY_REPAIR'; repaired_first_price+=1
            else:r['_firstFastObservedPriceAuthority']=oldr.get('_firstFastObservedPriceAuthority','OBSERVED_IMMUTABLE')

            vol_exp=(cur_vol/first_vol) if first_vol and first_vol>0 and cur_vol is not None else None
            move_first=((cur_price-first_price)/first_price*100) if first_price and first_price>0 and cur_price is not None else None
            quiet=first_change is not None and abs(first_change)<=4
            participation=clamp(math.log10(1+vol_exp)*35) if vol_exp is not None and vol_exp>=0 else None
            displacement=clamp(max(0,move_first)*3.1) if move_first is not None else None
            relative_volume_score=clamp(math.log10(1+max(0,relvol or 0))*42) if relvol is not None else None
            quiet_score=88 if quiet else (58 if first_change is not None and abs(first_change)<=8 else 25)
            anomaly_lane=('abnormal_volume' in ls or 'penny_anomaly' in ls)
            lane_score=95 if anomaly_lane else (85 if 'nano_low_float' in ls else 60)
            parts=[(participation,.28),(relative_volume_score,.27),(displacement,.20),(quiet_score,.13),(lane_score,.12)]
            valid=[(v,w) for v,w in parts if v is not None]
            pattern=sum(v*w for v,w in valid)/sum(w for _,w in valid) if valid else 0
            price_holding=(move_first is None or (-3<=move_first<25)); current_holding=(cur_change is None or cur_change>-6)
            latent=bool(current_holding and price_holding and ((quiet and vol_exp is not None and vol_exp>=4 and (cur_vol or 0)>=2500) or (anomaly_lane and relvol is not None and relvol>=3)))
            r['_volumeExpansionFromFirst']=round(vol_exp,2) if vol_exp is not None else None
            r['_moveFromFirstPct']=round(move_first,2) if move_first is not None else None
            r['_relativeVolumeObserved']=round(relvol,2) if relvol is not None else None
            r['_marketwideAnomaly']=anomaly_lane
            r['_quietBase']=quiet; r['_latentIgnition']=latent; r['_earlyPatternScore']=round(pattern,2)
            r['_patternVersion']='marketwide-anomaly-participation-v2'
            rows.append(r)
          rows.sort(key=lambda x:(1 if x.get('_latentIgnition') else 0,1 if x.get('_marketwideAnomaly') else 0,p(x.get('_earlyPatternScore')) or 0,p(x.get('Rel Volume') or x.get('Relative Volume')) or 0),reverse=True)
          payload={'schemaVersion':4,'source':'Finviz Elite TAGX proactive + marketwide anomaly lanes','sourceType':'FAST_PROACTIVE_DISCOVERY','sessionDateET':et.date().isoformat(),'updatedAt':now.isoformat(),'snapshotTimestampUTC':now.isoformat(),'snapshotTimestampET':et.isoformat(),'session':'pre-market' if et.hour<9 or (et.hour==9 and et.minute<30) else ('regular' if et.hour<16 else 'after-hours'),'count':len(rows),'trainingEligible':False,'groundTruthEligible':False,'purpose':'COLD_START_MARKETWIDE_ANOMALY_AND_CADENCE_CHALLENGER','rankingMethod':'MARKETWIDE_ANOMALY_PARTICIPATION_V2','laneCounts':{name:sum(1 for r in rows if name in (r.get('_fastDiscoveryLanes') or [])) for name in lane_names},'firstPriceIntegrity':{'legacyRowsRepaired':repaired_first_price,'policy':'FIRST_PRICE_IMMUTABLE; legacy inconsistency derived only from common previous-close identity'},'rows':rows}
          out.parent.mkdir(parents=True,exist_ok=True);out.write_text(json.dumps(payload,ensure_ascii=False,indent=2))
          print('fast discovery rows',len(rows),'latent',sum(1 for r in rows if r.get('_latentIgnition')),'marketwide anomalies',sum(1 for r in rows if r.get('_marketwideAnomaly')))
          PY

      - name: Commit fast discovery trace
        if: steps.guard.outputs.active == 'true'
        run: |
          git config user.name "TAGX Fast Discovery Bot"
          git config user.email "actions@users.noreply.github.com"
          git add tag/data/discovery-fast.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Refresh TAGX marketwide anomaly discovery trace"
          git pull --rebase origin main
          git push origin main