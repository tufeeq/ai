name: TAGit v0.7 Transition Validation

on:
  push:
    paths:
      - 'tagit/backtest-v07.mjs'
      - '.github/workflows/tagit-v07-validation.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax check
        run: node --check tagit/backtest-v07.mjs
      - name: Run cross-sectional transition walk-forward
        run: node tagit/backtest-v07.mjs
      - name: Commit validation report
        run: |
          git config user.name tagit-v07-validation-bot
          git config user.email actions@users.noreply.github.com
          git add tag/data/tagit-v07-walkforward.json
          git diff --cached --quiet && exit 0
          git commit -m 'data: update TAGit v0.7 transition validation'
          for i in 1 2 3; do git pull --rebase origin main && git push origin HEAD:main && exit 0; sleep $((i*4)); done
          exit 1
