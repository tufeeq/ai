name: TAGit 10 Continuous Radar

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'tagit10/engine.py'
      - '.github/workflows/tagit10-daemon.yml'
  schedule:
    - cron: '0 8,14,20 * * 1-5'

permissions:
  contents: write

concurrency:
  group: tagit10-continuous-radar
  cancel-in-progress: true

jobs:
  radar:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - name: Run continuous active-session engine
        env:
          TAGIT_CONTINUOUS: '1'
          FINVIZ_TOKEN: ${{ secrets.FINVIZ_TOKEN }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name tagit10-radar-bot
          git config user.email actions@users.noreply.github.com
          git fetch origin tagit10-live:refs/remotes/origin/tagit10-live || true
          if git show origin/tagit10-live:tagit10-state.json >/tmp/tagit10-state.json 2>/dev/null; then
            python tagit10/quality.py /tmp/tagit10-state.json tagit10-state.json
          fi
          publish_live() {
            tmp=$(mktemp -d)
            cp tagit10-live.json "$tmp/tagit10-live.json"
            cp tagit10-state.json "$tmp/tagit10-state.json"
            cd "$tmp"
            git init -q
            git checkout -q --orphan live
            git config user.name tagit10-radar-bot
            git config user.email actions@users.noreply.github.com
            git add tagit10-live.json tagit10-state.json
            git commit -q -m "TAGit10 live $(date -u +%FT%TZ)"
            git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
            git push -q --force origin HEAD:tagit10-live
            cd - >/dev/null
            rm -rf "$tmp"
          }
          end=$(( $(date +%s) + 20700 ))
          while [ "$(date +%s)" -lt "$end" ]; do
            start=$(date +%s)
            if python tagit10/engine.py; then publish_live || true; fi
            elapsed=$(( $(date +%s) - start ))
            sleep_for=$(( 90 - elapsed ))
            [ "$sleep_for" -gt 5 ] || sleep_for=5
            sleep "$sleep_for"
          done

