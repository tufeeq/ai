name: TAGX Premarket Stale Rescue

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tagx-premarket-stale-rescue.yml'
  schedule:
    - cron: '3-58/5 8-13 * * 1-5'

permissions:
  contents: write

concurrency:
  group: tagx-premarket-rescue
  cancel-in-progress: true

jobs:
  rescue:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - run: git pull --rebase origin main
      - name: Rescue stale premarket heartbeat only
        run: |
          python - <<'PY'
          import json,pathlib,datetime,urllib.request,urllib.parse,concurrent.futures,re
          from zoneinfo import ZoneInfo
          ET=ZoneInfo('America/New_York'); now=datetime.datetime.now(datetime.timezone.utc); et=now.astimezone(ET); minute=et.hour*60+et.minute
          if not(et.weekday()<5 and 240<=minute<570): raise SystemExit(0)
          def load(p):
            try:return json.loads(pathlib.Path(p).read_text(encoding='utf-8'))
            except:return {}
          def num(v):
            try:return float(str(v or 0).replace('%','').replace(',','').replace('$',''))
            except:return 0.0
          prior=load('tag/data/premarket-hot.json')
          stamp=prior.get('updatedAtUTC')
          try: age=(now-datetime.datetime.fromisoformat(stamp.replace('Z','+00:00'))).total_seconds()/60
          except: age=1e9
          if age<=12:
            print('Primary premarket heartbeat healthy',round(age,1),'minutes; rescue not needed')
            raise SystemExit(0)
          by={}
          for p in ['tag/data/discovery-fast.json','tag/data/discovery.json','tag/data/finviz.json']:
            j=load(p)
            for r in (j.get('rows') or j.get('data') or []):
              t=str(r.get('Ticker') or r.get('ticker') or r.get('Symbol') or '').upper().strip()
              if not re.match(r'^[A-Z][A-Z0-9.\-]{0,9}$',t):continue
              old=by.get(t,{})
              q=dict(old)
              for k,v in r.items():
                if q.get(k) in (None,'') and v not in (None,''):q[k]=v
              if not old:q=dict(r)
              q['Ticker']=t;by[t]=q
          oldrows=prior.get('rows') or {}
          # Keep prior hot names first, then momentum/low-float candidates. Rescue is deliberately
          # narrower than the broad scanner so it can restore a fresh actionable feed quickly.
          prior_hot=sorted(oldrows,key=lambda t:(abs(num(oldrows[t].get('sessionChangePct'))),abs(num(oldrows[t].get('priceVelocity15mPct')))),reverse=True)
          momentum=sorted(by,key=lambda t:(abs(num(by[t].get('Change'))),num(by[t].get('Rel Volume')),num(by[t].get('Volume'))),reverse=True)
          lowfloat=sorted(by,key=lambda t:(num(by[t].get('Float')) if num(by[t].get('Float'))>0 else 1e9,-num(by[t].get('Rel Volume'))))
          tick=[];seen=set()
          for names,cap in [(prior_hot,120),(momentum,180),(lowfloat,120)]:
            n=0
            for t in names:
              if t in seen:continue
              seen.add(t);tick.append(t);n+=1
              if n>=cap:break
          tick=tick[:320]
          def one(t):
            try:
              u='https://query1.finance.yahoo.com/v8/finance/chart/'+urllib.parse.quote(t)+'?interval=5m&range=1d&includePrePost=true'
              req=urllib.request.Request(u,headers={'User-Agent':'Mozilla/5.0 TAGXPremarketRescue/1.0','Accept':'application/json'})
              with urllib.request.urlopen(req,timeout=2.7) as z:j=json.loads(z.read())
              x=(j.get('chart',{}).get('result') or [None])[0]
              if not x:return None
              meta=x.get('meta',{});ts=x.get('timestamp') or [];q=((x.get('indicators',{}).get('quote') or [{}])[0]);cl=q.get('close') or [];vo=q.get('volume') or []
              bars=[(a,float(b),float(c or 0)) for a,b,c in zip(ts,cl,vo) if b is not None]
              rs=((meta.get('currentTradingPeriod') or {}).get('regular') or {}).get('start');prev=meta.get('chartPreviousClose') or meta.get('previousClose')
              ext=[b for b in bars if rs and b[0]<rs]
              if not ext or not prev:return None
              lt,px,_=ext[-1]
              if now.timestamp()-lt>15*60:return None
              def vel(n):
                a=[b for b in ext if b[0]>=lt-n*60];base=a[0][1] if a else None;return ((px/base)-1)*100 if base else None
              ch=(px/prev-1)*100;v5,v15,v30=vel(5),vel(15),vel(30)
              recent=sum(b[2] for b in ext if b[0]>=lt-15*60);older=sum(b[2] for b in ext if lt-30*60<=b[0]<lt-15*60);va=recent/older if older>0 else None
              old=oldrows.get(t,{})
              return t,{'ticker':t,'session':'pre-market','last':px,'timestampUTC':datetime.datetime.fromtimestamp(lt,datetime.timezone.utc).isoformat(),'previousClose':prev,'sessionChangePct':round(ch,3),'changeVsPreviousClosePct':round(ch,3),'priceVelocity5mPct':round(v5,3) if v5 is not None else None,'priceVelocity15mPct':round(v15,3) if v15 is not None else None,'priceVelocity30mPct':round(v30,3) if v30 is not None else None,'extendedVolumeLast15m':recent or None,'volumeAcceleration15m':round(va,3) if va is not None else None,'firstAHSeenUTC':old.get('firstAHSeenUTC') or datetime.datetime.fromtimestamp(lt,datetime.timezone.utc).isoformat(),'firstAHChangePct':old.get('firstAHChangePct') if old.get('firstAHChangePct') is not None else round(ch,3),'peakAHChangePct':max(old.get('peakAHChangePct') or ch,ch),'discoveryQualified':bool(ch>=2 or (v15 or 0)>=1.5 or (va or 0)>=2),'source':'Yahoo Finance premarket-stale-rescue'}
            except:return None
          rows={}
          with concurrent.futures.ThreadPoolExecutor(max_workers=48) as ex:
            for z in ex.map(one,tick):
              if z:rows[z[0]]=z[1]
          if len(rows)<25:
            print('Rescue provider coverage too weak; fail closed and preserve prior snapshot',len(rows))
            raise SystemExit(0)
          out={'schemaVersion':3,'updatedAtUTC':now.isoformat(),'updatedAtET':et.isoformat(),'session':'pre-market','source':'TAGX premarket stale rescue','dataConfidence':'HIGH' if len(rows)>=80 else 'MEDIUM','candidateCount':len(tick),'count':len(rows),'freshCount':len(rows),'fallbackRetainedCount':0,'rescueTriggered':True,'replacedSnapshotAgeMinutes':round(age,1),'rows':rows,'failClosed':False}
          pathlib.Path('tag/data/premarket-hot.json').write_text(json.dumps(out,ensure_ascii=False,indent=2),encoding='utf-8')
          print(json.dumps({'rescue':True,'priorAge':round(age,1),'fresh':len(rows),'candidates':len(tick),'updatedAtET':out['updatedAtET']}))
          PY
      - name: Commit rescue snapshot
        run: |
          git config user.name tagx-premarket-rescue-bot
          git config user.email actions@users.noreply.github.com
          git add tag/data/premarket-hot.json
          git diff --cached --quiet && exit 0
          git commit -m 'data: rescue stale TAGX premarket heartbeat'
          for i in 1 2 3; do git pull --rebase origin main && git push origin HEAD:main && exit 0; sleep $((i*4)); done
          exit 1
