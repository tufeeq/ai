name: TAGX Live Session Daemon

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tagx-live-session-daemon.yml'
  schedule:
    - cron: '*/15 * * * 1-5'

permissions:
  actions: write
  contents: read

concurrency:
  group: tagx-live-session-daemon-main
  cancel-in-progress: false

jobs:
  pulse:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - name: Keep live quotes and forward PIT learning moving through the active US session
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          # 12 pulses x 75s keeps the producer moving almost continuously between
          # the 15-minute daemon starts without relying on GitHub cron precision.
          for i in $(seq 1 12); do
            DOW=$(TZ=America/New_York date +%u)
            HM=$(TZ=America/New_York date +%H%M)
            if [ "$DOW" -gt 5 ] || [ "$HM" -lt 0400 ] || [ "$HM" -gt 2000 ]; then
              echo "Outside 04:00-20:00 ET; stopping daemon at $(TZ=America/New_York date -Iseconds)"
              exit 0
            fi

            echo "Session pulse $i/12 at $(TZ=America/New_York date -Iseconds)"

            gh api --method POST \
              -H "Accept: application/vnd.github+json" \
              "/repos/${REPO}/actions/workflows/tagit-realtime-pit-learning.yml/dispatches" \
              -f ref=main || true

            gh api --method POST \
              -H "Accept: application/vnd.github+json" \
              "/repos/${REPO}/actions/workflows/tagx-live-quotes.yml/dispatches" \
              -f ref=main || true

            [ "$i" -lt 12 ] && sleep 75
          done
