name: TAGit v4.1 Event Conviction Frozen Validation

on:
  workflow_dispatch:
  push:
    paths:
      - 'tagit/event-conviction-v41-backtest.py'
      - 'tag/data/tagit-v39-frozen-groundtruth.json'
      - '.github/workflows/tagit-v41-event-conviction.yml'

permissions:
  contents: write

concurrency:
  group: tagit-v41-event-conviction-main
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Sync main
        run: git pull --rebase origin main
      - name: Install research dependencies
        run: python -m pip install --disable-pip-version-check numpy scikit-learn
      - name: Compile v4.1 policy backtest
        run: python -m py_compile tagit/event-conviction-v41-backtest.py
      - name: Run frozen v4.1 policy validation
        run: python tagit/event-conviction-v41-backtest.py
      - name: Verify frozen contract and non-promotion-by-default
        run: |
          python - <<'PY'
          import json,pathlib
          p=json.loads(pathlib.Path('tag/data/tagit-v41-event-conviction-backtest.json').read_text())
          assert p['datasetSha256']=='19277cfddc8dbeaebee73ce70a6e6fad57213caae87959da7f3e5e859a88773b'
          assert p['policy']=='RESEARCH_ONLY_NO_CHAMPION_OVERRIDE'
          assert p['coverage']['holdout']>0
          assert p['coverage']['holdoutPositives']>0
          assert p['promotionRule']['autoPromotion'] is False
          print(json.dumps({'verdict':p['verdict'],'holdout':p['holdout'],'selectedPolicy':p['selectedPolicy']},indent=2))
          PY
      - name: Commit derived report only
        run: |
          git config user.name tagit-research-bot
          git config user.email actions@users.noreply.github.com
          git add tag/data/tagit-v41-event-conviction-backtest.json
          git diff --cached --quiet && exit 0
          git commit -m 'data: refresh TAGit v4.1 event conviction validation'
          for i in 1 2 3; do
            git pull --rebase --autostash origin main && git push origin HEAD:main && exit 0
            sleep $((i*6))
          done
          exit 1
