name: TAGX Extended Hours Capture

on:
  workflow_dispatch:
  schedule:
    - cron: '*/5 8-13 * * 1-5'
    - cron: '*/5 20-23 * * 1-5'

permissions:
  contents: write

concurrency:
  group: tagx-extended-hours-main
  cancel-in-progress: true

jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - run: git pull --rebase origin main
      - name: Build extended-hours snapshot
        run: |
          python - <<'PY'
          import json, pathlib, urllib.request, urllib.parse, datetime, re, time
          UA='Mozilla/5.0 TAGXResearch/1.0'
          def load(path):
              try:return json.loads(pathlib.Path(path).read_text(encoding='utf-8'))
              except:return {}
          def pct(v):
              try:return float(str(v or 0).replace('%','').replace(',',''))
              except:return 0.0
          pools=[]
          for p in ['tag/data/discovery-fast.json','tag/data/discovery.json','tag/data/finviz.json']:
              j=load(p); rs=j.get('rows') or j.get('data') or []
              pools += rs
          by={}
          for r in pools:
              t=str(r.get('Ticker') or r.get('Symbol') or '').strip().upper()
              if not re.match(r'^[A-Z][A-Z0-9.\-]{0,9}$',t):continue
              old=by.get(t)
              if old is None or abs(pct(r.get('Change')))>abs(pct(old.get('Change'))):by[t]=r
          ranked=sorted(by.values(),key=lambda r:(abs(pct(r.get('Change'))),pct(r.get('Rel Volume')),float(str(r.get('Volume') or 0).replace(',','') or 0)),reverse=True)[:180]
          now=datetime.datetime.now(datetime.timezone.utc)
          out={'updatedAt':now.isoformat(),'source':'Yahoo Finance chart includePrePost=true','rows':{},'count':0,'failClosed':True}
          for r in ranked:
              t=str(r.get('Ticker') or r.get('Symbol')).upper()
              try:
                  url='https://query1.finance.yahoo.com/v8/finance/chart/'+urllib.parse.quote(t)+'?interval=5m&range=1d&includePrePost=true'
                  req=urllib.request.Request(url,headers={'User-Agent':UA,'Accept':'application/json'})
                  with urllib.request.urlopen(req,timeout=12) as resp:j=json.loads(resp.read().decode())
                  res=(j.get('chart',{}).get('result') or [None])[0]
                  if not res:continue
                  meta=res.get('meta',{}); ts=res.get('timestamp') or []; q=((res.get('indicators',{}).get('quote') or [{}])[0]); closes=q.get('close') or []; vols=q.get('volume') or []
                  bars=[(a,b,c or 0) for a,b,c in zip(ts,closes,vols) if b is not None]
                  if not bars:continue
                  last_ts,last_px,last_vol=bars[-1]
                  prev=meta.get('chartPreviousClose') or meta.get('previousClose')
                  if not prev:continue
                  cutoff=last_ts-15*60
                  recent=[b for b in bars if b[0]>=cutoff]
                  p15=recent[0][1] if recent else last_px
                  velocity=((last_px/p15)-1)*100 if p15 else None
                  recent_vol=sum(float(b[2] or 0) for b in recent)
                  prior=[b for b in bars if cutoff-15*60<=b[0]<cutoff]
                  prior_vol=sum(float(b[2] or 0) for b in prior)
                  vaccel=(recent_vol/prior_vol) if prior_vol>0 else None
                  change=((last_px/prev)-1)*100
                  out['rows'][t]={'ticker':t,'last':last_px,'previousClose':prev,'changePct':round(change,3),'velocity15mPct':round(velocity,3) if velocity is not None else None,'volume15m':recent_vol,'volumeAccel15m':round(vaccel,3) if vaccel is not None else None,'timestampUTC':datetime.datetime.fromtimestamp(last_ts,datetime.timezone.utc).isoformat(),'baselineChangePct':pct(r.get('Change')),'source':'Yahoo Finance chart'}
              except Exception:
                  pass
              time.sleep(.03)
          out['count']=len(out['rows'])
          pathlib.Path('tag/data/extended-hours.json').write_text(json.dumps(out,ensure_ascii=False,indent=2),encoding='utf-8')
          print('extended rows',out['count'])
          PY
      - name: Commit snapshot
        run: |
          git config user.name 'tagx-data-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add tag/data/extended-hours.json
          git diff --cached --quiet && exit 0
          git commit -m 'data: refresh TAGX extended-hours snapshot'
          for i in 1 2 3; do git pull --rebase origin main && git push origin HEAD:main && exit 0; sleep $((i*5)); done
          exit 1