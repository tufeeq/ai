name: TAGit v5.31 Asymmetric Recurrent Veto PIT Validation
on:
  push:
    paths:
      - 'tagit/free-pit-training-v531.py'
      - '.github/workflows/tagit-v531-free-pit-training.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      TAGIT_MAX_SYMBOLS: '650'
      TAGIT_HISTORY_DAYS: '730'
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -q numpy scikit-learn
      - name: Syntax check
        run: python -m py_compile tagit/free-pit-training-v531.py
      - name: Run asymmetric recurrent veto validation
        run: python tagit/free-pit-training-v531.py
      - name: Verify evidence contract
        run: |
          python - <<'PY'
          import json, pathlib
          p=pathlib.Path('tag/data/tagit-v531-free-pit-training.json')
          d=json.loads(p.read_text())
          assert d['status']=='COMPLETE'
          assert d['realDiscoveryPrecisionPct'] is None
          assert d['holdoutStatus']=='CONSUMED_RESEARCH_HOLDOUT'
          assert d['providerIntegrity']['marketWidePrecisionClaimAllowed'] is False
          assert d['researchHoldout']['count'] >= 1
          for k in ('precision20Pct','wilsonLower90Pct','dayBlockLower90Pct','activeDays','medianLeadMin','top3DailyPrecisionPct','medianRemainingUpsidePct','winnerDayRecallPct'):
              assert k in d['researchHoldout']
          print(json.dumps(d['researchHoldout'], indent=2))
          PY
      - name: Commit validation evidence
        run: |
          git config user.name 'TAGit Validation Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add tag/data/tagit-v531-free-pit-training.json tag/data/tagit-v531-free-pit-cases.json
          git commit -m 'data: add TAGit v5.31 asymmetric recurrent veto evidence' || exit 0
          git pull --rebase origin main
          git push origin main
