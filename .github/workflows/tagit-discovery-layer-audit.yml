name: TAGit Discovery Layer Audit

on:
  push:
    paths:
      - 'tagit/discovery-layer-audit.mjs'
      - '.github/workflows/tagit-discovery-layer-audit.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          filter: blob:none
          sparse-checkout: |
            tag/data/discovery-fast.json
            tagit/discovery-layer-audit.mjs
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - run: node --check tagit/discovery-layer-audit.mjs
      - run: node tagit/discovery-layer-audit.mjs
      - name: Commit report
        run: |
          git config user.name tagit-validation-bot
          git config user.email actions@users.noreply.github.com
          git add -f tag/data/tagit-discovery-layer-audit.json
          git diff --cached --quiet && exit 0
          git commit -m 'data: update TAGit discovery layer audit'
          git pull --rebase origin main && git push origin HEAD:main
