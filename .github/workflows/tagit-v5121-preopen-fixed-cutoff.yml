name: TAGit v5.12.1 Robust Fixed-Cutoff Pre-Open

on:
  workflow_dispatch:
  push:
    paths:
      - 'tagit/preopen-fixed-cutoff-v5121.py'
      - '.github/workflows/tagit-v5121-preopen-fixed-cutoff.yml'

permissions:
  contents: write

concurrency:
  group: tagit-v5121-preopen-fixed-cutoff
  cancel-in-progress: false

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -q numpy scikit-learn
      - name: Syntax check
        run: python -m py_compile tagit/preopen-fixed-cutoff-v5121.py
      - name: Validate robust fixed-cutoff pre-open architecture
        run: python tagit/preopen-fixed-cutoff-v5121.py
      - name: Verify causal and population contract
        run: |
          python - <<'PY'
          import json, pathlib
          p=pathlib.Path('tag/data/tagit-v5121-preopen-fixed-cutoff.json')
          assert p.exists(), 'v5.12.1 report missing'
          r=json.loads(p.read_text())
          assert r['status'] in ('COMPLETE','INSUFFICIENT_DATA'), r.get('status')
          assert r['cutoffET']=='09:15'
          assert r['realDiscoveryPrecisionPct'] is None or r['universeIntegrity'] is True
          assert 'populationDiagnostics' in r
          if r['status']=='COMPLETE':
              h=r['holdout']; assert 'wilsonLower90Pct' in h; assert 'activeDays' in h
              print('V5.12.1 holdout:',h)
          else:
              print('V5.12.1 population insufficient:',r['data'],r['populationDiagnostics'])
          PY
      - name: Commit evidence
        run: |
          git config user.name "TAGit Research Bot"
          git config user.email "actions@users.noreply.github.com"
          git add tag/data/tagit-v5121-preopen-fixed-cutoff.json
          test ! -f tag/data/tagit-v5121-preopen-cases.json || git add tag/data/tagit-v5121-preopen-cases.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "research: record v5.12.1 robust pre-open evidence"
          git pull --rebase origin main
          git push origin main
