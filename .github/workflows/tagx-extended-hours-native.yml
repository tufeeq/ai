name: TAGX Extended Hours Native — Retired Challenger

on:
  workflow_dispatch:

permissions:
  contents: read

# Retired from scheduled production capture on 2026-08-26.
# This workflow previously wrote schemaVersion 2 to tag/data/extended-hours.json
# every five minutes and raced with tagx-extended-hours.yml, which is the
# authoritative schemaVersion 3 producer. Keeping this file manual-only preserves
# provenance while preventing stale schema-v2 data from overwriting production.

jobs:
  retired-challenger:
    runs-on: ubuntu-latest
    steps:
      - name: Explain retirement
        run: |
          echo 'RETIRED_CHALLENGER_ONLY'
          echo 'Authoritative producer: .github/workflows/tagx-extended-hours.yml'
          echo 'Production output: tag/data/extended-hours.json (schemaVersion 3)'
          echo 'Do not re-enable scheduled writes to the production output without a champion/challenger benchmark.'
