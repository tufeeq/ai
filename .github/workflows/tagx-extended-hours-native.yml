name: TAGX Extended Hours Native

on:
  workflow_dispatch:
  schedule:
    # Offset from the most congested :00/:05 cron boundaries.
    - cron: '2-57/5 * * * 1-5'

permissions:
  contents: write

concurrency:
  group: tagx-extended-hours-native
  cancel-in-progress: true

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - run: git pull --rebase origin main
      - name: Capture native pre-market / after-hours prices
        run: |
          python - <<'PY'
          import json, pathlib, urllib.request, urllib.parse, datetime, concurrent.futures
          from zoneinfo import ZoneInfo

          ROOT=pathlib.Path('tag/data')
          ET=ZoneInfo('America/New_York')
          now=datetime.datetime.now(datetime.timezone.utc)
          now_et=now.astimezone(ET)
          minute=now_et.hour*60+now_et.minute
          if now_et.weekday()>=5 or not (240 <= minute < 570 or 960 <= minute < 1200):
              print('Outside extended-hours window; no capture required')
              raise SystemExit(0)
          session='pre-market' if minute < 570 else 'after-hours'

          def load(name):
              try:return json.loads((ROOT/name).read_text(encoding='utf-8'))
              except Exception:return {}
          def n(v):
              try:return float(str(v or 0).replace('%','').replace(',','').replace('$',''))
              except:return 0.0
          def rows_of(obj):
              if isinstance(obj,list):return obj
              return obj.get('rows') or obj.get('data') or obj.get('results') or []

          fast=load('discovery-fast.json');disc=load('discovery.json');fin=load('finviz.json')
          candidates={}
          def add(row,lane,priority):
              t=str(row.get('Ticker') or row.get('ticker') or row.get('Symbol') or row.get('symbol') or '').strip().upper()
              if not t or len(t)>10:return
              rec=candidates.setdefault(t,{'ticker':t,'lanes':set(),'priority':0,'change':0,'relVol':0,'volume':0})
              rec['lanes'].add(lane);rec['priority']=max(rec['priority'],priority)
              rec['change']=max(rec['change'],abs(n(row.get('Change'))));rec['relVol']=max(rec['relVol'],n(row.get('Rel Volume')));rec['volume']=max(rec['volume'],n(row.get('Volume')))
          for r in rows_of(fast):add(r,'fast',5)
          for r in rows_of(disc):add(r,'discovery',4)
          for r in rows_of(fin):add(r,'movers',3)
          # Freshness is more valuable than broad but stale coverage. 120 symbols/20 workers
          # keeps the capture safely below the five-minute cadence even with partial timeouts.
          ranked=sorted(candidates.values(),key=lambda x:(x['priority'],x['relVol'],x['change'],x['volume']),reverse=True)[:120]

          UA='Mozilla/5.0 TAGXResearch/1.0'
          def fetch_one(rec):
              t=rec['ticker'];url='https://query1.finance.yahoo.com/v8/finance/chart/'+urllib.parse.quote(t)+'?interval=5m&range=1d&includePrePost=true'
              try:
                  req=urllib.request.Request(url,headers={'User-Agent':UA,'Accept':'application/json'})
                  with urllib.request.urlopen(req,timeout=6) as r:j=json.loads(r.read().decode('utf-8'))
                  res=(j.get('chart',{}).get('result') or [None])[0]
                  if not res:return t,None,'NO_RESULT'
                  meta=res.get('meta',{});ts=res.get('timestamp') or [];q=((res.get('indicators',{}).get('quote') or [{}])[0]);cl=q.get('close') or [];vol=q.get('volume') or []
                  bars=[]
                  for a,b,c in zip(ts,cl,vol):
                      if b is None:continue
                      dt=datetime.datetime.fromtimestamp(a,datetime.timezone.utc).astimezone(ET)
                      bars.append((dt,float(b),float(c or 0)))
                  if not bars:return t,None,'NO_BARS'
                  latest=bars[-1];prev=meta.get('chartPreviousClose') or meta.get('previousClose')
                  rth=[b for b in bars if 570 <= b[0].hour*60+b[0].minute < 960]
                  rth_close=rth[-1][1] if rth else (float(meta.get('regularMarketPrice')) if meta.get('regularMarketPrice') else None)
                  ext=[b for b in bars if (240 <= b[0].hour*60+b[0].minute < 570) or (960 <= b[0].hour*60+b[0].minute < 1200)]
                  if session=='pre-market':ext=[b for b in ext if 240 <= b[0].hour*60+b[0].minute < 570];base=float(prev) if prev else None
                  else:ext=[b for b in ext if 960 <= b[0].hour*60+b[0].minute < 1200];base=rth_close
                  last=latest[1];session_ch=((last/base-1)*100) if base else None;prev_ch=((last/float(prev)-1)*100) if prev else None
                  ext_vol=sum(b[2] for b in ext if b[2]>0)
                  price15=(last/ext[-4][1]-1)*100 if len(ext)>=4 and ext[-4][1] else None
                  vol_last15=sum(b[2] for b in ext[-3:]) if ext else 0;vol_prev15=sum(b[2] for b in ext[-6:-3]) if len(ext)>=6 else 0
                  vol_accel=(vol_last15/vol_prev15) if vol_prev15>0 else None
                  return t,{'ticker':t,'session':session,'last':round(last,6),'timestampUTC':latest[0].astimezone(datetime.timezone.utc).isoformat(),'previousClose':prev,'rthClose':rth_close,'sessionBase':base,'changeVsPreviousClosePct':round(prev_ch,3) if prev_ch is not None else None,'sessionChangePct':round(session_ch,3) if session_ch is not None else None,'priceVelocity15mPct':round(price15,3) if price15 is not None else None,'extendedVolume':round(ext_vol,0) if ext_vol>0 else None,'extendedVolumeLast15m':round(vol_last15,0) if vol_last15>0 else None,'volumeAcceleration15m':round(vol_accel,3) if vol_accel is not None else None,'volumeCoverage':'AVAILABLE' if ext_vol>0 else 'UNAVAILABLE_OR_ZERO','lanes':sorted(rec['lanes']),'source':'Yahoo Finance chart includePrePost=true'},None
              except Exception as e:return t,None,type(e).__name__

          out={'schemaVersion':2,'updatedAtUTC':now.isoformat(),'updatedAtET':now_et.isoformat(),'session':session,'source':'Yahoo Finance chart includePrePost=true','candidateCount':len(ranked),'rows':{},'errors':{},'capturePolicy':{'maxCandidates':120,'workers':20,'requestTimeoutSec':6,'freshnessFirst':True}}
          with concurrent.futures.ThreadPoolExecutor(max_workers=20) as ex:
              for t,data,err in ex.map(fetch_one,ranked):
                  if data:out['rows'][t]=data
                  elif err:out['errors'][t]=err
          out['successCount']=len(out['rows']);out['errorCount']=len(out['errors']);out['successRatePct']=round(100*len(out['rows'])/max(1,len(ranked)),1)
          out['dataConfidence']='HIGH' if len(out['rows'])>=max(20,int(len(ranked)*0.7)) else 'LIMITED'
          (ROOT/'extended-hours.json').write_text(json.dumps(out,ensure_ascii=False,indent=2),encoding='utf-8')
          print(json.dumps({'session':session,'candidates':len(ranked),'success':out['successCount'],'successRatePct':out['successRatePct'],'confidence':out['dataConfidence']}))
          PY
      - name: Commit extended-hours snapshot
        run: |
          test -f tag/data/extended-hours.json || exit 0
          git config user.name 'tagx-data-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add tag/data/extended-hours.json
          git diff --cached --quiet && exit 0
          git commit -m 'data(tagx): refresh native extended-hours snapshot'
          for i in 1 2 3; do git pull --rebase origin main && git push origin HEAD:main && exit 0; sleep $((i*5)); done
          exit 1
