name: TAGit v0.6 Funnel Research

on:
  push:
    paths:
      - 'tagit/v06-funnel-research.mjs'
      - '.github/workflows/tagit-v06-funnel-research.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  research:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          filter: blob:none
          sparse-checkout: |
            tag/data/discovery-fast.json
            tagit/v06-funnel-research.mjs
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - run: node --check tagit/v06-funnel-research.mjs
      - run: node tagit/v06-funnel-research.mjs
      - name: Commit research report
        run: |
          git config user.name tagit-research-bot
          git config user.email actions@users.noreply.github.com
          git add -f tag/data/tagit-v06-funnel-research.json
          git diff --cached --quiet && exit 0
          git commit -m 'data: update TAGit v0.6 funnel research'
          git pull --rebase origin main && git push origin HEAD:main
