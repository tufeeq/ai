name: TAG5 Mover Snapshot

on:
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'

permissions:
  contents: write

concurrency:
  group: tag5-market-data-main
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Sync latest main
        run: git pull --rebase origin main

      - name: Fetch Finviz Elite mover universes
        env:
          FINVIZ_TOKEN: ${{ secrets.FINVIZ_TOKEN }}
        run: |
          test -n "$FINVIZ_TOKEN" || (echo "FINVIZ_TOKEN secret is missing" && exit 1)
          mkdir -p tag/data
          for SIGNAL in ta_topgainers ta_unusualvolume ta_mostactive; do
            URL="https://elite.finviz.com/export/screener?s=${SIGNAL}&v=111&auth=${FINVIZ_TOKEN}"
            curl --fail --silent --show-error --location \
              --retry 5 --retry-delay 5 --retry-all-errors \
              "$URL" -o "/tmp/finviz-${SIGNAL}.csv"
            test -s "/tmp/finviz-${SIGNAL}.csv" || (echo "Finviz ${SIGNAL} returned empty" && exit 1)
            sleep 3
          done

      - name: Merge and timestamp TAG5 snapshot
        run: |
          python - <<'PY'
          import csv, json, datetime, pathlib, statistics
          from zoneinfo import ZoneInfo

          signals = ['ta_topgainers', 'ta_unusualvolume', 'ta_mostactive']
          merged = {}
          now_utc = datetime.datetime.now(datetime.timezone.utc)
          now_et = now_utc.astimezone(ZoneInfo('America/New_York'))

          if now_et.weekday() >= 5:
              session = 'closed'
          elif datetime.time(4,0) <= now_et.time() < datetime.time(9,30):
              session = 'pre-market'
          elif datetime.time(9,30) <= now_et.time() < datetime.time(16,0):
              session = 'regular'
          elif datetime.time(16,0) <= now_et.time() <= datetime.time(20,0):
              session = 'after-hours'
          else:
              session = 'closed'

          if session == 'pre-market':
              session_bucket = f"PM{max(1, min(6, now_et.hour - 3))}"
          elif session == 'after-hours':
              session_bucket = f"AH{max(1, min(4, now_et.hour - 15))}"
          elif session == 'regular':
              session_bucket = f"R{now_et.hour:02d}"
          else:
              session_bucket = 'CLOSED'

          # Final Snapshot Reconciliation needs a boundary snapshot, not merely the
          # last arbitrary intraperiod sample. This marks boundary candidates only;
          # they remain training-blocked until independently reconciled.
          is_final_candidate = (
              (session == 'pre-market' and now_et.time() >= datetime.time(9,25)) or
              (session == 'after-hours' and now_et.time() >= datetime.time(19,55))
          )
          snapshot_type = 'final-candidate' if is_final_candidate else 'intraperiod'

          hist_path = pathlib.Path('tag/data/snapshots.json')
          try:
              hist = json.loads(hist_path.read_text(encoding='utf-8')) if hist_path.exists() else []
          except Exception:
              hist = []

          previous_same_session = next((x for x in reversed(hist) if x.get('session') == session), None)
          gap_minutes = None
          if previous_same_session and previous_same_session.get('timestampUTC'):
              try:
                  prev = datetime.datetime.fromisoformat(previous_same_session['timestampUTC'])
                  gap_minutes = round((now_utc - prev).total_seconds() / 60, 2)
              except Exception:
                  pass

          cadence_status = 'OK' if gap_minutes is not None and gap_minutes <= 75 else ('INITIAL' if gap_minutes is None else 'GAP_ERROR')

          # Hour-to-hour persistence must use one representative observation from
          # each hour bucket. Multiple 5-minute samples inside PM5/AH2 must never be
          # treated as PM4->PM5 or AH1->AH2 persistence.
          same_session_hist = [x for x in hist if x.get('session') == session]
          latest_by_bucket = {}
          for snap in same_session_hist:
              b = snap.get('sessionBucket')
              if b:
                  latest_by_bucket[b] = snap

          if session == 'pre-market':
              bucket_order = [f'PM{i}' for i in range(1,7)]
          elif session == 'after-hours':
              bucket_order = [f'AH{i}' for i in range(1,5)]
          else:
              bucket_order = []

          prior_bucket_snaps = [latest_by_bucket[b] for b in bucket_order if b in latest_by_bucket and b != session_bucket]
          persistence_training_eligible = cadence_status == 'OK' and len(prior_bucket_snaps) >= 1

          def pct(v):
              try: return float(str(v or '0').replace('%','').replace(',',''))
              except: return 0.0

          ticker_hist = {}
          for snap in prior_bucket_snaps[-3:]:
              ts = snap.get('timestampUTC')
              b = snap.get('sessionBucket')
              for m in snap.get('topMovers', []):
                  t = (m.get('Ticker') or '').upper()
                  if t:
                      ticker_hist.setdefault(t, []).append((b, ts, pct(m.get('Change'))))

          for signal in signals:
              p = pathlib.Path(f'/tmp/finviz-{signal}.csv')
              with p.open(newline='', encoding='utf-8-sig') as f:
                  rows = list(csv.DictReader(f))
              for row in rows:
                  ticker = (row.get('Ticker') or row.get('Symbol') or '').strip().upper()
                  if not ticker:
                      continue
                  dst = merged.setdefault(ticker, {
                      'Ticker': ticker,
                      '_signals': [],
                      '_snapshotTimestampUTC': now_utc.isoformat(),
                      '_snapshotTimestampET': now_et.isoformat(),
                      '_session': session,
                      '_sessionBucket': session_bucket,
                      '_snapshotType': snapshot_type,
                      '_finalCandidate': is_final_candidate,
                      '_finalReconciled': False,
                      '_trainingEligible': False,
                      '_cadenceStatus': cadence_status,
                      '_persistenceTrainingEligible': persistence_training_eligible,
                      '_independentSourceCount': 1,
                      '_dataIntegrityState': 'PENDING_SECOND_SOURCE'
                  })
                  if signal not in dst['_signals']:
                      dst['_signals'].append(signal)
                  for k, v in row.items():
                      if k and v not in (None, ''):
                          dst[k] = v

          data = list(merged.values())
          for r in data:
              t = r.get('Ticker')
              cur = pct(r.get('Change'))
              hist_pts = ticker_hist.get(t, [])
              pts = [v for _, _, v in hist_pts] + [cur]
              labels = [b for b, _, _ in hist_pts] + [session_bucket]
              r['_persistencePoints'] = pts
              r['_persistenceBuckets'] = labels
              if len(pts) >= 2:
                  base = pts[0]
                  r['_gainRetentionPct'] = round((cur / base) * 100, 1) if abs(base) > 0.01 else None
                  diffs = [pts[i] - pts[i-1] for i in range(1, len(pts))]
                  slope = statistics.mean(diffs)
                  r['_persistenceSlopePctPts'] = round(slope, 2)
                  r['_persistenceTrend'] = 'STRENGTHENING' if slope >= 2 else ('DECAYING' if slope <= -2 else 'FLAT')
              else:
                  r['_gainRetentionPct'] = None
                  r['_persistenceSlopePctPts'] = None
                  r['_persistenceTrend'] = 'INSUFFICIENT_HISTORY'

          data.sort(key=lambda r: pct(r.get('Change')), reverse=True)

          training_block_reasons = ['SINGLE_SOURCE_ONLY', 'FINAL_SNAPSHOT_NOT_RECONCILED']
          if cadence_status == 'GAP_ERROR':
              training_block_reasons.append('SESSION_CADENCE_GAP')
          if session in ('pre-market','after-hours') and not is_final_candidate:
              training_block_reasons.append('NOT_SESSION_BOUNDARY_SNAPSHOT')

          payload = {
              'source': 'Finviz Elite',
              'independentSourceCount': 1,
              'updatedAt': now_utc.isoformat(),
              'snapshotTimestampUTC': now_utc.isoformat(),
              'snapshotTimestampET': now_et.isoformat(),
              'session': session,
              'sessionBucket': session_bucket,
              'snapshotType': snapshot_type,
              'finalCandidate': is_final_candidate,
              'finalSnapshotReconciliation': 'PENDING_SECOND_SOURCE',
              'dataIntegrityState': 'TRAINING_BLOCKED',
              'trainingBlockReasons': training_block_reasons,
              'trainingEligible': False,
              'cadenceStatus': cadence_status,
              'gapMinutesFromPriorSessionSnapshot': gap_minutes,
              'persistenceTrainingEligible': persistence_training_eligible,
              'persistenceMethod': 'UNIQUE_HOURLY_SESSION_BUCKETS',
              'count': len(data),
              'signals': signals,
              'views': [111],
              'rows': data,
              'data': data,
          }
          pathlib.Path('tag/data/finviz.json').write_text(json.dumps(payload, ensure_ascii=False, indent=2), encoding='utf-8')

          compact = {
              'timestampUTC': now_utc.isoformat(),
              'timestampET': now_et.isoformat(),
              'session': session,
              'sessionBucket': session_bucket,
              'snapshotType': snapshot_type,
              'finalCandidate': is_final_candidate,
              'independentSourceCount': 1,
              'trainingEligible': False,
              'finalSnapshotReconciliation': 'PENDING_SECOND_SOURCE',
              'dataIntegrityState': 'TRAINING_BLOCKED',
              'trainingBlockReasons': training_block_reasons,
              'cadenceStatus': cadence_status,
              'gapMinutesFromPriorSessionSnapshot': gap_minutes,
              'persistenceTrainingEligible': persistence_training_eligible,
              'persistenceMethod': 'UNIQUE_HOURLY_SESSION_BUCKETS',
              'topMovers': [
                  {
                      'Ticker': r.get('Ticker'),
                      'Change': r.get('Change'),
                      'Price': r.get('Price'),
                      'Volume': r.get('Volume'),
                      'signals': r.get('_signals', []),
                      'persistenceBuckets': r.get('_persistenceBuckets'),
                      'gainRetentionPct': r.get('_gainRetentionPct'),
                      'persistenceSlopePctPts': r.get('_persistenceSlopePctPts'),
                      'persistenceTrend': r.get('_persistenceTrend'),
                  }
                  for r in data[:100]
              ],
          }
          hist.append(compact)
          hist = hist[-288:]
          hist_path.write_text(json.dumps(hist, ensure_ascii=False, indent=2), encoding='utf-8')
          print(f'Wrote {len(data)} mover rows for {session}/{session_bucket}; type={snapshot_type}; reconciliation pending; cadence={cadence_status}')
          PY

      - name: Commit refreshed data safely
        run: |
          git config user.name "TAG Data Bot"
          git config user.email "actions@users.noreply.github.com"
          git add tag/data/finviz.json tag/data/snapshots.json
          if git diff --cached --quiet; then
            echo "No data change"
            exit 0
          fi
          git commit -m "Refresh TAG5 mover snapshot"
          git pull --rebase origin main
          git push origin main
