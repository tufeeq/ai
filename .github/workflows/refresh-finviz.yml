name: TAG5 Mover Snapshot

on:
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'

permissions:
  contents: write

concurrency:
  group: tag5-market-data-main
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Sync latest main
        run: git pull --rebase origin main

      - name: Fetch Finviz Elite mover universes
        env:
          FINVIZ_TOKEN: ${{ secrets.FINVIZ_TOKEN }}
        run: |
          test -n "$FINVIZ_TOKEN" || (echo "FINVIZ_TOKEN secret is missing" && exit 1)
          mkdir -p tag/data
          for SIGNAL in ta_topgainers ta_unusualvolume ta_mostactive; do
            URL="https://elite.finviz.com/export/screener?s=${SIGNAL}&v=111&auth=${FINVIZ_TOKEN}"
            curl --fail --silent --show-error --location \
              --retry 5 --retry-delay 6 --retry-all-errors \
              "$URL" -o "/tmp/finviz-${SIGNAL}.csv"
            test -s "/tmp/finviz-${SIGNAL}.csv" || (echo "Finviz ${SIGNAL} returned empty" && exit 1)
            sleep 6
          done

      - name: Merge and timestamp TAG5 snapshot
        run: |
          python - <<'PY'
          import csv, json, datetime, pathlib, statistics
          from zoneinfo import ZoneInfo

          signals = ['ta_topgainers', 'ta_unusualvolume', 'ta_mostactive']
          merged = {}
          now_utc = datetime.datetime.now(datetime.timezone.utc)
          now_et = now_utc.astimezone(ZoneInfo('America/New_York'))
          same_day = now_et.date().isoformat()

          if now_et.weekday() >= 5:
              session = 'closed'
          elif datetime.time(4,0) <= now_et.time() < datetime.time(9,30):
              session = 'pre-market'
          elif datetime.time(9,30) <= now_et.time() < datetime.time(16,0):
              session = 'regular'
          elif datetime.time(16,0) <= now_et.time() <= datetime.time(20,0):
              session = 'after-hours'
          else:
              session = 'closed'

          if session == 'pre-market':
              session_bucket = f"PM{max(1, min(6, now_et.hour - 3))}"
          elif session == 'after-hours':
              session_bucket = f"AH{max(1, min(4, now_et.hour - 15))}"
          elif session == 'regular':
              session_bucket = f"R{now_et.hour:02d}"
          else:
              session_bucket = 'CLOSED'

          is_final_candidate = (
              (session == 'pre-market' and now_et.time() >= datetime.time(9,25)) or
              (session == 'after-hours' and now_et.time() >= datetime.time(19,55))
          )
          snapshot_type = 'final-candidate' if is_final_candidate else 'intraperiod'

          hist_path = pathlib.Path('tag/data/snapshots.json')
          try:
              hist = json.loads(hist_path.read_text(encoding='utf-8')) if hist_path.exists() else []
          except Exception:
              hist = []

          previous_same_session = next((
              x for x in reversed(hist)
              if x.get('session') == session and str(x.get('timestampET',''))[:10] == same_day
          ), None)
          gap_minutes = None
          if previous_same_session and previous_same_session.get('timestampUTC'):
              try:
                  prev = datetime.datetime.fromisoformat(previous_same_session['timestampUTC'])
                  gap_minutes = round((now_utc - prev).total_seconds() / 60, 2)
              except Exception:
                  pass
          cadence_status = 'OK' if gap_minutes is not None and gap_minutes <= 15 else ('INITIAL' if gap_minutes is None else 'GAP_ERROR')

          same_day_hist = [x for x in hist if str(x.get('timestampET',''))[:10] == same_day]
          same_session_hist = [x for x in same_day_hist if x.get('session') == session]
          latest_by_bucket = {}
          for snap in same_session_hist:
              b = snap.get('sessionBucket')
              if b:
                  latest_by_bucket[b] = snap

          def build_first_seen(snaps):
              out = {}
              for snap in sorted(snaps, key=lambda x: x.get('timestampUTC','')):
                  for m in snap.get('topMovers', []):
                      t = (m.get('Ticker') or '').upper()
                      if not t:
                          continue
                      obs_et = m.get('firstObservedTimestampET') or snap.get('timestampET')
                      obs_utc = m.get('firstObservedTimestampUTC') or snap.get('timestampUTC')
                      candidate = {
                          'timestampET': obs_et,
                          'timestampUTC': obs_utc,
                          'change': m.get('firstObservedChange', m.get('Change')),
                          'volume': m.get('firstObservedVolume', m.get('Volume')),
                          'bucket': m.get('firstObservedBucket', snap.get('sessionBucket')),
                          'session': m.get('firstObservedSession', snap.get('session')),
                      }
                      old = out.get(t)
                      if old is None or str(candidate.get('timestampUTC') or '') < str(old.get('timestampUTC') or ''):
                          out[t] = candidate
              return out

          first_seen_day = build_first_seen(same_day_hist)
          first_seen_session = build_first_seen(same_session_hist)

          if session == 'pre-market':
              bucket_order = [f'PM{i}' for i in range(1,7)]
          elif session == 'after-hours':
              bucket_order = [f'AH{i}' for i in range(1,5)]
          elif session == 'regular':
              bucket_order = [f'R{i:02d}' for i in range(9,16)]
          else:
              bucket_order = []

          contiguous_prior = []
          bucket_continuity_status = 'NOT_APPLICABLE'
          if session_bucket in bucket_order:
              idx = bucket_order.index(session_bucket)
              j = idx - 1
              while j >= 0 and bucket_order[j] in latest_by_bucket:
                  contiguous_prior.insert(0, latest_by_bucket[bucket_order[j]])
                  j -= 1
              immediate_prev = bucket_order[idx-1] if idx > 0 else None
              if immediate_prev is None:
                  bucket_continuity_status = 'INITIAL_BUCKET'
              elif immediate_prev in latest_by_bucket:
                  bucket_continuity_status = 'CONTIGUOUS'
              else:
                  bucket_continuity_status = 'BUCKET_GAP_ERROR'

          def pct(v):
              try: return float(str(v or '0').replace('%','').replace(',',''))
              except: return 0.0

          def num(v):
              try: return float(str(v or '0').replace(',','').replace('$',''))
              except: return 0.0

          field_integrity_state = 'NOT_APPLICABLE'
          freeze_common_tickers = 0
          change_freeze_ratio = None
          volume_freeze_ratio = None
          change_field_frozen = False
          volume_field_frozen = False
          if session in ('pre-market','after-hours') and previous_same_session:
              prev_map = {
                  str(m.get('Ticker') or '').upper(): m
                  for m in previous_same_session.get('topMovers', [])
                  if m.get('Ticker')
              }
              current_probe = {}
              for signal in signals:
                  p = pathlib.Path(f'/tmp/finviz-{signal}.csv')
                  with p.open(newline='', encoding='utf-8-sig') as f:
                      for row in csv.DictReader(f):
                          t = (row.get('Ticker') or row.get('Symbol') or '').strip().upper()
                          if t and t not in current_probe:
                              current_probe[t] = row
              common = sorted(set(prev_map).intersection(current_probe))
              freeze_common_tickers = len(common)
              if freeze_common_tickers >= 10:
                  change_same = 0
                  volume_same = 0
                  for t in common:
                      pv = prev_map[t]
                      cv = current_probe[t]
                      pchg, cchg = pct(pv.get('Change')), pct(cv.get('Change'))
                      pvol, cvol = num(pv.get('Volume')), num(cv.get('Volume'))
                      if abs(cchg - pchg) <= 0.01:
                          change_same += 1
                      vol_base = max(abs(pvol), 1.0)
                      if abs(cvol - pvol) / vol_base <= 0.001:
                          volume_same += 1
                  change_freeze_ratio = round(change_same / freeze_common_tickers, 4)
                  volume_freeze_ratio = round(volume_same / freeze_common_tickers, 4)
                  change_field_frozen = change_freeze_ratio >= 0.80
                  volume_field_frozen = volume_freeze_ratio >= 0.80
                  field_integrity_state = 'SOURCE_FIELD_FREEZE_SUSPECTED' if (change_field_frozen or volume_field_frozen) else 'CROSS_SNAPSHOT_FIELDS_MOVING'
              else:
                  field_integrity_state = 'UNVERIFIED_EXTENDED_HOURS_FIELDS'
          elif session in ('pre-market','after-hours'):
              field_integrity_state = 'UNVERIFIED_EXTENDED_HOURS_FIELDS'

          prior_bucket_snaps = contiguous_prior[-3:]
          extended_field_ok = (
              session == 'regular' or
              (not change_field_frozen and field_integrity_state == 'CROSS_SNAPSHOT_FIELDS_MOVING')
          )
          persistence_training_eligible = (
              session in ('pre-market','regular','after-hours') and
              cadence_status != 'GAP_ERROR' and
              bucket_continuity_status == 'CONTIGUOUS' and
              len(prior_bucket_snaps) >= 1 and
              extended_field_ok
          )

          ticker_hist = {}
          for snap in prior_bucket_snaps:
              ts = snap.get('timestampUTC')
              b = snap.get('sessionBucket')
              for m in snap.get('topMovers', []):
                  t = (m.get('Ticker') or '').upper()
                  if t:
                      ticker_hist.setdefault(t, []).append((b, ts, pct(m.get('Change'))))

          for signal in signals:
              p = pathlib.Path(f'/tmp/finviz-{signal}.csv')
              with p.open(newline='', encoding='utf-8-sig') as f:
                  rows = list(csv.DictReader(f))
              for row in rows:
                  ticker = (row.get('Ticker') or row.get('Symbol') or '').strip().upper()
                  if not ticker:
                      continue
                  prior_first = first_seen_day.get(ticker)
                  prior_session_first = first_seen_session.get(ticker)
                  dst = merged.setdefault(ticker, {
                      'Ticker': ticker,
                      '_signals': [],
                      '_snapshotTimestampUTC': now_utc.isoformat(),
                      '_snapshotTimestampET': now_et.isoformat(),
                      '_session': session,
                      '_sessionBucket': session_bucket,
                      '_snapshotType': snapshot_type,
                      '_finalCandidate': is_final_candidate,
                      '_finalReconciled': False,
                      '_trainingEligible': False,
                      '_cadenceStatus': cadence_status,
                      '_bucketContinuityStatus': bucket_continuity_status,
                      '_persistenceTrainingEligible': persistence_training_eligible,
                      '_extendedHoursFieldIntegrity': field_integrity_state,
                      '_changeFieldFrozen': change_field_frozen,
                      '_volumeFieldFrozen': volume_field_frozen,
                      '_independentSourceCount': 1,
                      '_dataIntegrityState': 'PENDING_SECOND_SOURCE',
                      '_firstObservedTimestampUTC': (prior_first or {}).get('timestampUTC', now_utc.isoformat()),
                      '_firstObservedTimestampET': (prior_first or {}).get('timestampET', now_et.isoformat()),
                      '_firstObservedSession': (prior_first or {}).get('session', session),
                      '_firstObservedBucket': (prior_first or {}).get('bucket', session_bucket),
                      '_firstObservedChange': (prior_first or {}).get('change', row.get('Change')),
                      '_firstObservedVolume': (prior_first or {}).get('volume', row.get('Volume')),
                      '_firstSessionObservedTimestampUTC': (prior_session_first or {}).get('timestampUTC', now_utc.isoformat()),
                      '_firstSessionObservedTimestampET': (prior_session_first or {}).get('timestampET', now_et.isoformat()),
                      '_firstSessionObservedBucket': (prior_session_first or {}).get('bucket', session_bucket),
                      '_firstActionableSignalTimestampET': None,
                      '_firstActionableSignalNullReason': 'INCOMPLETE_MODEL_INPUTS',
                      '_modelQualificationEvaluated': False,
                      '_qualificationDecision': 'BLOCKED',
                      '_qualificationDecisionTimestampET': now_et.isoformat(),
                      '_qualificationDecisionPhase': 'UNASSESSED',
                      '_qualificationDecisionScore': None,
                      '_qualificationDecisionReasonCodes': [
                          'INCOMPLETE_MODEL_INPUTS',
                          'CATALYST_SWEEP_NOT_AVAILABLE'
                      ],
                  })
                  if signal not in dst['_signals']:
                      dst['_signals'].append(signal)
                  for k, v in row.items():
                      if k and v not in (None, ''):
                          dst[k] = v

          data = list(merged.values())
          for r in data:
              t = r.get('Ticker')
              cur = pct(r.get('Change'))
              hist_pts = ticker_hist.get(t, []) if persistence_training_eligible else []
              pts = [v for _, _, v in hist_pts] + [cur]
              labels = [b for b, _, _ in hist_pts] + [session_bucket]
              r['_persistencePoints'] = pts
              r['_persistenceBuckets'] = labels
              if persistence_training_eligible and len(pts) >= 2:
                  base = pts[0]
                  r['_gainRetentionPct'] = round((cur / base) * 100, 1) if abs(base) > 0.01 else None
                  diffs = [pts[i] - pts[i-1] for i in range(1, len(pts))]
                  slope = statistics.mean(diffs)
                  r['_persistenceSlopePctPts'] = round(slope, 2)
                  r['_persistenceTrend'] = 'STRENGTHENING' if slope >= 2 else ('DECAYING' if slope <= -2 else 'FLAT')
              else:
                  r['_gainRetentionPct'] = None
                  r['_persistenceSlopePctPts'] = None
                  r['_persistenceTrend'] = 'INSUFFICIENT_HISTORY'

          data.sort(key=lambda r: pct(r.get('Change')), reverse=True)

          training_block_reasons = ['SINGLE_SOURCE_ONLY', 'FINAL_SNAPSHOT_NOT_RECONCILED']
          if cadence_status == 'GAP_ERROR':
              training_block_reasons.append('SESSION_CADENCE_GAP')
          if bucket_continuity_status == 'BUCKET_GAP_ERROR':
              training_block_reasons.append('HOURLY_BUCKET_GAP')
          if session in ('pre-market','after-hours') and field_integrity_state != 'CROSS_SNAPSHOT_FIELDS_MOVING':
              training_block_reasons.append(field_integrity_state)
          if session in ('pre-market','after-hours') and not is_final_candidate:
              training_block_reasons.append('NOT_SESSION_BOUNDARY_SNAPSHOT')

          payload = {
              'source': 'Finviz Elite',
              'independentSourceCount': 1,
              'updatedAt': now_utc.isoformat(),
              'snapshotTimestampUTC': now_utc.isoformat(),
              'snapshotTimestampET': now_et.isoformat(),
              'session': session,
              'sessionBucket': session_bucket,
              'snapshotType': snapshot_type,
              'finalCandidate': is_final_candidate,
              'finalSnapshotReconciliation': 'PENDING_SECOND_SOURCE',
              'dataIntegrityState': 'TRAINING_BLOCKED',
              'trainingBlockReasons': training_block_reasons,
              'trainingEligible': False,
              'cadenceStatus': cadence_status,
              'gapMinutesFromPriorSessionSnapshot': gap_minutes,
              'bucketContinuityStatus': bucket_continuity_status,
              'persistenceTrainingEligible': persistence_training_eligible,
              'persistenceMethod': 'CONTIGUOUS_UNIQUE_HOURLY_SESSION_BUCKETS_WITH_EXTENDED_FIELD_FREEZE_GATE',
              'extendedHoursFieldIntegrity': field_integrity_state,
              'fieldFreezeDiagnostics': {
                  'minimumCommonTickers': 10,
                  'freezeThreshold': 0.80,
                  'commonTickers': freeze_common_tickers,
                  'changeFreezeRatio': change_freeze_ratio,
                  'volumeFreezeRatio': volume_freeze_ratio,
                  'changeFieldFrozen': change_field_frozen,
                  'volumeFieldFrozen': volume_field_frozen,
              },
              'firstObservationMethod': 'PRESERVE_EARLIEST_ACROSS_TRADING_DATE_AND_SESSION_SPECIFIC',
              'firstObservedIsActionable': False,
              'actionabilityInstrumentationState': 'COMPLETE_FOR_BLOCKED_CASES',
              'count': len(data),
              'signals': signals,
              'views': [111],
              'rows': data,
              'data': data,
          }
          pathlib.Path('tag/data/finviz.json').write_text(json.dumps(payload, ensure_ascii=False, indent=2), encoding='utf-8')

          compact = {
              'timestampUTC': now_utc.isoformat(),
              'timestampET': now_et.isoformat(),
              'session': session,
              'sessionBucket': session_bucket,
              'snapshotType': snapshot_type,
              'finalCandidate': is_final_candidate,
              'independentSourceCount': 1,
              'trainingEligible': False,
              'finalSnapshotReconciliation': 'PENDING_SECOND_SOURCE',
              'dataIntegrityState': 'TRAINING_BLOCKED',
              'trainingBlockReasons': training_block_reasons,
              'cadenceStatus': cadence_status,
              'gapMinutesFromPriorSessionSnapshot': gap_minutes,
              'bucketContinuityStatus': bucket_continuity_status,
              'persistenceTrainingEligible': persistence_training_eligible,
              'persistenceMethod': 'CONTIGUOUS_UNIQUE_HOURLY_SESSION_BUCKETS_WITH_EXTENDED_FIELD_FREEZE_GATE',
              'extendedHoursFieldIntegrity': field_integrity_state,
              'fieldFreezeDiagnostics': {
                  'commonTickers': freeze_common_tickers,
                  'changeFreezeRatio': change_freeze_ratio,
                  'volumeFreezeRatio': volume_freeze_ratio,
                  'changeFieldFrozen': change_field_frozen,
                  'volumeFieldFrozen': volume_field_frozen,
              },
              'firstObservationMethod': 'PRESERVE_EARLIEST_ACROSS_TRADING_DATE_AND_SESSION_SPECIFIC',
              'actionabilityInstrumentationState': 'COMPLETE_FOR_BLOCKED_CASES',
              'topMovers': [
                  {
                      'Ticker': r.get('Ticker'),
                      'Change': r.get('Change'),
                      'Price': r.get('Price'),
                      'Volume': r.get('Volume'),
                      'signals': r.get('_signals', []),
                      'firstObservedTimestampUTC': r.get('_firstObservedTimestampUTC'),
                      'firstObservedTimestampET': r.get('_firstObservedTimestampET'),
                      'firstObservedSession': r.get('_firstObservedSession'),
                      'firstObservedBucket': r.get('_firstObservedBucket'),
                      'firstObservedChange': r.get('_firstObservedChange'),
                      'firstObservedVolume': r.get('_firstObservedVolume'),
                      'firstSessionObservedTimestampUTC': r.get('_firstSessionObservedTimestampUTC'),
                      'firstSessionObservedTimestampET': r.get('_firstSessionObservedTimestampET'),
                      'firstSessionObservedBucket': r.get('_firstSessionObservedBucket'),
                      'firstActionableSignalTimestampET': r.get('_firstActionableSignalTimestampET'),
                      'firstActionableSignalNullReason': r.get('_firstActionableSignalNullReason'),
                      'modelQualificationEvaluated': r.get('_modelQualificationEvaluated'),
                      'qualificationDecision': r.get('_qualificationDecision'),
                      'qualificationDecisionTimestampET': r.get('_qualificationDecisionTimestampET'),
                      'qualificationDecisionPhase': r.get('_qualificationDecisionPhase'),
                      'qualificationDecisionScore': r.get('_qualificationDecisionScore'),
                      'qualificationDecisionReasonCodes': r.get('_qualificationDecisionReasonCodes'),
                      'persistenceBuckets': r.get('_persistenceBuckets'),
                      'gainRetentionPct': r.get('_gainRetentionPct'),
                      'persistenceSlopePctPts': r.get('_persistenceSlopePctPts'),
                      'persistenceTrend': r.get('_persistenceTrend'),
                      'extendedHoursFieldIntegrity': r.get('_extendedHoursFieldIntegrity'),
                      'changeFieldFrozen': r.get('_changeFieldFrozen'),
                      'volumeFieldFrozen': r.get('_volumeFieldFrozen'),
                  }
                  for r in data[:100]
              ],
          }

          if session != 'closed':
              key = (same_day, session, session_bucket)
              replaced = False
              for i in range(len(hist)-1, -1, -1):
                  h = hist[i]
                  hkey = (str(h.get('timestampET',''))[:10], h.get('session'), h.get('sessionBucket'))
                  if hkey == key:
                      hist[i] = compact
                      replaced = True
                      break
              if not replaced:
                  hist.append(compact)

          hist = hist[-600:]
          hist_path.write_text(json.dumps(hist, ensure_ascii=False, indent=2), encoding='utf-8')
          print(f'Wrote {len(data)} mover rows for {session}/{session_bucket}; type={snapshot_type}; reconciliation pending; cadence={cadence_status}; continuity={bucket_continuity_status}; fieldIntegrity={field_integrity_state}')
          PY

      - name: Commit refreshed data safely
        run: |
          git config user.name "TAG Data Bot"
          git config user.email "actions@users.noreply.github.com"
          git add tag/data/finviz.json tag/data/snapshots.json
          if git diff --cached --quiet; then
            echo "No data change"
            exit 0
          fi
          git commit -m "Refresh TAG5 mover snapshot"
          git pull --rebase origin main
          git push origin main