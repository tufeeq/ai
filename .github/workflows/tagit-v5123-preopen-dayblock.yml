name: TAGit v5.12.3 Day-Block Pre-Open

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'tagit/preopen-fixed-cutoff-v5123.py'

permissions:
  contents: write

concurrency:
  group: tagit-v5123-preopen-dayblock
  cancel-in-progress: false

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -q numpy scikit-learn
      - name: Syntax check
        run: python -m py_compile tagit/preopen-fixed-cutoff-v5123.py
      - name: Train day-block robust pre-open model
        run: python tagit/preopen-fixed-cutoff-v5123.py
      - name: Verify causal and uncertainty contract
        run: |
          python - <<'PY'
          import json, pathlib
          p=pathlib.Path('tag/data/tagit-v5123-preopen-fixed-cutoff.json')
          assert p.exists()
          r=json.loads(p.read_text())
          assert r['status']=='COMPLETE', r.get('status')
          assert r['universeIntegrity'] is False
          assert r['realDiscoveryPrecisionPct'] is None
          assert 'dayBlockBootstrapLower90Pct' in r['holdout']
          assert r['selectionPolicy'].startswith('maximize worst calibration day-block')
          print('V5.12.3 calibration1:',r['calibrationBlock1'])
          print('V5.12.3 calibration2:',r['calibrationBlock2'])
          print('V5.12.3 holdout:',r['holdout'])
          PY
      - name: Commit evidence
        run: |
          git config user.name "TAGit Research Bot"
          git config user.email "actions@users.noreply.github.com"
          git add tag/data/tagit-v5123-preopen-fixed-cutoff.json tag/data/tagit-v5123-preopen-cases.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "research: record v5.12.3 day-block pre-open evidence"
          git pull --rebase origin main
          git push origin main
