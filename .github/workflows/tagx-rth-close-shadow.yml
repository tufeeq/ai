name: TAGX RTH Close Shadow Evaluation

on:
  workflow_dispatch:
  schedule:
    - cron: '5 20 * * 1-5'
  push:
    branches: [main]
    paths:
      - '.github/workflows/tagx-rth-close-shadow.yml'

permissions:
  contents: write

concurrency:
  group: tagx-rth-close-shadow-main
  cancel-in-progress: true

jobs:
  evaluate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Sync latest main
        run: git pull --rebase origin main
      - name: Build RTH close shadow evaluation
        run: |
          python - <<'PY'
          import json, pathlib, datetime
          F=pathlib.Path('tag/data/finviz.json')
          L=pathlib.Path('tag/data/tagx-signal-ledger.json')
          O=pathlib.Path('tag/data/tagx-rth-close-shadow.json')
          if not F.exists() or not L.exists(): raise SystemExit('required inputs missing')
          f=json.loads(F.read_text(encoding='utf-8')); l=json.loads(L.read_text(encoding='utf-8'))
          def rows(p):
              if isinstance(p,list): return p
              for k in ('rows','data','results','stocks','items','records','topMovers'):
                  if isinstance(p.get(k),list): return p[k]
              return []
          def tkr(r): return str(r.get('Ticker') or r.get('ticker') or r.get('Symbol') or r.get('symbol') or '').upper().strip()
          def num(v):
              try:return float(str(v).replace('%','').replace(',','').replace('$','').strip())
              except:return None
          snap=str(f.get('snapshotTimestampET') or f.get('updatedAt') or '')
          day=snap[:10]
          if not day or l.get('sessionDateET')!=day: raise SystemExit('same-session contract failed')
          ranked=[]
          for r in rows(f):
              t=tkr(r); ch=num(r.get('Change') if r.get('Change') is not None else r.get('changePct'))
              if t and ch is not None and ch>0: ranked.append((ch,t,r))
          top=sorted(ranked,reverse=True)[:20]
          details=[]; c={'predictedEarlyUnder10':0,'predictedEarlyUnder20':0,'detectedLate':0,'missed':0,'dataUnverified':0}
          for rank,(ch,t,r) in enumerate(top,1):
              e=(l.get('tickers') or {}).get(t,{})
              pe=e.get('proactiveEver'); pc=e.get('proactiveFirstChangePct'); pts=e.get('proactiveFirstSeenET')
              if pe and isinstance(pc,(int,float)) and pc<10:
                  cls='PREDICTED_EARLY_LT10'; c['predictedEarlyUnder10']+=1; c['predictedEarlyUnder20']+=1
              elif pe and isinstance(pc,(int,float)) and pc<20:
                  cls='PREDICTED_EARLY_LT20'; c['predictedEarlyUnder20']+=1
              elif pe:
                  cls='DETECTED_LATE'; c['detectedLate']+=1
              elif e:
                  cls='MISSED_UNIVERSE'; c['missed']+=1
              else:
                  cls='DATA_UNVERIFIED'; c['dataUnverified']+=1
              details.append({'rank':rank,'ticker':t,'closeShadowChangePct':ch,'classification':cls,'proactiveFirstSeenET':pts,'proactiveFirstChangePct':pc,'originClass':e.get('originClass'),'firstLanes':e.get('proactiveFirstLanes')})
          denom=max(1,len(top)-c['dataUnverified'])
          out={'schemaVersion':1,'evaluationType':'RTH_CLOSE_SHADOW_RESEARCH_ONLY','sessionDateET':day,'generatedAtUTC':datetime.datetime.now(datetime.timezone.utc).isoformat(),'sourceSnapshotET':snap,'benchmark':'LATEST_POST_RTH_REACTIVE_TOP20_POSITIVE','top20Count':len(top),'counts':c,'earlyCaptureUnder10Pct':round(100*c['predictedEarlyUnder10']/denom,1),'earlyCaptureUnder20Pct':round(100*c['predictedEarlyUnder20']/denom,1),'adjustedDenominator':denom,'details':details,'trainingEligible':False,'groundTruthEligible':False,'promotionEligible':False,'notes':'Operational close-shadow only. Must be replaced/validated by Final Snapshot Reconciliation before training, threshold retuning, or champion promotion.'}
          O.write_text(json.dumps(out,ensure_ascii=False,indent=2),encoding='utf-8')
          print('RTH close shadow',day,'Top20',len(top),'EC10',out['earlyCaptureUnder10Pct'],'EC20',out['earlyCaptureUnder20Pct'])
          PY
      - name: Validate fail-closed contract
        run: |
          python - <<'PY'
          import json
          p=json.load(open('tag/data/tagx-rth-close-shadow.json',encoding='utf-8'))
          assert p['evaluationType']=='RTH_CLOSE_SHADOW_RESEARCH_ONLY'
          assert p['trainingEligible'] is False and p['groundTruthEligible'] is False and p['promotionEligible'] is False
          assert 0 <= p['top20Count'] <= 20
          assert 0 <= p['earlyCaptureUnder10Pct'] <= 100 and 0 <= p['earlyCaptureUnder20Pct'] <= 100
          print('shadow contract OK')
          PY
      - name: Commit shadow evaluation
        run: |
          git config user.name "TAGX RTH Close Shadow"
          git config user.email "actions@users.noreply.github.com"
          git add tag/data/tagx-rth-close-shadow.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Update TAGX RTH close shadow evaluation"
          for i in 1 2 3; do
            if git push origin main; then exit 0; fi
            git pull --rebase origin main
          done
          exit 1
