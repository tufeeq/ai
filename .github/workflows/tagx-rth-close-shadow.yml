name: TAGX RTH Close Shadow Evaluation

on:
  workflow_dispatch:
  schedule:
    - cron: '5 20 * * 1-5'
  push:
    branches: [main]
    paths:
      - '.github/workflows/tagx-rth-close-shadow.yml'

permissions:
  contents: write

concurrency:
  group: tagx-rth-close-shadow-main
  cancel-in-progress: true

jobs:
  evaluate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Sync latest main
        run: git pull --rebase origin main
      - name: Build RTH close shadow evaluation
        run: |
          python - <<'PY'
          import json, pathlib, datetime
          S=pathlib.Path('tag/data/snapshots.json')
          L=pathlib.Path('tag/data/tagx-signal-ledger.json')
          T=pathlib.Path('tag/data/tagx-transition-challenger-v3.json')
          O=pathlib.Path('tag/data/tagx-rth-close-shadow.json')
          if not S.exists() or not L.exists(): raise SystemExit('required inputs missing')
          snapshots=json.loads(S.read_text(encoding='utf-8')); ledger=json.loads(L.read_text(encoding='utf-8'))
          transition=json.loads(T.read_text(encoding='utf-8')) if T.exists() and T.stat().st_size else {}
          day=ledger.get('sessionDateET')
          if not day: raise SystemExit('ledger session date missing')
          def rows(p):
              if isinstance(p,list): return p
              if not isinstance(p,dict): return []
              for k in ('rows','data','results','stocks','items','records','topMovers'):
                  if isinstance(p.get(k),list): return p[k]
              return []
          def walk(x,out):
              if isinstance(x,list):
                  for v in x: walk(v,out)
              elif isinstance(x,dict):
                  rs=rows(x)
                  if rs: out.append(x)
                  for k,v in x.items():
                      if k not in ('rows','data','results','stocks','items','records','topMovers') and isinstance(v,(dict,list)): walk(v,out)
          def stamp(p): return str(p.get('snapshotTimestampET') or p.get('updatedAtET') or p.get('timestampET') or p.get('updatedAt') or p.get('snapshotTimestampUTC') or '')
          def regular(p):
              s=str(p.get('session') or p.get('sessionBucket') or p.get('bucket') or '').lower()
              return ('regular' in s) or s=='rth' or s.startswith('r')
          def tkr(r): return str(r.get('Ticker') or r.get('ticker') or r.get('Symbol') or r.get('symbol') or '').upper().strip()
          def num(v):
              try:return float(str(v).replace('%','').replace(',','').replace('$','').strip())
              except:return None
          candidates=[]; walk(snapshots,candidates)
          rth=[p for p in candidates if stamp(p)[:10]==day and regular(p)]
          if not rth: raise SystemExit('no same-session regular snapshot found')
          source=max(rth,key=lambda p:stamp(p)); snap=stamp(source)
          ranked=[]
          for r in rows(source):
              t=tkr(r); ch=num(r.get('Change') if r.get('Change') is not None else r.get('changePct'))
              if t and ch is not None and ch>0: ranked.append((ch,t,r))
          top=sorted(ranked,reverse=True)[:20]
          transition_top=[str(x.get('ticker') or '').upper() for x in (transition.get('topCandidates') or [])[:20] if x.get('ticker')]
          transition_set=set(transition_top)
          close_set={t for _,t,_ in top}
          details=[]; c={'predictedEarlyUnder10':0,'predictedEarlyUnder20':0,'detectedLate':0,'missed':0,'dataUnverified':0}
          rank_captured_early20=0
          for rank,(ch,t,r) in enumerate(top,1):
              e=(ledger.get('tickers') or {}).get(t,{})
              pe=e.get('proactiveEver'); pc=e.get('proactiveFirstChangePct'); pts=e.get('proactiveFirstSeenET')
              if pe and isinstance(pc,(int,float)) and pc<10:
                  cls='PREDICTED_EARLY_LT10'; c['predictedEarlyUnder10']+=1; c['predictedEarlyUnder20']+=1
              elif pe and isinstance(pc,(int,float)) and pc<20:
                  cls='PREDICTED_EARLY_LT20'; c['predictedEarlyUnder20']+=1
              elif pe:
                  cls='DETECTED_LATE'; c['detectedLate']+=1
              elif e:
                  cls='MISSED_UNIVERSE'; c['missed']+=1
              else:
                  cls='DATA_UNVERIFIED'; c['dataUnverified']+=1
              ranked_v3=t in transition_set
              if cls in ('PREDICTED_EARLY_LT10','PREDICTED_EARLY_LT20') and ranked_v3: rank_captured_early20+=1
              details.append({'rank':rank,'ticker':t,'rthCloseShadowChangePct':ch,'classification':cls,'proactiveFirstSeenET':pts,'proactiveFirstChangePct':pc,'originClass':e.get('originClass'),'firstLanes':e.get('proactiveFirstLanes'),'transitionV3Top20':ranked_v3})
          denom=max(1,len(top)-c['dataUnverified'])
          v3_hits=len(close_set.intersection(transition_set))
          early20=max(0,c['predictedEarlyUnder20'])
          out={'schemaVersion':3,'evaluationType':'RTH_CLOSE_SHADOW_RESEARCH_ONLY','sessionDateET':day,'generatedAtUTC':datetime.datetime.now(datetime.timezone.utc).isoformat(),'sourceSnapshotET':snap,'sourceSession':'regular','benchmark':'LAST_SAME_SESSION_REGULAR_SNAPSHOT_TOP20_POSITIVE','top20Count':len(top),'counts':c,'earlyCaptureUnder10Pct':round(100*c['predictedEarlyUnder10']/denom,1),'earlyCaptureUnder20Pct':round(100*c['predictedEarlyUnder20']/denom,1),'adjustedDenominator':denom,'rankingAudit':{'transitionV3ArtifactAvailable':bool(transition_top),'transitionV3Top20VsRthCloseHits':v3_hits,'transitionV3ClosePrecisionAt20Pct':round(100*v3_hits/max(1,len(transition_top)),1) if transition_top else None,'earlyUnder20AlsoRankedByTransitionV3':rank_captured_early20,'earlyUnder20RankingMissCount':max(0,early20-rank_captured_early20),'earlyUnder20RankingCapturePct':round(100*rank_captured_early20/max(1,early20),1) if early20 else None,'interpretation':'Separates discovery coverage from ranking quality. High early capture with low ranking capture indicates ranking/validation debt, not universe debt.'},'details':details,'trainingEligible':False,'groundTruthEligible':False,'promotionEligible':False,'notes':'Operational RTH-close shadow only. Explicitly excludes after-hours snapshots. Must be replaced/validated by Final Snapshot Reconciliation before training, threshold retuning, or champion promotion.'}
          O.write_text(json.dumps(out,ensure_ascii=False,indent=2),encoding='utf-8')
          print('RTH close shadow',day,snap,'Top20',len(top),'EC10',out['earlyCaptureUnder10Pct'],'EC20',out['earlyCaptureUnder20Pct'],'V3 close hits',v3_hits,'ranking early20',rank_captured_early20,'/',early20)
          PY
      - name: Validate fail-closed contract
        run: |
          python - <<'PY'
          import json
          p=json.load(open('tag/data/tagx-rth-close-shadow.json',encoding='utf-8'))
          assert p['schemaVersion']==3
          assert p['evaluationType']=='RTH_CLOSE_SHADOW_RESEARCH_ONLY'
          assert p['sourceSession']=='regular'
          assert p['trainingEligible'] is False and p['groundTruthEligible'] is False and p['promotionEligible'] is False
          assert 0 <= p['top20Count'] <= 20
          assert 0 <= p['earlyCaptureUnder10Pct'] <= 100 and 0 <= p['earlyCaptureUnder20Pct'] <= 100
          ra=p['rankingAudit']; assert ra['earlyUnder20RankingMissCount']>=0
          print('shadow contract OK')
          PY
      - name: Commit shadow evaluation
        run: |
          git config user.name "TAGX RTH Close Shadow"
          git config user.email "actions@users.noreply.github.com"
          git add tag/data/tagx-rth-close-shadow.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Update TAGX RTH close shadow evaluation"
          for i in 1 2 3; do
            if git push origin main; then exit 0; fi
            git pull --rebase origin main
          done
          exit 1
