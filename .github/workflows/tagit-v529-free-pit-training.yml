name: TAGit v5.29 Reliability Recurrent PIT Validation
on:
  push:
    branches: [main]
    paths:
      - 'tagit/free-pit-training-v529.py'
      - '.github/workflows/tagit-v529-free-pit-training.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      APCA_API_KEY_ID: ${{ secrets.APCA_API_KEY_ID }}
      APCA_API_SECRET_KEY: ${{ secrets.APCA_API_SECRET_KEY }}
      TAGIT_MAX_SYMBOLS: '650'
      TAGIT_HISTORY_DAYS: '730'
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -q numpy scikit-learn
      - name: Syntax check
        run: python -m py_compile tagit/free-pit-training-v529.py
      - name: Run reliability recurrent validation
        run: python tagit/free-pit-training-v529.py
      - name: Verify evidence contract
        run: |
          python - <<'PY'
          import json
          p='tag/data/tagit-v529-free-pit-training.json'
          d=json.load(open(p))
          assert d['status']=='COMPLETE'
          assert d['realDiscoveryPrecisionPct'] is None
          assert d['holdoutStatus']=='CONSUMED_RESEARCH_HOLDOUT'
          assert d['providerIntegrity']['marketWidePrecisionClaimAllowed'] is False
          assert d['development']['foldMetrics']
          print(json.dumps({'researchHoldout':d['researchHoldout'],'selectedConfig':d['selectedConfig']},indent=2))
          PY
      - name: Commit validation evidence
        run: |
          git config user.name 'TAGit Validation Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add tag/data/tagit-v529-free-pit-training.json tag/data/tagit-v529-free-pit-cases.json
          git diff --cached --quiet || git commit -m 'data: add TAGit v5.29 reliability recurrent evidence'
          git push
