name: TAGit v3.6 Catalyst Counterfactual Validation

on:
  workflow_dispatch:
  push:
    paths:
      - 'tagit/counterfactual-catalyst-v36.py'
      - '.github/workflows/tagit-v36-catalyst-counterfactual.yml'

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          filter: blob:none
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check numpy scikit-learn
      - name: Syntax check
        run: python -m py_compile tagit/counterfactual-catalyst-v36.py
      - name: Run catalyst counterfactual simulation
        run: python tagit/counterfactual-catalyst-v36.py
      - name: Verify research contract
        run: |
          python - <<'PY'
          import json
          r=json.load(open('tag/data/tagit-v36-catalyst-counterfactual.json'))
          assert r['policy']=='RESEARCH_ONLY_NO_CHAMPION_OVERRIDE'
          assert len(r['results'])==3
          assert 'counterfactual' in r['simulationWarning'].lower()
          print('TAGit v3.6 counterfactual contract PASS')
          PY
      - name: Commit derived report only
        run: |
          git config user.name tagit-v36-research-bot
          git config user.email actions@users.noreply.github.com
          git add tag/data/tagit-v36-catalyst-counterfactual.json
          git diff --cached --quiet && exit 0
          git commit -m 'data: add TAGit v3.6 catalyst counterfactual validation'
          for i in 1 2 3; do
            git pull --rebase --autostash origin main && git push origin HEAD:main && exit 0
            sleep $((i*4))
          done
          exit 1
