name: Repair TAGX Live Publisher

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/repair-live-publisher.yml']

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Patch fail-closed publication order
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('.github/workflows/tagx-live-quotes.yml')
          s=p.read_text()
          old="          if market_session in ('pre-market','regular','after-hours') and fresh<25:raise SystemExit('Fresh quote coverage below fail-closed floor')\n"
          new="          quality_gate_passed=not (market_session in ('pre-market','regular','after-hours') and fresh<25)\n          out['qualityGatePassed']=quality_gate_passed\n          out['qualityGateReason']=None if quality_gate_passed else 'Fresh quote coverage below fail-closed floor'\n          pathlib.Path('tag/data/live-quotes.json').write_text(json.dumps(out,ensure_ascii=False,indent=2),encoding='utf-8')\n"
          if old not in s:
              raise SystemExit('Expected pre-commit freshness gate not found; refusing blind patch')
          s=s.replace(old,new,1)
          marker='          exit 1\n'
          gate="      - name: Enforce quality gate after publication\n        run: |\n          python - <<'PY'\n          import json\n          d=json.load(open('tag/data/live-quotes.json'))\n          if d.get('qualityGatePassed') is False:\n              raise SystemExit(d.get('qualityGateReason') or 'Live quote quality gate failed')\n          PY\n"
          pos=s.rfind(marker)
          if pos<0:
              raise SystemExit('Commit-step marker not found; refusing blind patch')
          pos+=len(marker)
          s=s[:pos]+gate+s[pos:]
          p.write_text(s)
          PY
      - name: Commit repair
        run: |
          git config user.name "TAGX Repair Bot"
          git config user.email "actions@users.noreply.github.com"
          git add .github/workflows/tagx-live-quotes.yml
          git diff --cached --quiet && exit 0
          git commit -m "fix: publish degraded live snapshot before failing quality gate"
          git pull --rebase origin main
          git push origin HEAD:main
