name: TAGit v5.8.3 Multi-Session Failure Archetypes

on:
  workflow_dispatch:
  push:
    paths:
      - 'tagit/multisession-continuation-v583.py'
      - '.github/workflows/tagit-v583-multisession-failure-archetypes.yml'
  workflow_run:
    workflows: ["TAGit v5.8.2 Multi-Session Stability"]
    types: [completed]

permissions:
  contents: write

concurrency:
  group: tagit-v583-multisession-failure-archetypes
  cancel-in-progress: false

jobs:
  research:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event_name == 'push' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -q numpy scikit-learn
      - name: Syntax check
        run: python -m py_compile tagit/multisession-continuation-v583.py
      - name: Train failure-archetype continuation model
        run: python tagit/multisession-continuation-v583.py
      - name: Verify purged failure-pattern contract
        run: |
          python - <<'PY'
          import json, pathlib
          p=pathlib.Path('tag/data/tagit-v583-multisession-failure-archetypes.json')
          assert p.exists()
          r=json.loads(p.read_text())
          assert r['status']=='COMPLETE'
          assert r['trainArchetypes']['failureCases']>0
          assert 'success/failure archetypes fit on train only' in r['antiLeakage']
          assert r['universeIntegrity']['realDiscoveryPrecisionClaimAllowed'] is False
          assert r['credible90Claim'] is False
          h=r['holdout']
          for k in ('count','next1Precision20Pct','wilsonLower90Next1Pct','activeDays','top3DailyPrecision20Pct','medianNext2MaxGainPct','winnerDayRecallPct'):
              assert k in h
          print('V5.8.3 calibration:',r['calibration'])
          print('V5.8.3 holdout:',h)
          PY
      - name: Commit evidence
        run: |
          git config user.name "TAGit Research Bot"
          git config user.email "actions@users.noreply.github.com"
          git add tag/data/tagit-v583-multisession-failure-archetypes.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "research: record v5.8.3 failure-archetype evidence"
          # The training script also refreshes intermediate tracked research files.
          # They are intentionally excluded from this evidence commit; stash them so
          # the rebase cannot fail on unrelated generated working-tree changes.
          git stash push --include-untracked -m "v583-transient-generated-files" || true
          git pull --rebase origin main
          git push origin main
