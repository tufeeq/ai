name: TAGit v5.15 Frozen Forward Preopen Score

on:
  workflow_dispatch:
  push:
    paths:
      - 'tagit/preopen-forward-score-v515.py'
      - '.github/workflows/tagit-v515-forward-score.yml'
      - 'tag/data/tagit-v514-frozen-model.json'
  schedule:
    # Model-bound PIT freeze runs at :05; score at :22 after the immutable snapshot commit.
    # DST companion cleanly no-ops outside the ET validation window.
    - cron: '22 13,14 * * 1-5'

permissions:
  contents: write

concurrency:
  group: tagit-v515-forward-preopen-score
  cancel-in-progress: false

jobs:
  validate-and-score:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install frozen-model runtime
        run: python -m pip install --quiet numpy scikit-learn
      - name: Verify syntax, exact schema and frozen model hash
        run: |
          python -m py_compile tagit/preopen-forward-score-v515.py
          python tagit/preopen-forward-score-v515.py --self-test
      - name: Freeze same-day predictions only in valid ET window
        id: score
        shell: bash
        run: |
          hm=$(TZ=America/New_York date +%H%M)
          if [ "$hm" -lt 0910 ] || [ "$hm" -gt 0925 ]; then
            echo "Outside 09:10-09:25 ET ($hm); integrity-check/DST companion is a clean no-op."
            echo "scored=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          python tagit/preopen-forward-score-v515.py
          echo "scored=true" >> "$GITHUB_OUTPUT"
      - name: Verify immutable no-label model-bound prediction ledger and commit
        if: steps.score.outputs.scored == 'true'
        run: |
          python - <<'PY'
          import json, pathlib
          p=pathlib.Path('tag/data/tagit-v515-forward-predictions.json')
          r=json.loads(p.read_text())
          assert r['policy']=='APPEND_ONLY_PREDICTIONS_BEFORE_OUTCOMES_NO_RETROSPECTIVE_SCORING'
          x=r['predictions'][-1]
          assert x['universeIntegrityEligible'] is True
          assert x['modelBoundUniverseVerified'] is True
          assert x.get('forwardSnapshotHash') and x.get('forwardSnapshotPath')
          assert x['labelsPresent'] is False and x['outcomesPresent'] is False
          assert x['predictionFrozenAtUTC'] > x['captureTimestampUTC']
          assert x['scoredCount'] > 0
          assert x['coveragePct'] >= 50, ('insufficient scoring coverage',x['coveragePct'])
          assert all(row.get('featureVector') and len(row['featureVector'])==21 for row in x['rows'])
          print('model-bound frozen forward set',x['predictionSetId'],'selected',x['selectedCount'],'coverage',x['coveragePct'],'snapshot',x['forwardSnapshotHash'])
          PY
          git config user.name "TAGit Forward Validation Bot"
          git config user.email "actions@users.noreply.github.com"
          git add tag/data/tagit-v515-forward-predictions.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "validation: append v5.15 model-bound frozen predictions"
          git pull --rebase origin main
          git push origin main
