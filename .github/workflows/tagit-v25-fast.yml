name: TAGit v2.5 Fast Pareto Discovery

on:
  push:
    paths:
      - 'tagit/discovery-lab-v25-fast.py'
      - '.github/workflows/tagit-v25-fast.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          filter: blob:none
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check numpy scikit-learn
      - name: Syntax check
        run: python -m py_compile tagit/discovery-lab-v25-fast.py
      - name: Run fast Pareto discovery validation
        run: python tagit/discovery-lab-v25-fast.py
      - name: Commit report
        run: |
          git config user.name tagit-v25-fast-bot
          git config user.email actions@users.noreply.github.com
          git add tag/data/tagit-v25-fast.json
          git diff --cached --quiet && exit 0
          git commit -m 'data: add TAGit v2.5 fast Pareto results'
          for i in 1 2 3; do
            git pull --rebase --autostash origin main && git push origin HEAD:main && exit 0
            sleep $((i*4))
          done
          exit 1
# validation revision: post-catalyst-shadow-accuracy-check
