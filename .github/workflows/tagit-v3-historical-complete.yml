name: TAGit v3 Historical Completion + Ranking Ablation

on:
  workflow_dispatch:
  push:
    paths:
      - 'tagit/historical-feature-builder.py'
      - 'tagit/historical-complete-v3.py'
      - '.github/workflows/tagit-v3-historical-complete.yml'

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          filter: blob:none
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install research dependencies
        run: python -m pip install --disable-pip-version-check numpy scikit-learn
      - name: Syntax check
        run: |
          python -m py_compile tagit/historical-feature-builder.py
          python -m py_compile tagit/historical-complete-v3.py
      - name: Build causal historical completion and run ablation
        run: python tagit/historical-complete-v3.py
      - name: Verify research contract
        run: |
          python - <<'PY'
          import json
          c=json.load(open('tag/data/tagit-historical-v3-coverage.json'))
          r=json.load(open('tag/data/tagit-v3-ablation.json'))
          assert c['rawDatasetPersisted'] is False
          assert c['unknownPolicy']=='UNKNOWN_NOT_ZERO_WITH_MISSING_FLAGS'
          assert len(r['ablation'])==5
          assert r['datasetCoverage']['baseHistory']['rawRows']>=100000
          print('TAGit v3 research contract PASS')
          PY
      - name: Commit derived reports only
        run: |
          git config user.name tagit-v3-research-bot
          git config user.email actions@users.noreply.github.com
          git add tag/data/tagit-historical-v3-coverage.json tag/data/tagit-v3-ablation.json
          git diff --cached --quiet && exit 0
          git commit -m 'data: add TAGit v3 historical completion ablation results'
          for i in 1 2 3; do
            git pull --rebase --autostash origin main && git push origin HEAD:main && exit 0
            sleep $((i*4))
          done
          exit 1
