name: TAGit v5.8.1 Purged Multi-Session

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["TAGit v5.7 Cumulative Opportunity"]
    types: [completed]
  push:
    paths:
      - '.github/workflows/tagit-v581-purged-multisession.yml'
      - 'tagit/multisession-continuation-v581.py'
      - 'tagit/multisession-continuation-v58.py'

permissions:
  contents: write

concurrency:
  group: tagit-v581-purged-multisession
  cancel-in-progress: false

jobs:
  research:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event_name == 'push' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -q numpy scikit-learn
      - name: Syntax check
        run: python -m py_compile tagit/multisession-continuation-v581.py
      - name: Train purged multi-session continuation
        run: python tagit/multisession-continuation-v581.py
      - name: Verify purged chronological contract
        run: |
          python - <<'PY'
          import json, pathlib
          p=pathlib.Path('tag/data/tagit-v581-multisession-continuation.json')
          assert p.exists(), 'v5.8.1 report missing'
          r=json.loads(p.read_text())
          assert r['status']=='COMPLETE', r.get('status')
          v=r['validationHardening']
          assert v['calibrationStart'] < v['holdoutStart']
          assert v['trainBoundaryPurgedRows'] >= 0
          assert v['calibrationBoundaryPurgedRows'] >= 0
          assert 'multi-session label horizons end strictly before the next split boundary' in r['antiLeakage']
          print('V5.8.1 boundary purge:', v)
          print('V5.8.1 calibration:', r.get('calibration'))
          print('V5.8.1 holdout:', r.get('holdout'))
          PY
      - name: Commit purged multi-session evidence
        run: |
          git config user.name "TAGit Research Bot"
          git config user.email "actions@users.noreply.github.com"
          git add tag/data/tagit-v581-multisession-continuation.json tag/data/tagit-v581-multisession-case-library.json tag/data/tagit-v581-carryover-watch.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "research: record v5.8.1 purged multi-session evidence"
          git pull --rebase origin main
          git push origin main
