name: Refresh Finviz Data

on:
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * 1-5'

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch Finviz Elite CSV
        env:
          FINVIZ_TOKEN: ${{ secrets.FINVIZ_TOKEN }}
        run: |
          test -n "$FINVIZ_TOKEN" || (echo "FINVIZ_TOKEN secret missing" && exit 1)
          mkdir -p tag/data
          curl -fL --retry 3 --connect-timeout 20 \
            "https://elite.finviz.com/export/screener?v=111&f=fa_div_pos,sec_technology&auth=${FINVIZ_TOKEN}" \
            -o /tmp/finviz.csv

      - name: Convert CSV to JSON
        run: |
          python - <<'PY'
          import csv, json, datetime, pathlib
          src = pathlib.Path('/tmp/finviz.csv')
          out = pathlib.Path('tag/data/finviz.json')
          with src.open(newline='', encoding='utf-8-sig') as f:
              rows = list(csv.DictReader(f))
          payload = {
              'source': 'Finviz Elite',
              'updatedAt': datetime.datetime.now(datetime.timezone.utc).isoformat(),
              'count': len(rows),
              'rows': rows,
          }
          out.write_text(json.dumps(payload, ensure_ascii=False), encoding='utf-8')
          print(f'Wrote {len(rows)} rows')
          PY

      - name: Commit refreshed data
        run: |
          git config user.name "TAG Data Bot"
          git config user.email "actions@users.noreply.github.com"
          git add tag/data/finviz.json
          git diff --cached --quiet && exit 0
          git commit -m "Refresh Finviz data"
          git push
