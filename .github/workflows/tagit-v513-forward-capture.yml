name: TAGit v5.13 Forward Preopen Capture

on:
  workflow_dispatch:
  schedule:
    # Run at both UTC candidates; the script itself accepts only 09:05-09:25 America/New_York.
    - cron: '12 13,14 * * 1-5'

permissions:
  contents: write

concurrency:
  group: tagit-v513-forward-preopen-capture
  cancel-in-progress: false

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Syntax and dry-run
        run: |
          python -m py_compile tagit/preopen-forward-capture-v513.py
          python tagit/preopen-forward-capture-v513.py --dry-run
      - name: Capture only at valid ET cutoff
        run: |
          python tagit/preopen-forward-capture-v513.py
      - name: Verify and commit append-only capture
        run: |
          python - <<'PY'
          import json, pathlib
          p=pathlib.Path('tag/data/tagit-v513-preopen-forward-ledger.json')
          r=json.loads(p.read_text())
          assert r['policy']=='APPEND_ONLY_POINT_IN_TIME_NO_LABELS_AT_CAPTURE'
          c=r['captures'][-1]
          assert c['status']=='ELIGIBLE' and c['pointInTime'] is True and c['labelsPresent'] is False
          assert c['universeCount']>0
          print('captured universe', c['universeCount'])
          PY
          git config user.name "TAGit Forward Validation Bot"
          git config user.email "actions@users.noreply.github.com"
          git add tag/data/tagit-v513-preopen-forward-ledger.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "validation: append v5.13 point-in-time preopen universe"
          git pull --rebase origin main
          git push origin main
