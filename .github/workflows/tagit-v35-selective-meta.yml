name: TAGit v3.5 Selective Meta Validation

on:
  workflow_dispatch:
  push:
    paths:
      - 'tagit/selective-meta-v35.py'
      - '.github/workflows/tagit-v35-selective-meta.yml'

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check numpy scikit-learn
      - name: Syntax check
        run: python -m py_compile tagit/selective-meta-v35.py
      - name: Run selective meta validation
        run: python tagit/selective-meta-v35.py
      - name: Verify research contract
        run: |
          python - <<'PY'
          import json
          r=json.load(open('tag/data/tagit-v35-selective-meta.json'))
          assert r['policy']=='RESEARCH_ONLY_NO_CHAMPION_OVERRIDE'
          assert r['coverage']['train']>0 and r['coverage']['holdout']>0
          print('TAGit v3.5 selective meta contract PASS')
          PY
      - name: Commit derived report only
        run: |
          git config user.name tagit-v35-research-bot
          git config user.email actions@users.noreply.github.com
          git add tag/data/tagit-v35-selective-meta.json
          git diff --cached --quiet && exit 0
          git commit -m 'data: add TAGit v3.5 selective meta validation'
          for i in 1 2 3; do
            git pull --rebase --autostash origin main && git push origin HEAD:main && exit 0
            sleep $((i*4))
          done
          exit 1
