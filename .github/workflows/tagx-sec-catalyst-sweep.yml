name: TAGX SEC Catalyst Sweep

on:
  workflow_dispatch:
  schedule:
    - cron: '2,7,12,17,22,27,32,37,42,47,52,57 8-23 * * 1-5'

permissions:
  contents: write

concurrency:
  group: tagx-sec-catalyst-sweep-main
  cancel-in-progress: true

jobs:
  sec-sweep:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Sync latest main
        run: git pull --rebase origin main
      - name: Build near-real-time SEC catalyst feed
        env:
          SEC_USER_AGENT: "TAGX research contact tagx@users.noreply.github.com"
        run: |
          python - <<'PY'
          import json, datetime, pathlib, urllib.request, xml.etree.ElementTree as ET, re, os
          from zoneinfo import ZoneInfo

          now=datetime.datetime.now(datetime.timezone.utc)
          et=now.astimezone(ZoneInfo('America/New_York'))
          headers={'User-Agent':os.environ['SEC_USER_AGENT'],'Accept-Encoding':'gzip, deflate','Host':'www.sec.gov'}
          def get_json(url):
              req=urllib.request.Request(url,headers=headers)
              with urllib.request.urlopen(req,timeout=25) as r:return json.loads(r.read().decode())
          def get_text(url):
              req=urllib.request.Request(url,headers=headers)
              with urllib.request.urlopen(req,timeout=25) as r:return r.read().decode('utf-8','replace')

          tickers=get_json('https://www.sec.gov/files/company_tickers.json')
          cik_to_ticker={str(int(v['cik_str'])):str(v['ticker']).upper() for v in tickers.values()}
          atom=get_text('https://www.sec.gov/cgi-bin/browse-edgar?action=getcurrent&output=atom&count=100')
          root=ET.fromstring(atom)
          ns={'a':'http://www.w3.org/2005/Atom'}
          high={'8-K','6-K','S-1','S-1/A','S-3','S-3/A','424B3','424B5','EFFECT','SC 13D','SC 13D/A','SC 13G','SC 13G/A'}
          medium={'4','3','5','DEF 14A','PRE 14A'}
          events=[]
          for e in root.findall('a:entry',ns):
              title=(e.findtext('a:title',default='',namespaces=ns) or '').strip()
              updated=(e.findtext('a:updated',default='',namespaces=ns) or '').strip()
              link=e.find('a:link',ns); href=link.get('href') if link is not None else None
              cat=e.find('a:category',ns); form=(cat.get('term') if cat is not None else '') or ''
              summary=(e.findtext('a:summary',default='',namespaces=ns) or '')
              m=re.search(r'CIK:\s*([0-9]+)',summary)
              if not m:m=re.search(r'\((\d{6,10})\)',title)
              cik=str(int(m.group(1))) if m else None
              ticker=cik_to_ticker.get(cik) if cik else None
              if form not in high and form not in medium:continue
              try: uts=datetime.datetime.fromisoformat(updated.replace('Z','+00:00'))
              except: uts=None
              age_h=(now-uts).total_seconds()/3600 if uts else None
              if age_h is not None and age_h>24:continue
              severity='HIGH' if form in high else 'MEDIUM'
              dilution=form in {'S-1','S-1/A','S-3','S-3/A','424B3','424B5','EFFECT'}
              catalyst=form in {'8-K','6-K','4','SC 13D','SC 13D/A','SC 13G','SC 13G/A'}
              events.append({'ticker':ticker,'cik':cik,'form':form,'title':title,'filedAtUTC':updated,'ageHours':round(age_h,2) if age_h is not None else None,'severity':severity,'dilutionFinancingRisk':dilution,'freshCatalystCandidate':catalyst,'url':href})
          payload={'schemaVersion':1,'source':'SEC EDGAR current filings Atom + SEC company_tickers mapping','sourceType':'PUBLIC_SEC_NEAR_REAL_TIME','updatedAt':now.isoformat(),'updatedAtET':et.isoformat(),'trainingEligible':False,'groundTruthEligible':False,'lookAheadPolicy':'ONLY_FILINGS_PUBLISHED_AT_OR_BEFORE_OBSERVATION_TIME','count':len(events),'events':events}
          p=pathlib.Path('tag/data/sec-catalysts.json');p.parent.mkdir(parents=True,exist_ok=True);p.write_text(json.dumps(payload,ensure_ascii=False,indent=2))
          print('SEC events',len(events),'tickers',sum(1 for x in events if x['ticker']))
          PY
      - name: Commit SEC catalyst feed
        run: |
          git config user.name "TAGX SEC Catalyst Bot"
          git config user.email "actions@users.noreply.github.com"
          git add tag/data/sec-catalysts.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Refresh TAGX SEC catalyst sweep"
          git pull --rebase origin main
          git push origin main
