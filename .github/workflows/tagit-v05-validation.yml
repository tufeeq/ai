name: TAGit v0.5 Validation

on:
  push:
    paths:
      - 'tagit/core.js'
      - 'tagit/app.js'
      - 'tagit/backtest-v05.mjs'
      - '.github/workflows/tagit-v05-validation.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax check
        run: |
          node --check tagit/core.js
          node --check tagit/app.js
          node --check tagit/backtest-v05.mjs
      - name: Run exact-core walk-forward replay
        run: node tagit/backtest-v05.mjs
      - name: Commit validation report
        run: |
          git config user.name tagit-validation-bot
          git config user.email actions@users.noreply.github.com
          git add tag/data/tagit-v05-walkforward.json
          git diff --cached --quiet && exit 0
          git commit -m 'data: update TAGit v0.5 walk-forward validation'
          for i in 1 2 3; do git pull --rebase origin main && git push origin HEAD:main && exit 0; sleep $((i*4)); done
          exit 1
