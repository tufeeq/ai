name: TAGX Cold-Start Audit

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["TAGX Proactive Discovery Universe", "TAGX Fast Discovery Lane"]
    types: [completed]
    branches: [main]
  schedule:
    - cron: '15,45 8-10 * * 1-5'

permissions:
  contents: write

concurrency:
  group: tagx-coldstart-audit-main
  cancel-in-progress: true

jobs:
  audit:
    if: >-
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Sync latest main
        run: git pull --rebase origin main

      - name: Measure standard and fast discovery cold-start
        run: |
          python - <<'PY'
          import json, pathlib, datetime
          from zoneinfo import ZoneInfo

          et=ZoneInfo('America/New_York')
          now=datetime.datetime.now(datetime.timezone.utc)
          day=now.astimezone(et).date().isoformat()

          def load(path):
              try:return json.loads(pathlib.Path(path).read_text(encoding='utf-8'))
              except Exception:return {}
          def parse(s):
              try:return datetime.datetime.fromisoformat(str(s).replace('Z','+00:00')).astimezone(datetime.timezone.utc)
              except Exception:return None
          def earliest(rows, keys):
              vals=[]
              for r in rows or []:
                  t=None
                  for k in keys:
                      t=parse(r.get(k))
                      if t: break
                  if t and t.astimezone(et).date().isoformat()==day: vals.append(t)
              return min(vals) if vals else None
          def lag(a,b):
              if not a or not b:return None
              return (b-a).total_seconds()/60

          d=load('tag/data/discovery.json')
          f=load('tag/data/discovery-fast.json')
          m=load('tag/data/finviz.json')

          mover_first=earliest(m.get('rows',[]),['_firstObservedTimestampUTC'])
          standard_first=earliest(d.get('rows',[]),['_firstObservedTimestampUTC']) or parse(d.get('snapshotTimestampUTC') or d.get('updatedAt'))
          fast_first=earliest(f.get('rows',[]),['_firstFastObservedTimestampUTC','_firstObservedTimestampUTC']) or parse(f.get('snapshotTimestampUTC') or f.get('updatedAt'))

          std_lag=lag(mover_first,standard_first)
          fast_lag=lag(mover_first,fast_first)
          candidates=[x for x in [std_lag,fast_lag] if x is not None]
          best=min(candidates) if candidates else None
          authority='fast_discovery' if fast_lag is not None and (std_lag is None or fast_lag<=std_lag) else ('standard_discovery' if std_lag is not None else None)

          out={
              'schemaVersion':2,
              'sessionDateET':day,
              'updatedAt':now.isoformat(),
              'reactiveFirstObservedUTC':mover_first.isoformat() if mover_first else None,
              'standardDiscoveryFirstObservedUTC':standard_first.isoformat() if standard_first else None,
              'fastDiscoveryFirstObservedUTC':fast_first.isoformat() if fast_first else None,
              'standardColdStartLagMinutes':round(std_lag,2) if std_lag is not None else None,
              'fastColdStartLagMinutes':round(fast_lag,2) if fast_lag is not None else None,
              'bestColdStartLagMinutes':round(best,2) if best is not None else None,
              'bestOperationalLane':authority,
              'targetLagMinutes':8,
              'status':'PASS' if best is not None and best<=8 else ('FAIL' if best is not None else 'DATA_UNVERIFIED'),
              'standardDiscoverySnapshotUTC':d.get('snapshotTimestampUTC') or d.get('updatedAt'),
              'fastDiscoverySnapshotUTC':f.get('snapshotTimestampUTC') or f.get('updatedAt'),
              'standardDiscoveryCount':d.get('count',len(d.get('rows',[]))),
              'fastDiscoveryCount':f.get('count',len(f.get('rows',[]))),
              'moverCount':m.get('count',len(m.get('rows',[]))),
              'trainingEligible':False,
              'purpose':'Operational cadence metric only; never used as market truth or model label.'
          }
          p=pathlib.Path('tag/data/tagx-coldstart-audit.json')
          p.write_text(json.dumps(out,ensure_ascii=False,indent=2),encoding='utf-8')
          print(json.dumps(out,indent=2))
          PY

      - name: Commit audit artifact
        run: |
          git config user.name "TAGX Audit Bot"
          git config user.email "actions@users.noreply.github.com"
          git add tag/data/tagx-coldstart-audit.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Measure TAGX standard and fast discovery cold-start lag"
          git pull --rebase origin main
          git push origin main
