name: TAGit Catalyst History Audit

on:
  push:
    paths:
      - 'tagit/catalyst-history-audit.py'
      - '.github/workflows/tagit-catalyst-history-audit.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          filter: blob:none
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Syntax check
        run: python -m py_compile tagit/catalyst-history-audit.py
      - name: Audit point-in-time catalyst coverage
        run: python tagit/catalyst-history-audit.py
      - name: Commit report
        run: |
          git config user.name tagit-catalyst-audit-bot
          git config user.email actions@users.noreply.github.com
          git add tag/data/tagit-catalyst-history-audit.json
          git diff --cached --quiet && exit 0
          git commit -m 'data: add catalyst history coverage audit'
          for i in 1 2 3; do
            git pull --rebase --autostash origin main && git push origin HEAD:main && exit 0
            sleep $((i*4))
          done
          exit 1
