name: TAG5 Cadence Keeper

on:
  workflow_dispatch:
  schedule:
    - cron: '5,35 * * * 1-5'

permissions:
  actions: write
  contents: read

concurrency:
  group: tag5-cadence-keeper
  cancel-in-progress: true

jobs:
  keep-cadence:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Dispatch TAG5 snapshot every 5 minutes during US extended/regular session
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          for i in $(seq 1 7); do
            DOW=$(TZ=America/New_York date +%u)
            HM=$(TZ=America/New_York date +%H%M)
            if [ "$DOW" -le 5 ] && [ "$HM" -ge 0400 ] && [ "$HM" -le 2000 ]; then
              echo "Dispatching refresh-finviz.yml at $(TZ=America/New_York date -Iseconds)"
              gh api --method POST \
                -H "Accept: application/vnd.github+json" \
                "/repos/${REPO}/actions/workflows/refresh-finviz.yml/dispatches" \
                -f ref=main
            else
              echo "Outside 04:00-20:00 ET; no dispatch at $(TZ=America/New_York date -Iseconds)"
            fi
            [ "$i" -lt 7 ] && sleep 300
          done
