name: TAG5 Cadence Keeper

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/tag5-cadence-keeper.yml']
  schedule:
    # Four off-peak anchors per hour. Each runner supplies four 5-minute pulses.
    # Do not rely on a single 30-minute scheduled runner because GitHub cron can be delayed.
    - cron: '3,18,33,48 * * * 1-5'

permissions:
  actions: write
  contents: read

concurrency:
  group: tag5-cadence-keeper
  # Never cancel a healthy cadence loop because a later cron/push event arrived.
  # Downstream workflows have their own concurrency guards, so duplicate dispatch is safer
  # than a 20-30 minute feed hole.
  cancel-in-progress: false

jobs:
  keep-cadence:
    runs-on: ubuntu-latest
    timeout-minutes: 24
    steps:
      - name: Dispatch TAGX market feeds every 5 minutes during US extended/regular session
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          dispatch() {
            local wf="$1"
            echo "Dispatching ${wf} at $(TZ=America/New_York date -Iseconds)"
            gh api --method POST \
              -H "Accept: application/vnd.github+json" \
              "/repos/${REPO}/actions/workflows/${wf}/dispatches" \
              -f ref=main || echo "WARN: dispatch failed for ${wf}"
          }

          # Four pulses span ~15 minutes; the next off-peak anchor overlaps slightly.
          # Overlap is intentional resilience against delayed scheduled starts.
          for i in $(seq 1 4); do
            DOW=$(TZ=America/New_York date +%u)
            HM=$(TZ=America/New_York date +%H%M)
            if [ "$DOW" -le 5 ] && [ "$HM" -ge 0400 ] && [ "$HM" -le 2000 ]; then
              dispatch refresh-finviz.yml
              dispatch tagx-live-quotes.yml
              dispatch tagx-coverage-rescue.yml
              if [ "$HM" -lt 0930 ]; then
                dispatch tagx-premarket-hot-heartbeat.yml
              fi
            else
              echo "Outside 04:00-20:00 ET; no dispatch at $(TZ=America/New_York date -Iseconds)"
            fi
            [ "$i" -lt 4 ] && sleep 300
          done
