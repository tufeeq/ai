name: TAG5 Cadence Keeper

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tag5-cadence-keeper.yml'
      - 'tag/data/finviz.json'
      - 'tag/data/discovery-fast.json'
      - 'tag/data/discovery.json'
      - 'tag/data/premarket-hot.json'
  schedule:
    - cron: '*/5 * * * 1-5'

permissions:
  actions: write
  contents: read

concurrency:
  group: tag5-cadence-keeper
  cancel-in-progress: false

jobs:
  keep-cadence:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Dispatch TAGX market feeds once per recovery pulse
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
        shell: bash
        run: |
          set -euo pipefail
          DOW=$(TZ=America/New_York date +%u)
          HM=$(TZ=America/New_York date +%H%M)
          if [ "$DOW" -gt 5 ] || [ "$HM" -lt 0400 ] || [ "$HM" -gt 2000 ]; then
            echo "Outside 04:00-20:00 ET; no dispatch at $(TZ=America/New_York date -Iseconds)"
            exit 0
          fi

          dispatch() {
            local wf="$1"
            echo "Dispatching ${wf} at $(TZ=America/New_York date -Iseconds)"
            gh api --method POST \
              -H "Accept: application/vnd.github+json" \
              "/repos/${REPO}/actions/workflows/${wf}/dispatches" \
              -f ref=main || echo "WARN: dispatch failed for ${wf}"
          }

          # Event-driven rescue path: any fresh upstream market-data commit immediately
          # requests a new live-quote snapshot. Do not redispatch the upstream producers
          # here, which avoids feedback loops.
          if [ "$EVENT_NAME" = "push" ]; then
            dispatch tagx-live-quotes.yml
            exit 0
          fi

          # Scheduled/manual recovery pulse keeps all independent market feeds moving.
          dispatch refresh-finviz.yml
          dispatch tagx-live-quotes.yml
          dispatch tagx-coverage-rescue.yml
          dispatch tagx2-sentinel.yml
          dispatch tagx-marketwide-challenger.yml
          dispatch tagx-sec-structural-risk.yml
          if [ "$HM" -lt 0930 ]; then
            dispatch tagx-premarket-hot-heartbeat.yml
          fi
