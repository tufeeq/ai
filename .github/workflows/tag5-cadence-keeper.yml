name: TAG5 Cadence Keeper

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/tag5-cadence-keeper.yml']
  schedule:
    # One short recovery pulse every five minutes. Long sleeping runners proved
    # vulnerable to delayed starts and created 20-40 minute feed holes.
    - cron: '*/5 * * * 1-5'

permissions:
  actions: write
  contents: read

concurrency:
  group: tag5-cadence-keeper
  cancel-in-progress: false

jobs:
  keep-cadence:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Dispatch TAGX market feeds once per recovery pulse
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          DOW=$(TZ=America/New_York date +%u)
          HM=$(TZ=America/New_York date +%H%M)
          if [ "$DOW" -gt 5 ] || [ "$HM" -lt 0400 ] || [ "$HM" -gt 2000 ]; then
            echo "Outside 04:00-20:00 ET; no dispatch at $(TZ=America/New_York date -Iseconds)"
            exit 0
          fi

          dispatch() {
            local wf="$1"
            echo "Dispatching ${wf} at $(TZ=America/New_York date -Iseconds)"
            gh api --method POST \
              -H "Accept: application/vnd.github+json" \
              "/repos/${REPO}/actions/workflows/${wf}/dispatches" \
              -f ref=main || echo "WARN: dispatch failed for ${wf}"
          }

          # Independent one-shot dispatches. Downstream jobs own their own concurrency.
          dispatch refresh-finviz.yml
          dispatch tagx-live-quotes.yml
          dispatch tagx-coverage-rescue.yml
          if [ "$HM" -lt 0930 ]; then
            dispatch tagx-premarket-hot-heartbeat.yml
          fi
