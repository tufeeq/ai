name: TAG5 Cadence Keeper

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/tag5-cadence-keeper.yml']
  schedule:
    - cron: '5,35 * * * 1-5'

permissions:
  actions: write
  contents: read

concurrency:
  group: tag5-cadence-keeper
  cancel-in-progress: true

jobs:
  keep-cadence:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Dispatch TAGX market feeds every 5 minutes during US extended/regular session
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          dispatch() {
            local wf="$1"
            echo "Dispatching ${wf} at $(TZ=America/New_York date -Iseconds)"
            gh api --method POST \
              -H "Accept: application/vnd.github+json" \
              "/repos/${REPO}/actions/workflows/${wf}/dispatches" \
              -f ref=main || echo "WARN: dispatch failed for ${wf}"
          }

          for i in $(seq 1 7); do
            DOW=$(TZ=America/New_York date +%u)
            HM=$(TZ=America/New_York date +%H%M)
            if [ "$DOW" -le 5 ] && [ "$HM" -ge 0400 ] && [ "$HM" -le 2000 ]; then
              dispatch refresh-finviz.yml
              dispatch tagx-live-quotes.yml
              # Coverage rescue scans market-wide Yahoo predefined movers independently of TAGX's existing universe.
              # It is discovery-only: it cannot certify training truth or create a BUY by itself.
              dispatch tagx-coverage-rescue.yml
              if [ "$HM" -lt 0930 ]; then
                dispatch tagx-premarket-hot-heartbeat.yml
              fi
            else
              echo "Outside 04:00-20:00 ET; no dispatch at $(TZ=America/New_York date -Iseconds)"
            fi
            [ "$i" -lt 7 ] && sleep 300
          done