name: TAGX Velocity Challenger

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["TAGX Proactive Discovery Universe"]
    types: [completed]

permissions:
  contents: write

concurrency:
  group: tagx-velocity-challenger
  cancel-in-progress: true

jobs:
  velocity:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 20

      - name: Resolve consecutive discovery snapshots
        run: |
          set -euo pipefail
          test -f tag/data/discovery.json
          CURRENT_COMMIT=$(git log -1 --format=%H -- tag/data/discovery.json)
          test -n "$CURRENT_COMMIT"
          PRIOR_COMMIT=$(git log --format=%H --skip=1 -1 -- tag/data/discovery.json)
          test -n "$PRIOR_COMMIT" || (echo "No prior discovery snapshot commit" && exit 1)
          git show "${PRIOR_COMMIT}:tag/data/discovery.json" > /tmp/prior-discovery.json
          echo "current=$CURRENT_COMMIT"
          echo "prior=$PRIOR_COMMIT"

      - name: Compute challenger velocity telemetry
        run: |
          python tag/model/tagx_velocity_engine.py \
            tag/data/discovery.json \
            /tmp/prior-discovery.json \
            tag/data/tagx-velocity.json

      - name: Validate fail-closed output
        run: |
          python - <<'PY'
          import json
          p=json.load(open('tag/data/tagx-velocity.json',encoding='utf-8'))
          assert p['engine']=='TAGX_CHALLENGER_VELOCITY_V1'
          assert 0 < p['elapsedMinutes'] <= 30
          assert p['matchedTickers'] > 0
          assert isinstance(p['top'],list)
          print('validated', p['matchedTickers'], 'matched tickers')
          PY

      - name: Commit shadow telemetry
        run: |
          git config user.name "TAGX Challenger Bot"
          git config user.email "actions@users.noreply.github.com"
          git add tag/data/tagx-velocity.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Update TAGX challenger velocity telemetry"
          git pull --rebase origin main
          git push origin main
