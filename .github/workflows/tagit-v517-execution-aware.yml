name: TAGit v5.17 Execution-Aware Forward Validation

on:
  workflow_dispatch:
  push:
    paths:
      - 'tagit/preopen-execution-aware-v517.py'
      - '.github/workflows/tagit-v517-execution-aware.yml'
  schedule:
    - cron: '40 20,21 * * 1-5'

permissions:
  contents: write

concurrency:
  group: tagit-v517-execution-aware
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify evaluator
        run: |
          python -m py_compile tagit/preopen-execution-aware-v517.py
          python tagit/preopen-execution-aware-v517.py --self-test
      - name: Evaluate completed frozen predictions
        id: evaluate
        shell: bash
        run: |
          hm=$(TZ=America/New_York date +%H%M)
          if [ "$hm" -lt 1615 ] || [ "$hm" -gt 1845 ]; then
            echo "Outside post-session window ($hm); validation-only clean no-op."
            echo "evaluated=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ ! -f tag/data/tagit-v515-forward-predictions.json ]; then
            echo "No frozen v5.15 prediction ledger yet; clean no-op."
            echo "evaluated=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          python tagit/preopen-execution-aware-v517.py
          echo "evaluated=true" >> "$GITHUB_OUTPUT"
      - name: Verify and commit derived report
        if: steps.evaluate.outputs.evaluated == 'true'
        run: |
          python - <<'PY'
          import json, pathlib
          p=pathlib.Path('tag/data/tagit-v517-execution-aware.json')
          x=json.loads(p.read_text())
          assert x['schemaVersion']=='5.17-execution-aware'
          m=x['metrics']
          assert x['realActionablePrecisionPct'] is None or (m['adequateIndependentSupport'] and m['universeIntegrity'])
          print('v5.17 support',m['independentTickerDays'],'execution precision',m['executionAwarePrecisionPct'],'real',x['realActionablePrecisionPct'])
          PY
          git config user.name "TAGit Forward Validation Bot"
          git config user.email "actions@users.noreply.github.com"
          git add tag/data/tagit-v517-execution-aware.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "validation: update v5.17 execution-aware forward report"
          git pull --rebase origin main
          git push origin main
