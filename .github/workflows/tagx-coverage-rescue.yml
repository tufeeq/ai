name: TAGX Coverage Rescue Lane

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/tagx-coverage-rescue.yml']
  schedule:
    - cron: '3,8,13,18,23,28,33,38,43,48,53,58 * * * *'

permissions:
  contents: write

concurrency:
  group: tagx-coverage-rescue-main
  cancel-in-progress: true

jobs:
  rescue:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Sync latest main
        run: git pull --rebase origin main
      - name: Build discovery-only coverage rescue snapshot
        run: |
          python - <<'PY'
          import json, pathlib, datetime, urllib.request, urllib.parse, concurrent.futures, time
          from zoneinfo import ZoneInfo

          ET=ZoneInfo('America/New_York')
          now_utc=datetime.datetime.now(datetime.timezone.utc)
          now_et=now_utc.astimezone(ET)
          started=time.monotonic()

          def session_for(dt):
              tm=dt.time()
              if dt.weekday()>=5:return 'closed'
              if datetime.time(4,0)<=tm<datetime.time(9,30):return 'pre-market'
              if datetime.time(9,30)<=tm<datetime.time(16,0):return 'regular'
              if datetime.time(16,0)<=tm<=datetime.time(20,0):return 'after-hours'
              return 'closed'

          market_session=session_for(now_et)
          headers={'User-Agent':'Mozilla/5.0 TAGXCoverageRescue/1.0','Accept':'application/json'}
          screeners=['day_gainers','most_actives','small_cap_gainers']
          seed=[]; screener_diag=[]; meta={}

          for scr in screeners:
              try:
                  url='https://query1.finance.yahoo.com/v1/finance/screener/predefined/saved?'+urllib.parse.urlencode({'count':100,'scrIds':scr})
                  req=urllib.request.Request(url,headers=headers)
                  with urllib.request.urlopen(req,timeout=4) as r:data=json.loads(r.read().decode('utf-8'))
                  results=((data.get('finance') or {}).get('result') or [])
                  quotes=(results[0].get('quotes') or []) if results else []
                  added=0
                  for q in quotes:
                      t=str(q.get('symbol') or '').strip().upper()
                      if not t or len(t)>12:continue
                      if t not in meta:
                          seed.append(t);added+=1
                          meta[t]={
                              'screener':scr,
                              'screenerPrice':q.get('regularMarketPrice'),
                              'screenerChangePct':q.get('regularMarketChangePercent'),
                              'screenerVolume':q.get('regularMarketVolume'),
                              'marketCap':q.get('marketCap')
                          }
                  screener_diag.append({'screener':scr,'ok':True,'rows':len(quotes),'newSymbols':added})
              except Exception as e:
                  screener_diag.append({'screener':scr,'ok':False,'error':str(e)[:180]})

          # Known same-session candidates from current TAGX sources are appended only for coverage comparison.
          def load(path):
              try:return json.loads(pathlib.Path(path).read_text(encoding='utf-8'))
              except:return {}
          for src in ('tag/data/finviz.json','tag/data/live-quotes.json'):
              d=load(src)
              rows=d.get('rows') or d.get('emergingCandidates') or []
              if isinstance(rows,dict):rows=list(rows.values())
              for q in rows[:120]:
                  t=str(q.get('Ticker') or q.get('ticker') or '').strip().upper()
                  if t and len(t)<=12 and t not in meta:
                      seed.append(t);meta[t]={'screener':'tagx_append'}

          seed=seed[:320]

          def pct(p,b):return ((p-b)/b*100.0) if p is not None and b not in (None,0) else None
          def one(ticker):
              try:
                  url='https://query1.finance.yahoo.com/v8/finance/chart/'+urllib.parse.quote(ticker)+'?interval=1m&range=1d&includePrePost=true'
                  req=urllib.request.Request(url,headers=headers)
                  with urllib.request.urlopen(req,timeout=3.5) as r:data=json.loads(r.read().decode('utf-8'))
                  result=((data.get('chart') or {}).get('result') or [None])[0]
                  if not result:return ticker,None,'empty'
                  m=result.get('meta') or {}; ts=result.get('timestamp') or []
                  q=((result.get('indicators') or {}).get('quote') or [{}])[0]
                  closes=q.get('close') or []; vols=q.get('volume') or []; pts=[]
                  for i,t in enumerate(ts):
                      if i>=len(closes) or closes[i] is None:continue
                      dt=datetime.datetime.fromtimestamp(t,datetime.timezone.utc).astimezone(ET)
                      pts.append((t,dt,session_for(dt),float(closes[i]),int(vols[i] or 0) if i<len(vols) else 0))
                  if not pts:return ticker,None,'no points'
                  latest=pts[-1]; active=[p for p in pts if p[2]==market_session] if market_session!='closed' else pts
                  prev=m.get('previousClose') if m.get('previousClose') is not None else m.get('chartPreviousClose')
                  prev=float(prev) if prev is not None else None
                  def px_ago(minutes):
                      cutoff=latest[0]-minutes*60; before=[p for p in active if p[0]<=cutoff]
                      return before[-1][3] if before else (active[0][3] if active else None)
                  def vol_window(start,end=0):
                      lo=latest[0]-start*60; hi=latest[0]-end*60
                      return sum(p[4] for p in active if lo < p[0] <= hi)
                  v5=pct(latest[3],px_ago(5)); v15=pct(latest[3],px_ago(15)); vol5=vol_window(5); prev5=vol_window(10,5)
                  acc=(vol5/prev5) if prev5>0 else (5.0 if vol5>0 else None)
                  ch=pct(latest[3],prev); age=(now_utc.timestamp()-latest[0])/60
                  d=meta.get(ticker,{})
                  out={'ticker':ticker,'price':latest[3],'changePct':round(ch,3) if ch is not None else None,'priceVelocity5mPct':round(v5,3) if v5 is not None else None,'priceVelocity15mPct':round(v15,3) if v15 is not None else None,'volume5m':vol5,'volumeAcceleration5m':round(acc,3) if acc is not None else None,'timestampET':latest[1].isoformat(),'quoteAgeMin':round(age,2),'session':latest[2],'sourceLane':'coverage_rescue','seedSource':d.get('screener'),'screenerChangePct':d.get('screenerChangePct'),'screenerVolume':d.get('screenerVolume')}
                  return ticker,out,None
              except Exception as e:return ticker,None,str(e)[:180]

          quotes={}; errors=[]
          with concurrent.futures.ThreadPoolExecutor(max_workers=40) as ex:
              for f in concurrent.futures.as_completed([ex.submit(one,t) for t in seed]):
                  t,q,e=f.result()
                  if q:quotes[t]=q
                  elif e:errors.append({'ticker':t,'error':e})

          fresh=[q for q in quotes.values() if q.get('quoteAgeMin',999)<=8 and q.get('session')==market_session]
          movers=[q for q in fresh if q.get('changePct') is not None and q['changePct']>=2]
          movers.sort(key=lambda q:q.get('changePct') or -999,reverse=True)
          early=[q for q in fresh if q.get('changePct') is not None and 1<=q['changePct']<14 and (q.get('priceVelocity5mPct') or 0)>0]
          early.sort(key=lambda q:((q.get('volumeAcceleration5m') or 0),(q.get('priceVelocity5mPct') or 0)),reverse=True)
          out={
            'schemaVersion':1,
            'updatedAtUTC':now_utc.isoformat(),
            'updatedAtET':now_et.isoformat(),
            'marketClockSession':market_session,
            'source':'Yahoo predefined screeners + Yahoo 1m chart, discovery-only coverage rescue',
            'independentSourceCount':1,
            'trainingEligible':False,
            'executionEligibleByItself':False,
            'policy':'DISCOVERY_ONLY_NOT_GROUND_TRUTH_NOT_BUY',
            'seedCount':len(seed),'quoteCount':len(quotes),'freshCount':len(fresh),
            'topMoverCount':len(movers),'earlyCount':len(early),
            'scanDurationSec':round(time.monotonic()-started,2),
            'screenerDiagnostics':screener_diag,
            'topMovers':movers[:40],
            'earlyCandidates':early[:40],
            'errors':errors[:30]
          }
          pathlib.Path('tag/data/coverage-rescue.json').write_text(json.dumps(out,ensure_ascii=False,indent=2),encoding='utf-8')
          print(json.dumps({'session':market_session,'seed':len(seed),'quotes':len(quotes),'fresh':len(fresh),'movers':len(movers),'early':len(early),'duration':out['scanDurationSec'],'screeners':screener_diag}))
          if market_session in ('pre-market','regular','after-hours') and len(fresh)<20:
              raise SystemExit('Coverage rescue fresh coverage below fail-closed floor')
          PY
      - name: Commit coverage rescue snapshot
        run: |
          git config user.name "TAGX Coverage Rescue Bot"
          git config user.email "actions@users.noreply.github.com"
          git add tag/data/coverage-rescue.json
          git diff --cached --quiet && exit 0
          git commit -m "data: refresh TAGX coverage rescue movers"
          for i in 1 2 3; do git pull --rebase origin main && git push origin HEAD:main && exit 0; sleep $((i*4)); done
          exit 1
