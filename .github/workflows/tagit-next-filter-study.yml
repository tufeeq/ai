name: TAGit NEXT filter study

# Pre-registered filters (filter-study-1) on consolidated signals; development/holdout split.
on:
  workflow_dispatch:
    inputs:
      from:
        description: First session (YYYY-MM-DD)
        default: '2026-01-02'
      to:
        description: Last session (YYYY-MM-DD)
        default: '2026-09-24'
  push:
    branches: ['claude/**']
    paths: ['tagit-next/pipeline/filter_study.mjs', '.github/workflows/tagit-next-filter-study.yml']

permissions:
  contents: write
  actions: write  # request a Pages deploy after publishing

concurrency:
  group: tagit-next-filter-study-${{ github.ref }}
  cancel-in-progress: false

jobs:
  filters:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Tests
        run: node --test tagit-next/tests/filterstudy.test.mjs
      - name: Study
        env:
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT || 'TAGit NEXT research tufeeq11@gmail.com' }}
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            node tagit-next/pipeline/filter_study.mjs --from "$(date -u -d '-3 days' +%F)" --to "$(date -u -d '-1 day' +%F)" --max-minutes 40
          else
            node tagit-next/pipeline/filter_study.mjs --from "${{ github.event.inputs.from }}" --to "${{ github.event.inputs.to }}" --max-minutes 320
          fi
      - name: Keep per-signal features and outcomes
        uses: actions/upload-artifact@v4
        with:
          name: filter-rows-${{ github.run_id }}
          path: filter-rows.json.gz
          retention-days: 90
      - uses: actions/upload-artifact@v4
        with:
          name: filter-study
          path: tagit-next/data/filter-study.json
      - name: Publish (main)
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name 'github-actions'
          git config user.email 'github-actions@github.com'
          git add tagit-next/data/filter-study.json
          git diff --cached --quiet && { echo 'No change'; exit 0; }
          git commit -m 'data: TAGit NEXT filter study'
          for attempt in 1 2 3 4; do
            if git pull --rebase --autostash origin main && git push origin HEAD:main; then
              gh workflow run pages-tagx-deploy.yml --ref main
              exit 0
            fi
            sleep $((attempt * 5))
          done
          exit 1
