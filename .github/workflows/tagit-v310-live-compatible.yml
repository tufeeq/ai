name: TAGit v3.10 Live Compatible Benchmark

on:
  workflow_dispatch:
  push:
    paths:
      - 'tagit/live-compatible-v310.py'
      - '.github/workflows/tagit-v310-live-compatible.yml'

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check numpy scikit-learn
      - name: Syntax check
        run: python -m py_compile tagit/live-compatible-v310.py
      - name: Run frozen live-compatible benchmark
        run: python tagit/live-compatible-v310.py
      - name: Verify contract
        run: |
          python - <<'PY'
          import json
          r=json.load(open('tag/data/tagit-v310-live-compatible.json'))
          assert r['policy']=='RESEARCH_ONLY_NO_CHAMPION_OVERRIDE'
          assert r['datasetSha256']=='19277cfddc8dbeaebee73ce70a6e6fad57213caae87959da7f3e5e859a88773b'
          assert [x['featureCount'] for x in r['results']] == [11,17,21,34]
          print('TAGit v3.10 contract PASS')
          PY
      - name: Commit derived report only
        run: |
          git config user.name tagit-v310-research-bot
          git config user.email actions@users.noreply.github.com
          git add tag/data/tagit-v310-live-compatible.json
          git diff --cached --quiet && exit 0
          git commit -m 'data: add TAGit v3.10 live-compatible benchmark'
          for i in 1 2 3; do
            git pull --rebase --autostash origin main && git push origin HEAD:main && exit 0
            sleep $((i*4))
          done
          exit 1
