name: TAGX Live Quote Reconciliation V8

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/tagx-live-quotes.yml']
  schedule:
    - cron: '1,6,11,16,21,26,31,36,41,46,51,56 * * * *'

permissions:
  contents: write

concurrency:
  group: tagx-live-quotes-main
  cancel-in-progress: false

jobs:
  refresh-live-quotes:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Sync latest main
        run: git pull --rebase origin main
      - name: Build live quote feed with liquidity accumulation detection
        run: |
          python - <<'PY'
          import json,pathlib,datetime,urllib.request,urllib.parse,concurrent.futures,time,math
          from zoneinfo import ZoneInfo
          ET=ZoneInfo('America/New_York'); now_utc=datetime.datetime.now(datetime.timezone.utc); now_et=now_utc.astimezone(ET); started=time.monotonic()
          def session_for(dt):
              tm=dt.time()
              if dt.weekday()>=5:return 'closed'
              if datetime.time(4,0)<=tm<datetime.time(9,30):return 'pre-market'
              if datetime.time(9,30)<=tm<datetime.time(16,0):return 'regular'
              if datetime.time(16,0)<=tm<=datetime.time(20,0):return 'after-hours'
              return 'closed'
          market_session=session_for(now_et)
          def load(p):
              try:return json.loads(pathlib.Path(p).read_text(encoding='utf-8'))
              except:return {}
          def sym(r):return str(r.get('Ticker') or r.get('ticker') or r.get('Symbol') or r.get('symbol') or '').strip().upper()
          def num(v):
              try:return float(str(v or '').replace('%','').replace(',','').replace('$',''))
              except:return 0.0
          prior=load('tag/data/live-quotes.json'); pre=load('tag/data/premarket-hot.json'); fast=load('tag/data/discovery-fast.json'); disc=load('tag/data/discovery.json'); finviz=load('tag/data/finviz.json')
          disc_map={sym(r):r for r in (disc.get('rows') or []) if sym(r)}
          lanes=[];lanes.append(('prior_active',list((prior.get('quotes') or {}).keys())))
          pre_rows=list((pre.get('rows') or {}).values()) if isinstance(pre.get('rows'),dict) else (pre.get('rows') or []);pre_rows.sort(key=lambda r:(abs(num(r.get('sessionChangePct'))),abs(num(r.get('priceVelocity15mPct')))),reverse=True);lanes.append(('premarket_hot',[sym(r) for r in pre_rows]))
          fast_rows=fast.get('rows') or [];fast_rows.sort(key=lambda r:(abs(num(r.get('Change'))),num(r.get('Rel Volume') or r.get('Relative Volume'))),reverse=True);lanes.append(('fast_discovery',[sym(r) for r in fast_rows]))
          disc_rows=disc.get('rows') or [];nano=[r for r in disc_rows if 'nano_low_float' in (r.get('_discoveryLanes') or [])];nano.sort(key=lambda r:(-num(r.get('Float')) if num(r.get('Float')) else -1e9,num(r.get('Rel Volume'))),reverse=True);lanes.append(('nano_low_float',[sym(r) for r in nano]))
          fin_rows=finviz.get('rows') or finviz.get('data') or [];fin_rows.sort(key=lambda r:(abs(num(r.get('Change'))),num(r.get('Volume'))),reverse=True);lanes.append(('finviz_movers',[sym(r) for r in fin_rows]))
          reserves={'prior_active':100,'premarket_hot':120,'fast_discovery':160,'nano_low_float':60,'finviz_movers':60};tickers=[];lane_of={};seen=set()
          for lane,arr in lanes:
              taken=0
              for t in arr:
                  if not t or t in seen or len(t)>12:continue
                  seen.add(t);tickers.append(t);lane_of[t]=lane;taken+=1
                  if taken>=reserves[lane]:break
          for _,arr in lanes:
              for t in arr:
                  if not t or t in seen or len(t)>12:continue
                  seen.add(t);tickers.append(t);lane_of[t]='fill'
                  if len(tickers)>=500:break
              if len(tickers)>=500:break
          tickers=tickers[:500]
          def pct(p,b):return ((p-b)/b*100.0) if p is not None and b not in (None,0) else None
          def one(ticker):
              try:
                  url='https://query1.finance.yahoo.com/v8/finance/chart/'+urllib.parse.quote(ticker)+'?interval=1m&range=1d&includePrePost=true&events=div%2Csplits';req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0 TAGXLive/8.0','Accept':'application/json'})
                  with urllib.request.urlopen(req,timeout=3.5) as z:data=json.loads(z.read().decode('utf-8'))
                  result=((data.get('chart') or {}).get('result') or [None])[0]
                  if not result:return ticker,None,'empty chart result'
                  meta=result.get('meta') or {};ts=result.get('timestamp') or [];quote=((result.get('indicators') or {}).get('quote') or [{}])[0];closes=quote.get('close') or [];volumes=quote.get('volume') or [];pts=[]
                  for i,t in enumerate(ts):
                      if i>=len(closes) or closes[i] is None:continue
                      dt=datetime.datetime.fromtimestamp(t,datetime.timezone.utc).astimezone(ET);pts.append((t,dt,session_for(dt),float(closes[i]),int(volumes[i]) if i<len(volumes) and volumes[i] is not None else 0))
                  if not pts:return ticker,None,'no priced points'
                  latest=pts[-1];reg=[p for p in pts if p[2]=='regular'];prepts=[p for p in pts if p[2]=='pre-market'];post=[p for p in pts if p[2]=='after-hours'];prev=meta.get('previousClose') if meta.get('previousClose') is not None else meta.get('chartPreviousClose');prev=float(prev) if prev is not None else None;regpx=float(meta.get('regularMarketPrice')) if meta.get('regularMarketPrice') is not None else (reg[-1][3] if reg else None);prepx=prepts[-1][3] if prepts else None;postpx=post[-1][3] if post else None;age=(now_utc.timestamp()-latest[0])/60
                  active=[p for p in pts if p[2]==market_session] if market_session!='closed' else pts
                  active_span=round((latest[0]-active[0][0])/60.0,2) if active else 0.0
                  def px_ago(minutes):
                      cutoff=latest[0]-minutes*60;before=[p for p in active if p[0]<=cutoff];return before[-1][3] if before else (active[0][3] if active else None)
                  def vol_window(start_min,end_min=0):
                      lo=latest[0]-start_min*60;hi=latest[0]-end_min*60
                      return sum(p[4] or 0 for p in active if lo < p[0] <= hi)
                  def price_range(minutes):
                      lo=latest[0]-minutes*60;arr=[p[3] for p in active if p[0]>=lo]
                      if not arr:return None
                      mn=min(arr);mx=max(arr);mid=(mn+mx)/2
                      return ((mx-mn)/mid*100.0) if mid else None
                  v5=pct(latest[3],px_ago(5));v15=pct(latest[3],px_ago(15));v30=pct(latest[3],px_ago(30));vol5=vol_window(5);prev5=vol_window(10,5);vol15=vol_window(15);prev15=vol_window(30,15)
                  comparable5=prev5>0;comparable15=prev15>0;acc5=(vol5/prev5) if comparable5 else None;acc15=(vol15/prev15) if comparable15 else None
                  dr=disc_map.get(ticker,{});float_m=num(dr.get('Float')) or None;rel_vol=num(dr.get('Rel Volume') or dr.get('Relative Volume')) or None
                  turn5=(vol5/(float_m*1_000_000)*100.0) if float_m and float_m>0 else None;turn15=(vol15/(float_m*1_000_000)*100.0) if float_m and float_m>0 else None
                  session_vol=sum(p[4] or 0 for p in active);range15=price_range(15);range30=price_range(30);day_ch=pct(latest[3],prev)
                  # Liquidity accumulation: expanding volume/turnover while price remains compressed.
                  vol_pressure=max((acc5 or 0)/1.8,(acc15 or 0)/1.5,(rel_vol or 0)/2.0,(turn15 or 0)/1.0)
                  tight15=(range15 is not None and range15<=3.0);quiet_velocity=(v5 is not None and abs(v5)<=1.2 and v15 is not None and abs(v15)<=2.5)
                  accumulation=(active_span>=12 and tight15 and quiet_velocity and vol_pressure>=1.0)
                  acc_score=0
                  if active_span>=12:acc_score+=10
                  if range15 is not None:acc_score+=max(0,min(30,(3.5-range15)*12))
                  if acc5 is not None:acc_score+=max(0,min(25,(acc5-1)*14))
                  if rel_vol is not None:acc_score+=max(0,min(20,(rel_vol-1)*8))
                  if turn15 is not None:acc_score+=min(20,turn15*6)
                  if v5 is not None and abs(v5)<=1.2:acc_score+=10
                  acc_score=max(0,min(100,round(acc_score)))
                  regime=0
                  if v5 is not None:regime+=max(-12,min(22,v5*4.0))
                  if v15 is not None:regime+=max(-8,min(18,v15*1.8))
                  if acc5 is not None:regime+=max(-5,min(20,(acc5-1)*8))
                  if turn5 is not None:regime+=min(20,turn5*4)
                  if day_ch is not None and 2<=day_ch<15:regime+=12
                  if accumulation:regime+=10
                  if day_ch is not None and day_ch>=25:regime-=35
                  if v5 is not None and v5<0:regime-=10
                  regime=max(0,min(100,round(40+regime)));ignition=max(0,min(100,round(regime+(8 if v5 is not None and v5>=2 else 0)+(6 if acc5 is not None and acc5>=2 else 0)+(8 if accumulation else 0)-(20 if day_ch is not None and day_ch>=20 else 0))))
                  q={'ticker':ticker,'price':latest[3],'session':latest[2],'timestampET':latest[1].isoformat(),'regularMarketPrice':regpx,'preMarketPrice':prepx,'afterHoursPrice':postpx,'previousClose':prev,'changePct':day_ch,'preMarketChangePct':pct(prepx,prev),'afterHoursChangePct':pct(postpx,regpx),'preMarketVolume':sum(p[4] or 0 for p in prepts) if prepts else None,'afterHoursVolume':sum(p[4] or 0 for p in post) if post else None,'sessionVolume':session_vol,'quoteAgeMin':round(age,2),'activeSpanMin':active_span,'universeLane':lane_of.get(ticker,'unknown'),'priceVelocity5mPct':round(v5,3) if v5 is not None else None,'priceVelocity15mPct':round(v15,3) if v15 is not None else None,'priceVelocity30mPct':round(v30,3) if v30 is not None else None,'range15mPct':round(range15,3) if range15 is not None else None,'range30mPct':round(range30,3) if range30 is not None else None,'volume5m':vol5,'volume15m':vol15,'volumeAcceleration5m':round(acc5,3) if acc5 is not None else None,'volumeAcceleration15m':round(acc15,3) if acc15 is not None else None,'volumeAccelerationComparable5m':comparable5,'volumeAccelerationComparable15m':comparable15,'relativeVolume':rel_vol,'floatM':float_m,'turnover5mPctFloat':round(turn5,3) if turn5 is not None else None,'turnover15mPctFloat':round(turn15,3) if turn15 is not None else None,'liquidityAccumulation':accumulation,'accumulationScore':acc_score,'earlyRegimeShiftScore':regime,'ignitionScore':ignition,'source':'Yahoo Finance chart 1m includePrePost + discovery relative volume'};return ticker,q,None
              except Exception as e:return ticker,None,str(e)[:180]
          quotes={};errors=[]
          with concurrent.futures.ThreadPoolExecutor(max_workers=48) as ex:
              fs=[ex.submit(one,t) for t in tickers]
              for f in concurrent.futures.as_completed(fs):
                  t,q,err=f.result()
                  if q:quotes[t]=q
                  elif err:errors.append({'ticker':t,'error':err})
          fresh=sum(1 for q in quotes.values() if q.get('quoteAgeMin',999)<=3 and (market_session=='closed' or q.get('session')==market_session));duration=round(time.monotonic()-started,2);confidence='HIGH' if fresh>=80 else ('MEDIUM' if fresh>=25 else 'LOW');lane_counts={lane:sum(1 for t in tickers if lane_of.get(t)==lane) for lane,_ in lanes};lane_counts['fill']=sum(1 for t in tickers if lane_of.get(t)=='fill')
          def compact(q):
              keys=['ticker','price','changePct','quoteAgeMin','activeSpanMin','sessionVolume','priceVelocity5mPct','priceVelocity15mPct','range15mPct','range30mPct','volume5m','volume15m','volumeAcceleration5m','volumeAcceleration15m','volumeAccelerationComparable5m','relativeVolume','turnover5mPctFloat','turnover15mPctFloat','liquidityAccumulation','accumulationScore','earlyRegimeShiftScore','ignitionScore','universeLane','timestampET']
              return {k:q.get(k) for k in keys}
          accumulation=[];emerging=[]
          for q in quotes.values():
              ch=q.get('changePct');v5=q.get('priceVelocity5mPct');v15=q.get('priceVelocity15mPct');a5=q.get('volumeAcceleration5m');turn=q.get('turnover5mPctFloat');score=q.get('earlyRegimeShiftScore') or 0;span=q.get('activeSpanMin') or 0;price=q.get('price')
              if q.get('quoteAgeMin',999)>3 or q.get('session')!=market_session:continue
              if q.get('liquidityAccumulation') and (q.get('accumulationScore') or 0)>=55:accumulation.append(compact(q))
              if ch is None or ch<1.5 or ch>=20 or score<65 or span<8 or v5 is None or v5<0.8:continue
              independent=((v15 is not None and v15>=1.2) or (q.get('volumeAccelerationComparable5m') is True and a5 is not None and a5>=1.8) or (turn is not None and turn>=1.0) or q.get('liquidityAccumulation') is True)
              if not independent:continue
              if price is not None and price<1 and turn is None and q.get('volumeAccelerationComparable5m') is not True:continue
              emerging.append(compact(q))
          emerging.sort(key=lambda x:(x['earlyRegimeShiftScore'],x.get('ignitionScore') or 0),reverse=True);emerging=emerging[:40]
          accumulation.sort(key=lambda x:(x.get('accumulationScore') or 0,x.get('sessionVolume') or 0),reverse=True);accumulation=accumulation[:40]
          out={'schemaVersion':8,'source':'Yahoo Finance chart API + Finviz/discovery context; strict confirmation + liquidity accumulation','updatedAtUTC':now_utc.isoformat(),'updatedAtET':now_et.isoformat(),'marketClockSession':market_session,'count':len(quotes),'freshCount':fresh,'requested':len(tickers),'scanDurationSec':duration,'dataConfidence':confidence,'laneReservations':reserves,'laneCounts':lane_counts,'coveragePolicy':'RESERVED_MULTI_LANE_THEN_FILL','cadencePolicy':'OWN_5M_CRON_PLUS_CADENCE_KEEPER_EVENT_DRIVEN','challengerPolicy':'POINT_IN_TIME_ROLLING_1M_BARS_NO_FUTURE_DATA','confirmationPolicy':'AGE<=3M; OBSERVE>=8M; V5_MOTION_PLUS_INDEPENDENT_CONFIRMATION','accumulationPolicy':'HIGH_VOLUME_OR_TURNOVER_WITH_15M_PRICE_COMPRESSION_AND_LOW_VELOCITY','emergingCount':len(emerging),'emergingCandidates':emerging,'accumulationCount':len(accumulation),'accumulationCandidates':accumulation,'quotes':quotes,'errors':errors[:40]}
          pathlib.Path('tag/data/live-quotes.json').write_text(json.dumps(out,ensure_ascii=False,indent=2),encoding='utf-8');print(json.dumps({'session':market_session,'quotes':len(quotes),'fresh':fresh,'emerging':len(emerging),'accumulation':len(accumulation),'durationSec':duration,'confidence':confidence}))
          if market_session in ('pre-market','regular','after-hours') and fresh<25:raise SystemExit('Fresh quote coverage below fail-closed floor')
          PY
      - name: Commit live quote feed
        run: |
          git config user.name "TAGX Live Quote Bot"
          git config user.email "actions@users.noreply.github.com"
          git add tag/data/live-quotes.json
          git diff --cached --quiet && exit 0
          git commit -m "data: refresh TAGX V8 accumulation feed"
          for i in 1 2 3; do git pull --rebase origin main && git push origin HEAD:main && exit 0; sleep $((i*4)); done
          exit 1
