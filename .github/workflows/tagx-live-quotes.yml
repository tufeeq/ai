name: TAGX Live Quote Reconciliation V9

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tagx-live-quotes.yml'
      - 'tagit/live-engine-v9.py'
  schedule:
    - cron: '1,6,11,16,21,26,31,36,41,46,51,56 * * * *'

permissions:
  contents: write

# Never cancel a valid quote build merely because the daemon fires the next pulse.
# Serializing refreshes is safer than publishing partially-built or skipped snapshots.
concurrency:
  group: tagx-live-quotes-main
  cancel-in-progress: false

jobs:
  refresh-live-quotes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Sync latest main
        run: git pull --rebase origin main
      - name: Validate V9 engine
        run: python -m py_compile tagit/live-engine-v9.py
      - name: Build resilient live feed
        run: python tagit/live-engine-v9.py
      - name: Validate live feed contract
        run: |
          python - <<'PY'
          import json, pathlib
          p=pathlib.Path('tag/data/live-quotes.json')
          x=json.loads(p.read_text())
          required=['updatedAtUTC','marketClockSession','quotes','earlyCandidates','emergingCandidates','accumulationCandidates']
          missing=[k for k in required if k not in x]
          if missing: raise SystemExit(f'missing keys: {missing}')
          if x.get('schemaVersion') != 9: raise SystemExit('schemaVersion must be 9')
          if x.get('marketClockSession') != 'closed' and x.get('freshCount',0) < 50: raise SystemExit('fresh quote floor violated')
          if len(x.get('quotes') or {}) < 50: raise SystemExit('quote coverage floor violated')
          print({k:x.get(k) for k in ['updatedAtET','marketClockSession','freshCount','requested','earlyCount','emergingCount','accumulationCount','scanDurationSec']})
          PY
      - name: Commit live feed
        run: |
          git config user.name tagit-live-v9-bot
          git config user.email actions@users.noreply.github.com
          git add tag/data/live-quotes.json
          git diff --cached --quiet && exit 0
          git commit -m 'data: refresh TAGit live V9 feed'
          for i in 1 2 3 4; do
            git pull --rebase --autostash origin main && git push origin HEAD:main && exit 0
            sleep $((i*4))
          done
          exit 1
