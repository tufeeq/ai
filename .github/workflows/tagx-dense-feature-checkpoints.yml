name: TAGX Dense Feature Checkpoints

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["TAGX Proactive Discovery Universe"]
    types: [completed]
  schedule:
    - cron: '*/5 8-23 * * 1-5'

permissions:
  contents: write

concurrency:
  group: tagx-dense-feature-checkpoints-main
  cancel-in-progress: true

jobs:
  checkpoint:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Sync latest main
        run: git pull --rebase origin main

      - name: Append same-session compact checkpoint with transition deltas
        run: |
          python - <<'PY'
          import json, pathlib, datetime, statistics
          from zoneinfo import ZoneInfo

          src=pathlib.Path('tag/data/discovery.json')
          out=pathlib.Path('tag/data/tagx-feature-checkpoints.json')
          if not src.exists(): raise SystemExit('discovery.json missing')
          d=json.loads(src.read_text(encoding='utf-8'))
          rows=d.get('rows') or []
          source_ts=d.get('snapshotTimestampUTC') or d.get('updatedAt')
          if not rows or not source_ts: raise SystemExit('discovery snapshot incomplete')
          try: source_dt=datetime.datetime.fromisoformat(str(source_ts).replace('Z','+00:00'))
          except Exception: raise SystemExit('invalid discovery timestamp')
          now=datetime.datetime.now(datetime.timezone.utc)
          age=(now-source_dt.astimezone(datetime.timezone.utc)).total_seconds()/60
          if age>20: raise SystemExit(f'discovery snapshot stale: {age:.1f}m')
          et=source_dt.astimezone(ZoneInfo('America/New_York'))
          day=et.date().isoformat()
          if et.weekday()>=5: raise SystemExit('weekend')

          def f(v):
              try:return float(str(v or '').replace('%','').replace(',','').replace('$',''))
              except:return None
          def safe_delta(a,b): return (a-b) if a is not None and b is not None else None
          def capture(volume,float_m):
              return volume/(float_m*1_000_000) if volume is not None and float_m not in (None,0) else None

          try: old=json.loads(out.read_text(encoding='utf-8')) if out.exists() else {}
          except Exception: old={}
          if old.get('sessionDateET')!=day:
              old={
                  'schemaVersion':2,
                  'sessionDateET':day,
                  'authority':'PROACTIVE_DISCOVERY_SAME_SESSION_CHECKPOINTS',
                  'fieldOrder':['ticker','price','changePct','volume','relativeVolume','floatMillions','lanes','deltaMinutes','changeDelta','volumeDelta','relativeVolumeDelta','floatCapture','floatCaptureDeltaPer10m','priceVelocityPer10m'],
                  'snapshots':[]
              }
          else:
              old['schemaVersion']=2
              old['fieldOrder']=['ticker','price','changePct','volume','relativeVolume','floatMillions','lanes','deltaMinutes','changeDelta','volumeDelta','relativeVolumeDelta','floatCapture','floatCaptureDeltaPer10m','priceVelocityPer10m']

          snaps=old.setdefault('snapshots',[])
          stamp=source_dt.astimezone(datetime.timezone.utc).isoformat()
          if snaps and snaps[-1].get('sourceSnapshotUTC')==stamp:
              raise SystemExit('checkpoint already recorded')

          prev={}
          prev_dt=None
          if snaps:
              last=snaps[-1]
              try: prev_dt=datetime.datetime.fromisoformat(last['sourceSnapshotUTC'].replace('Z','+00:00'))
              except Exception: prev_dt=None
              order=old.get('fieldOrder') or []
              # Previous schema may have only seven base fields. We only need indices 0..5.
              for rr in last.get('rows') or []:
                  if isinstance(rr,list) and rr: prev[str(rr[0]).upper()]=rr
          delta_min=(source_dt.astimezone(datetime.timezone.utc)-prev_dt).total_seconds()/60 if prev_dt else None
          if delta_min is not None and delta_min<=0: delta_min=None

          compact=[]
          transition_eligible=0
          for r in rows:
              t=str(r.get('Ticker') or r.get('ticker') or '').upper().strip()
              if not t: continue
              price=f(r.get('Price')); change=f(r.get('Change')); volume=f(r.get('Volume')); rel=f(r.get('Rel Volume')); fl=f(r.get('Float')); lanes=r.get('_discoveryLanes') or []
              pr=prev.get(t)
              p_change=f(pr[2]) if pr and len(pr)>2 else None
              p_volume=f(pr[3]) if pr and len(pr)>3 else None
              p_rel=f(pr[4]) if pr and len(pr)>4 else None
              p_fl=f(pr[5]) if pr and len(pr)>5 else fl
              cur_cap=capture(volume,fl)
              prev_cap=capture(p_volume,p_fl)
              change_delta=safe_delta(change,p_change)
              volume_delta=safe_delta(volume,p_volume)
              rel_delta=safe_delta(rel,p_rel)
              cap_delta=safe_delta(cur_cap,prev_cap)
              cap_per10=(cap_delta*(10/delta_min)) if cap_delta is not None and delta_min and delta_min<=20 else None
              price_vel10=(change_delta*(10/delta_min)) if change_delta is not None and delta_min and delta_min<=20 else None
              if price_vel10 is not None and cap_per10 is not None: transition_eligible+=1
              compact.append([t,price,change,volume,rel,fl,lanes,round(delta_min,3) if delta_min else None,change_delta,volume_delta,rel_delta,cur_cap,cap_per10,price_vel10])
          if not compact: raise SystemExit('no compact rows')

          snaps.append({
              'sourceSnapshotUTC':stamp,
              'sourceSnapshotET':et.isoformat(),
              'capturedAtUTC':now.isoformat(),
              'count':len(compact),
              'transitionEligibleCount':transition_eligible,
              'rows':compact,
          })
          old['snapshots']=snaps[-220:]
          old['updatedAtUTC']=now.isoformat()
          old['snapshotCount']=len(old['snapshots'])
          gaps=[]; times=[]
          for s in old['snapshots']:
              try: times.append(datetime.datetime.fromisoformat(s['sourceSnapshotUTC'].replace('Z','+00:00')))
              except: pass
          for a,b in zip(times,times[1:]): gaps.append((b-a).total_seconds()/60)
          old['cadence']={
              'medianGapMin':round(statistics.median(gaps),2) if gaps else None,
              'maxGapMin':round(max(gaps),2) if gaps else None,
              'gapsOver15m':sum(1 for g in gaps if g>15),
              'transitionEligiblePct':round(100*transition_eligible/len(compact),1) if compact else 0,
          }
          out.write_text(json.dumps(old,ensure_ascii=False,separators=(',',':')),encoding='utf-8')
          print('checkpoint',day,stamp,'rows',len(compact),'snapshots',len(old['snapshots']),'cadence',old['cadence'])
          PY

      - name: Commit checkpoint ledger
        run: |
          git config user.name "TAGX Checkpoint Bot"
          git config user.email "actions@users.noreply.github.com"
          git add tag/data/tagx-feature-checkpoints.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Capture TAGX dense transition checkpoint"
          git pull --rebase origin main
          git push origin main
