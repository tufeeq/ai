name: TAGit v5.11 Universe Integrity

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["TAGit v5.9 Independent Event Discovery"]
    types: [completed]

permissions:
  contents: write

concurrency:
  group: tagit-v511-universe-integrity
  cancel-in-progress: false

jobs:
  audit:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Syntax check
        run: python -m py_compile tagit/universe-integrity-v511.py
      - name: Evaluate real-discovery universe integrity
        run: python tagit/universe-integrity-v511.py
      - name: Verify conservative claim gate
        run: |
          python - <<'PY'
          import json, pathlib
          p=pathlib.Path('tag/data/tagit-v511-universe-integrity.json')
          u=pathlib.Path('tag/data/tagit-forward-universe-ledger.json')
          assert p.exists() and u.exists()
          r=json.loads(p.read_text())
          assert r['forwardUniverse']['requiredSessions'] >= 20
          assert r['forwardUniverse']['requiredSymbolSessions'] >= 5000
          if not r['forwardUniverse']['ready']:
              assert r['realDiscoveryPrecisionClaimEligible'] is False
          print(json.dumps(r,indent=2))
          PY
      - name: Commit universe evidence
        run: |
          git config user.name "TAGit Research Bot"
          git config user.email "actions@users.noreply.github.com"
          git add tag/data/tagit-v511-universe-integrity.json tag/data/tagit-forward-universe-ledger.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "research: record v5.11 universe integrity evidence"
          git pull --rebase origin main
          git push origin main
