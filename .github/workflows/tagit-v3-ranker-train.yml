name: TAGit v3 Shadow Ranker Train

on:
  workflow_dispatch:
  schedule:
    - cron: '20 9 * * 1-5'
  push:
    paths:
      - 'tagit/train-v3-ranker.py'
      - 'tagit/historical-feature-builder.py'
      - '.github/workflows/tagit-v3-ranker-train.yml'

permissions:
  contents: write

concurrency:
  group: tagit-v3-ranker-train-main
  cancel-in-progress: true

jobs:
  train:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          filter: blob:none
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check numpy scikit-learn joblib
      - name: Validate code
        run: python -m py_compile tagit/historical-feature-builder.py tagit/train-v3-ranker.py tagit/score-v3-live.py
      - name: Train graded relevance ranker
        run: python tagit/train-v3-ranker.py
      - name: Verify model contract
        run: |
          python - <<'PY'
          import json,joblib
          m=joblib.load('tag/model/tagit-v3-ranker.joblib')
          x=json.load(open('tag/data/tagit-v3-ranker-meta.json'))
          assert m['policy']=='SHADOW_ONLY_NO_CHAMPION_OVERRIDE'
          assert len(m['featureNames'])==17
          assert x['trainingRows']>=80000
          assert x['featureCount']==17
          print('TAGit v3 model contract PASS')
          PY
      - name: Commit model and metadata
        run: |
          git config user.name tagit-v3-model-bot
          git config user.email actions@users.noreply.github.com
          git add tag/model/tagit-v3-ranker.joblib tag/data/tagit-v3-ranker-meta.json
          git diff --cached --quiet && exit 0
          git commit -m 'model: refresh TAGit v3 shadow ranker'
          for i in 1 2 3; do
            git pull --rebase --autostash origin main && git push origin HEAD:main && exit 0
            sleep $((i*5))
          done
          exit 1
