name: TAG6 Multi-Source Enrichment

on:
  workflow_dispatch:
  schedule:
    - cron: '3,18,33,48 * * * *'

permissions:
  contents: write

concurrency:
  group: tag6-enrichment-main
  cancel-in-progress: true

jobs:
  enrich:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - run: git pull --rebase origin main
      - name: Build Yahoo + SEC + MarketWatch + news enrichment
        run: |
          python - <<'PY'
          import json, pathlib, urllib.request, urllib.parse, datetime, time, re, xml.etree.ElementTree as ET
          UA='TAG Market Research github.com/tufeeq/ai 6802694+tufeeq@users.noreply.github.com'
          BROWSER_UA='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/124 Safari/537.36 TAGResearch/1.0'
          def request(url, accept='application/json,text/plain,*/*', timeout=15, retries=3, ua=None):
              last=None
              for i in range(retries):
                  try:
                      req=urllib.request.Request(url,headers={'User-Agent':ua or UA,'Accept':accept,'Accept-Encoding':'identity','Connection':'close'})
                      return urllib.request.urlopen(req,timeout=timeout)
                  except Exception as e:last=e; time.sleep(2.0*(i+1))
              raise last
          def get_json(url, timeout=15):
              with request(url,timeout=timeout) as r:return json.loads(r.read().decode('utf-8'))
          def get_text(url, timeout=15, ua=None):
              with request(url,'text/html,application/rss+xml,text/xml,*/*',timeout,ua=ua) as r:return r.read().decode('utf-8','replace')
          def num(s):
              if s is None:return None
              s=str(s).replace(',','').replace('$','').strip(); mult=1
              if s.endswith('K'):mult=1e3;s=s[:-1]
              elif s.endswith('M'):mult=1e6;s=s[:-1]
              elif s.endswith('B'):mult=1e9;s=s[:-1]
              try:return float(s)*mult
              except:return None
          def marketwatch(t):
              url='https://www.marketwatch.com/investing/stock/'+urllib.parse.quote(t.lower())
              html=get_text(url,20,BROWSER_UA)
              text=re.sub(r'<[^>]+>',' ',html); text=re.sub(r'\s+',' ',text)
              def grab(label,pat=r'([0-9,.]+[KMB]?)'):
                  m=re.search(re.escape(label)+r'\s*'+pat,text,re.I);return m.group(1) if m else None
              si=grab('Short Interest'); pf=grab('Public Float'); so=grab('Shares Outstanding'); sp=grab('% of Float Shorted',r'([0-9,.]+%)')
              date=None
              m=re.search(r'Short Interest\s*[0-9,.]+[KMB]?\s*(\d{2}/\d{2}/\d{2})',text,re.I)
              if m:date=m.group(1)
              return {'source':'MarketWatch','url':url,'shortInterest':num(si),'publicFloat':num(pf),'sharesOutstanding':num(so),'shortFloatPct':float(sp.rstrip('%')) if sp else None,'settlementDate':date,'retrievedAtUTC':datetime.datetime.now(datetime.timezone.utc).isoformat()}

          p=pathlib.Path('tag/data/finviz.json')
          try: base=json.loads(p.read_text(encoding='utf-8'))
          except Exception: base={}
          rows=base.get('rows') or base.get('data') or []
          def pct(v):
              try:return float(str(v or 0).replace('%','').replace(',',''))
              except:return 0
          rows=sorted(rows,key=lambda x:abs(pct(x.get('Change'))),reverse=True)
          tickers=[]
          for r in rows:
              t=str(r.get('Ticker') or r.get('Symbol') or '').strip().upper()
              if t and re.match(r'^[A-Z][A-Z0-9.\-]{0,9}$',t) and t not in tickers:tickers.append(t)
          tickers=tickers[:80]
          now=datetime.datetime.now(datetime.timezone.utc)
          out={'updatedAt':now.isoformat(),'sources':['Yahoo Finance chart','SEC submissions','MarketWatch key data','Google News RSS'],'sourceStatus':{},'rows':{},'independentPriceSource':'Yahoo Finance chart','trainingTruth':False}
          cache_path=pathlib.Path('tag/data/sec-ticker-map.json')
          try: secmap=json.loads(cache_path.read_text(encoding='utf-8')) if cache_path.exists() else {}
          except Exception: secmap={}
          secmap_source='CACHE' if secmap else 'NONE';sec_errors=[]
          for sec_url in ['https://www.sec.gov/files/company_tickers_exchange.json','https://www.sec.gov/files/company_tickers.json']:
              try:
                  j=get_json(sec_url,20);fresh={}
                  if isinstance(j,dict) and isinstance(j.get('data'),list):
                      fields=j.get('fields') or [];idx={k:i for i,k in enumerate(fields)}
                      for row in j['data']:
                          t=str(row[idx.get('ticker',2)] or '').upper()
                          if t:fresh[t]={'cik':str(row[idx.get('cik',1)]).zfill(10),'company':row[idx.get('name',0)],'source':'SEC'}
                  elif isinstance(j,dict):
                      for v in j.values():
                          if not isinstance(v,dict):continue
                          t=str(v.get('ticker','')).upper()
                          if t:fresh[t]={'cik':str(v.get('cik_str','')).zfill(10),'company':v.get('title'),'source':'SEC'}
                  if fresh:secmap=fresh;secmap_source='SEC';cache_path.write_text(json.dumps(secmap,ensure_ascii=False),encoding='utf-8');break
              except Exception as e:sec_errors.append(type(e).__name__)
          out['sourceStatus']['SECIdentityMap']='OK:'+secmap_source if secmap else 'REMOTE_ACCESS_ERROR:'+','.join(sec_errors or ['UNAVAILABLE'])
          yahoo_ok=sec_ok=news_ok=mw_ok=0;sec_attempts=0
          for t in tickers:
              item={'ticker':t,'price':{},'identity':secmap.get(t,{}),'shortData':{},'filings':[],'news':[],'errors':[]}
              try:
                  y=get_json('https://query1.finance.yahoo.com/v8/finance/chart/'+urllib.parse.quote(t)+'?interval=5m&range=1d&includePrePost=true');res=(y.get('chart',{}).get('result') or [None])[0]
                  if res:
                      meta=res.get('meta',{});ts=res.get('timestamp') or [];q=((res.get('indicators',{}).get('quote') or [{}])[0]);closes=q.get('close') or [];vols=q.get('volume') or []
                      valid=[(a,b,c) for a,b,c in zip(ts,closes,vols) if b is not None]
                      last=valid[-1] if valid else (None,None,None)
                      cumulative_volume=sum(float(c) for a,b,c in valid if c is not None and float(c)>=0)
                      prev=meta.get('chartPreviousClose') or meta.get('previousClose');ch=((last[1]/prev-1)*100) if last[1] and prev else None
                      item['price']={'source':'Yahoo Finance chart','last':last[1],'volume':cumulative_volume if cumulative_volume>0 else None,'intervalVolume':last[2],'volumeSemantic':'chart_bar_sum_session_cumulative','volumeCoverageNote':'Sum of Yahoo 5-minute chart bars; extended-hours volume may be incomplete or zero for some symbols.','volumeUsableForFinalReconciliation':bool(cumulative_volume and cumulative_volume>0),'timestampUTC':datetime.datetime.fromtimestamp(last[0],datetime.timezone.utc).isoformat() if last[0] else None,'previousClose':prev,'changePct':round(ch,3) if ch is not None else None,'exchange':meta.get('exchangeName'),'currency':meta.get('currency')};yahoo_ok+=1
              except Exception as e:item['errors'].append('YAHOO:'+type(e).__name__)
              ident=secmap.get(t)
              if ident and ident.get('cik'):
                  sec_attempts+=1
                  try:
                      s=get_json('https://data.sec.gov/submissions/CIK'+ident['cik']+'.json',20);recent=s.get('filings',{}).get('recent',{});forms=recent.get('form',[]);wanted={'8-K','6-K','10-Q','10-K','S-1','S-3','424B3','424B5','DEF 14A','SC 13D','SC 13G'}
                      for k,form in enumerate(forms[:80]):
                          if form not in wanted:continue
                          acc=(recent.get('accessionNumber') or ['']*len(forms))[k];primary=(recent.get('primaryDocument') or ['']*len(forms))[k];accn=acc.replace('-','');ciknum=str(int(ident['cik']));item['filings'].append({'form':form,'filed':(recent.get('filingDate') or ['']*len(forms))[k],'description':(recent.get('primaryDocDescription') or ['']*len(forms))[k] if k<len(recent.get('primaryDocDescription') or []) else '','url':f'https://www.sec.gov/Archives/edgar/data/{ciknum}/{accn}/{primary}','source':'SEC'})
                          if len(item['filings'])>=8:break
                      sec_ok+=1
                  except Exception as e:item['errors'].append('SEC_SUBMISSIONS_REMOTE_ACCESS:'+type(e).__name__)
                  time.sleep(.20)
              try:
                  item['shortData']=marketwatch(t)
                  if item['shortData'].get('shortInterest') is not None:mw_ok+=1
              except Exception as e:item['errors'].append('MARKETWATCH:'+type(e).__name__)
              try:
                  company=(ident or {}).get('company') or t;q=urllib.parse.quote(f'"{t}" stock OR "{company}" when:3d');xml=get_text('https://news.google.com/rss/search?q='+q+'&hl=en-US&gl=US&ceid=US:en');root=ET.fromstring(xml)
                  for n in root.findall('.//item')[:8]:item['news'].append({'title':n.findtext('title') or '','url':n.findtext('link') or '','published':n.findtext('pubDate') or '','source':n.findtext('source') or 'Google News'})
                  news_ok+=1
              except Exception as e:item['errors'].append('NEWS:'+type(e).__name__)
              out['rows'][t]=item;time.sleep(.10)
          out['sourceStatus']['Yahoo']=f'OK:{yahoo_ok}/{len(tickers)}' if yahoo_ok else 'UNAVAILABLE';out['sourceStatus']['SECSubmissions']='BLOCKED_IDENTITY_MAP_REMOTE_ACCESS' if not secmap else (f'REMOTE_ACCESS_ERROR:0/{sec_attempts}' if sec_attempts and sec_ok==0 else f'OK:{sec_ok}/{sec_attempts}');out['sourceStatus']['MarketWatch']=f'OK:{mw_ok}/{len(tickers)}' if mw_ok else 'UNAVAILABLE';out['sourceStatus']['News']=f'OK:{news_ok}/{len(tickers)}'
          pathlib.Path('tag/data/enrichment.json').write_text(json.dumps(out,ensure_ascii=False,indent=2),encoding='utf-8');print(json.dumps(out['sourceStatus']))
          PY
      - name: Commit enrichment
        run: |
          git config user.name 'tag6-data-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add tag/data/enrichment.json
          [ -f tag/data/sec-ticker-map.json ] && git add tag/data/sec-ticker-map.json || true
          git diff --cached --quiet && exit 0
          git commit -m 'data: refresh TAG6 multi-source enrichment'
          for i in 1 2 3; do git pull --rebase origin main && git push origin HEAD:main && exit 0; sleep $((i*5)); done
          exit 1