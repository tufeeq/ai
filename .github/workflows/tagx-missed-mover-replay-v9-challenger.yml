name: TAGX Missed Mover Replay v9 Challenger
on:
  workflow_dispatch:
  schedule:
    - cron: '5 14-20 * * 1-5'
permissions:
  contents: write
jobs:
  replay:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run v9 challenger
        run: python tagx/challengers/missed_mover_replay_v9.py
      - name: Commit challenger output
        run: |
          git config user.name 'TAGX Challenger Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add tag/data/tagx-missed-mover-replay-v9-challenger.json
          git diff --cached --quiet || git commit -m 'Update TAGX missed-mover replay v9'
          git pull --rebase origin main || true
          git push || true
