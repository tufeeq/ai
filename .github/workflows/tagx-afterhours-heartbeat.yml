name: TAGX After-Hours Hot Heartbeat

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/tagx-afterhours-heartbeat.yml']
  schedule:
    - cron: '2-57/5 20-23 * * 1-5'
    - cron: '2-57/5 0 * * 2-6'

permissions:
  contents: write
concurrency:
  group: tagx-ah-heartbeat
  cancel-in-progress: true

jobs:
  heartbeat:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with: {ref: main, fetch-depth: 0}
      - run: git pull --rebase origin main
      - name: Refresh hot after-hours names
        run: |
          python - <<'PY'
          import json,pathlib,datetime,urllib.request,urllib.parse,concurrent.futures,re
          from zoneinfo import ZoneInfo
          ET=ZoneInfo('America/New_York'); now=datetime.datetime.now(datetime.timezone.utc); et=now.astimezone(ET); m=et.hour*60+et.minute
          if not(et.weekday()<5 and 960<=m<=1200): raise SystemExit(0)
          def load(p):
            try:return json.loads(pathlib.Path(p).read_text())
            except:return {}
          prior=load('tag/data/extended-hours.json'); fast=load('tag/data/discovery-fast.json'); std=load('tag/data/discovery.json')
          by={}
          for j in (fast,std):
            for r in j.get('rows',[]):
              t=str(r.get('Ticker') or r.get('Symbol') or '').upper().strip()
              if re.match(r'^[A-Z][A-Z0-9.\-]{0,9}$',t): by[t]=r
          hot=sorted((prior.get('rows') or {}).values(),key=lambda r:(r.get('nativeRankScore') or 0,abs(r.get('sessionChangePct') or 0)),reverse=True)
          tick=[];seen=set()
          for r in hot:
            t=str(r.get('ticker') or '').upper()
            if t in by and t not in seen: seen.add(t);tick.append(t)
          for t in list(by):
            if t not in seen: seen.add(t);tick.append(t)
          tick=tick[:320]
          def one(t):
            try:
              u='https://query1.finance.yahoo.com/v8/finance/chart/'+urllib.parse.quote(t)+'?interval=5m&range=1d&includePrePost=true'
              q=urllib.request.Request(u,headers={'User-Agent':'Mozilla/5.0 TAGXHeartbeat/1.0','Accept':'application/json'})
              with urllib.request.urlopen(q,timeout=2.5) as z:j=json.loads(z.read())
              x=(j.get('chart',{}).get('result') or [None])[0]
              if not x:return None
              meta=x.get('meta',{});ts=x.get('timestamp') or [];qq=((x.get('indicators',{}).get('quote') or [{}])[0]);cl=qq.get('close') or []
              bars=[(a,float(b)) for a,b in zip(ts,cl) if b is not None]; reg=(meta.get('currentTradingPeriod') or {}).get('regular') or {};end=reg.get('end');start=reg.get('start')
              rb=[b for b in bars if start and end and start<=b[0]<=end]; rc=rb[-1][1] if rb else meta.get('regularMarketPrice') or meta.get('previousClose'); ext=[b for b in bars if end and b[0]>end]
              if not ext or not rc:return None
              lt,px=ext[-1]
              if now.timestamp()-lt>12*60:return None
              def vel(n):
                a=[b for b in ext if b[0]>=lt-n*60];base=a[0][1] if a else None;return ((px/base)-1)*100 if base else None
              old=(prior.get('rows') or {}).get(t,{})
              ch=(px/rc-1)*100;v5=vel(5);v15=vel(15);v30=vel(30);prev=meta.get('chartPreviousClose') or meta.get('previousClose') or rc
              return t,{'ticker':t,'session':'after-hours','last':px,'timestampUTC':datetime.datetime.fromtimestamp(lt,datetime.timezone.utc).isoformat(),'rthClose':rc,'previousClose':prev,'sessionChangePct':round(ch,3),'changeVsPreviousClosePct':round((px/prev-1)*100,3) if prev else None,'priceVelocity5mPct':round(v5,3) if v5 is not None else None,'priceVelocity15mPct':round(v15,3) if v15 is not None else None,'priceVelocity30mPct':round(v30,3) if v30 is not None else None,'firstAHSeenUTC':old.get('firstAHSeenUTC') or datetime.datetime.fromtimestamp(lt,datetime.timezone.utc).isoformat(),'firstAHChangePct':old.get('firstAHChangePct') if old.get('firstAHChangePct') is not None else round(ch,3),'peakAHChangePct':max(old.get('peakAHChangePct') or ch,ch),'discoveryQualified':bool(abs(ch)>=2 or abs(v15 or 0)>=1.5),'source':'Yahoo Finance hot-heartbeat'}
            except:return None
          rows={}
          with concurrent.futures.ThreadPoolExecutor(max_workers=48) as ex:
            for z in ex.map(one,tick):
              if z:rows[z[0]]=z[1]
          out={'schemaVersion':1,'updatedAtUTC':now.isoformat(),'updatedAtET':et.isoformat(),'session':'after-hours','source':'TAGX hot heartbeat','dataConfidence':'HIGH' if len(rows)>=50 else ('MEDIUM' if rows else 'UNAVAILABLE'),'candidateCount':len(tick),'count':len(rows),'rows':rows,'failClosed':not bool(rows)}
          pathlib.Path('tag/data/extended-hot.json').write_text(json.dumps(out,ensure_ascii=False,indent=2))
          print(json.dumps({'updatedAtET':out['updatedAtET'],'rows':len(rows),'candidates':len(tick)}))
          PY
      - name: Commit heartbeat
        run: |
          git config user.name tagx-heartbeat-bot
          git config user.email actions@users.noreply.github.com
          git add tag/data/extended-hot.json
          git diff --cached --quiet && exit 0
          git commit -m 'data: refresh TAGX AH heartbeat'
          for i in 1 2 3; do git pull --rebase origin main && git push origin HEAD:main && exit 0; sleep $((i*4)); done
          exit 1
