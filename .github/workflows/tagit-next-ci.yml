name: TAGit NEXT independent checks
on:
  pull_request:
    paths:
      - 'tagit-next/**'
      - '.github/workflows/tagit-next-ci.yml'
  push:
    branches: [main]
    paths:
      - 'tagit-next/**'
      - '.github/workflows/tagit-next-ci.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm test
        working-directory: tagit-next/quote-service
      - run: make phase1
        working-directory: tagit-next
      - run: make phase2
        working-directory: tagit-next
      - run: make continuation
        working-directory: tagit-next
      - run: node --check tagit-next/web/prices.js
      - run: node --check tagit-next/web/execution.js
      - run: node --test tagit-next/web/*.test.mjs
      - run: node --check tagit-next/web/app.js && node --check tagit-next/web/performance.js
      - run: python tagit-next/export_execution.py --check
      - run: python -m pip install -r tagit-next/requirements.txt
      - run: python -m unittest discover -s tests -v
        working-directory: tagit-next
      - run: |
          python replay.py --output /tmp/tagit-next-report.json
          cmp data/report.json /tmp/tagit-next-report.json
        working-directory: tagit-next
      - run: python verify_study.py
        working-directory: tagit-next
      - run: |
          cp data/quote-audit.json /tmp/quote-audit-expected.json
          python quote_audit.py
          cmp data/quote-audit.json /tmp/quote-audit-expected.json
        working-directory: tagit-next
      - run: |
          cp data/exit-audit.json /tmp/exit-audit-expected.json
          python exit_audit.py
          cmp data/exit-audit.json /tmp/exit-audit-expected.json
        working-directory: tagit-next
      - run: |
          cp data/timeout-timing-report.json /tmp/timeout-timing-expected.json
          python timeout_timing.py
          cmp data/timeout-timing-report.json /tmp/timeout-timing-expected.json
        working-directory: tagit-next

      - run: |
          cp data/execution-latency-report.json /tmp/execution-latency-expected.json
          python execution_latency.py
          cmp data/execution-latency-report.json /tmp/execution-latency-expected.json
        working-directory: tagit-next

      - run: |
          cp data/presignal-liquidity-report.json /tmp/presignal-liquidity-expected.json
          python presignal_liquidity.py
          cmp data/presignal-liquidity-report.json /tmp/presignal-liquidity-expected.json
        working-directory: tagit-next

      - run: |
          cp data/presignal-liquidity-validation-report.json /tmp/presignal-liquidity-validation-expected.json
          python presignal_validation.py
          cmp data/presignal-liquidity-validation-report.json /tmp/presignal-liquidity-validation-expected.json
        working-directory: tagit-next

      - name: Build and smoke-test observer container (no external credentials)
        run: |
          docker build -t tagit-next-observer -f tagit-next/quote-service/Dockerfile tagit-next
          docker run --rm --entrypoint python3 --workdir /app tagit-next-observer -c 'from research.execution import Policy; print(Policy())'
          docker run -d --name tagit-observer-test -p 127.0.0.1:18787:10000 tagit-next-observer
          trap 'docker rm -f tagit-observer-test' EXIT
          if ! curl --fail --retry 10 --retry-all-errors --retry-delay 1 --retry-max-time 30 --connect-timeout 2 --max-time 5 http://127.0.0.1:18787/api/health > /tmp/observer-health.json; then
            docker logs tagit-observer-test
            exit 1
          fi
          python -c 'import json; d=json.load(open("/tmp/observer-health.json")); assert d["credentials_configured"] is False; assert d["runtime"]["background_enabled"] is False'
