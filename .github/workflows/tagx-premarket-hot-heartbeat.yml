name: TAGX Premarket Hot Heartbeat

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["TAGX Fast Discovery Lane", "TAGX Proactive Discovery Universe"]
    types: [completed]
    branches: [main]
  push:
    branches: [main]
    paths:
      - '.github/workflows/tagx-premarket-hot-heartbeat.yml'
  schedule:
    - cron: '1-56/5 8-13 * * 1-5'

permissions:
  contents: write
concurrency:
  group: tagx-premarket-heartbeat
  cancel-in-progress: false

jobs:
  heartbeat:
    if: >-
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with: {ref: main, fetch-depth: 0}
      - run: git pull --rebase origin main
      - name: Scan premarket hot universe
        run: |
          python - <<'PY'
          import json,pathlib,datetime,urllib.request,urllib.parse,concurrent.futures,re,time,random
          from zoneinfo import ZoneInfo
          ET=ZoneInfo('America/New_York'); now=datetime.datetime.now(datetime.timezone.utc); et=now.astimezone(ET); m=et.hour*60+et.minute
          if not(et.weekday()<5 and 240<=m<570): raise SystemExit(0)
          def load(p):
            try:return json.loads(pathlib.Path(p).read_text())
            except:return {}
          def num(v):
            try:return float(str(v or 0).replace('%','').replace(',','').replace('$',''))
            except:return 0.0
          def symbol(r):
            return str(r.get('Ticker') or r.get('ticker') or r.get('Symbol') or r.get('symbol') or '').upper().strip()

          pools=[]; by={}; source_tags={}
          for src,p in [('fast','tag/data/discovery-fast.json'),('standard','tag/data/discovery.json'),('finviz','tag/data/finviz.json')]:
            j=load(p)
            for r in (j.get('rows') or j.get('data') or []):
              t=symbol(r)
              if not re.match(r'^[A-Z][A-Z0-9.\-]{0,9}$',t): continue
              if t not in by: by[t]=dict(r)
              else:
                for k,v in r.items():
                  if by[t].get(k) in (None,'') and v not in (None,''): by[t][k]=v
              source_tags.setdefault(t,set()).add(src)

          ah=load('tag/data/extended-hot.json'); ahrows=ah.get('rows') or {}
          for raw,r in ahrows.items():
            t=str(raw or r.get('ticker') or '').upper().strip()
            if not re.match(r'^[A-Z][A-Z0-9.\-]{0,9}$',t): continue
            source_tags.setdefault(t,set()).add('afterhours_persistence')
            if t not in by:
              by[t]={'Ticker':t,'Price':r.get('last'),'Change':r.get('changeVsPreviousClosePct') or r.get('sessionChangePct'),'Volume':r.get('extendedVolume')}

          all_t=list(by)
          low_float=sorted(all_t,key=lambda t:(num(by[t].get('Float')) if num(by[t].get('Float'))>0 else 1e9,-num(by[t].get('Rel Volume')),-abs(num(by[t].get('Change')))))[:240]
          momentum=sorted(all_t,key=lambda t:(abs(num(by[t].get('Change'))),num(by[t].get('Rel Volume')),num(by[t].get('Volume'))),reverse=True)[:160]
          persistence=sorted([t for t in ahrows if t in by],key=lambda t:(abs(num(ahrows[t].get('sessionChangePct'))),num(ahrows[t].get('priceVelocity15mPct'))),reverse=True)[:120]
          selected=[]; seen=set(); lane_counts={'lowFloat':0,'momentum':0,'afterHoursPersistence':0,'fill':0}
          for lane,names in [('lowFloat',low_float),('momentum',momentum),('afterHoursPersistence',persistence)]:
            for t in names:
              if t in seen: continue
              seen.add(t); selected.append(t); lane_counts[lane]+=1
          fill=sorted(all_t,key=lambda t:(num(by[t].get('Rel Volume')),abs(num(by[t].get('Change')))),reverse=True)
          for t in fill:
            if t in seen: continue
            seen.add(t); selected.append(t); lane_counts['fill']+=1
            if len(selected)>=560: break
          tick=selected[:560]

          prior=load('tag/data/premarket-hot.json'); oldrows=prior.get('rows') or {}
          def request_chart(t):
            u='https://query1.finance.yahoo.com/v8/finance/chart/'+urllib.parse.quote(t)+'?interval=5m&range=1d&includePrePost=true'
            for attempt in range(3):
              try:
                req=urllib.request.Request(u,headers={'User-Agent':'Mozilla/5.0 TAGXPremarket/2.1','Accept':'application/json','Cache-Control':'no-cache'})
                with urllib.request.urlopen(req,timeout=3.1+attempt*.7) as z:return json.loads(z.read())
              except Exception:
                if attempt<2: time.sleep(.15*(attempt+1)+random.random()*.12)
            return None
          def one(t):
            j=request_chart(t)
            try:
              x=(j.get('chart',{}).get('result') or [None])[0] if j else None
              if not x:return None
              meta=x.get('meta',{}); ts=x.get('timestamp') or []; q=((x.get('indicators',{}).get('quote') or [{}])[0]); cl=q.get('close') or []; vo=q.get('volume') or []
              bars=[(a,float(b),float(c or 0)) for a,b,c in zip(ts,cl,vo) if b is not None]
              reg=(meta.get('currentTradingPeriod') or {}).get('regular') or {}; rs=reg.get('start'); prev=meta.get('chartPreviousClose') or meta.get('previousClose')
              ext=[b for b in bars if rs and b[0]<rs]
              if not ext or not prev:return None
              lt,px,_=ext[-1]
              if now.timestamp()-lt>15*60:return None
              def vel(n):
                a=[b for b in ext if b[0]>=lt-n*60]; base=a[0][1] if a else None; return ((px/base)-1)*100 if base else None
              v5,v15,v30=vel(5),vel(15),vel(30); ch=(px/prev-1)*100
              recent=sum(b[2] for b in ext if b[0]>=lt-15*60); older=sum(b[2] for b in ext if lt-30*60<=b[0]<lt-15*60); va=(recent/older) if older>0 else None
              old=oldrows.get(t,{})
              first_seen=old.get('firstAHSeenUTC') or datetime.datetime.fromtimestamp(lt,datetime.timezone.utc).isoformat()
              first_ch=old.get('firstAHChangePct') if old.get('firstAHChangePct') is not None else round(ch,3)
              return t,{'ticker':t,'session':'pre-market','last':px,'timestampUTC':datetime.datetime.fromtimestamp(lt,datetime.timezone.utc).isoformat(),'previousClose':prev,'sessionChangePct':round(ch,3),'changeVsPreviousClosePct':round(ch,3),'priceVelocity5mPct':round(v5,3) if v5 is not None else None,'priceVelocity15mPct':round(v15,3) if v15 is not None else None,'priceVelocity30mPct':round(v30,3) if v30 is not None else None,'extendedVolumeLast15m':recent or None,'volumeAcceleration15m':round(va,3) if va is not None else None,'firstAHSeenUTC':first_seen,'firstAHChangePct':first_ch,'peakAHChangePct':max(old.get('peakAHChangePct') or ch,ch),'discoveryQualified':bool(ch>=2 or (v15 or 0)>=1.5 or (va or 0)>=2),'universeSources':sorted(source_tags.get(t,set())),'afterHoursPersistence':t in ahrows,'source':'Yahoo Finance premarket-heartbeat-v2.1'}
            except:return None

          rows={}
          with concurrent.futures.ThreadPoolExecutor(max_workers=40) as ex:
            for z in ex.map(one,tick):
              if z: rows[z[0]]=z[1]

          retained=0
          for t,r in oldrows.items():
            if t in rows: continue
            try: age=(now-datetime.datetime.fromisoformat(r.get('timestampUTC').replace('Z','+00:00'))).total_seconds()/60
            except: age=1e9
            if age<=15 and t in seen:
              rr=dict(r); rr['fallbackRetained']=True; rows[t]=rr; retained+=1

          current=sum(1 for r in rows.values() if not r.get('fallbackRetained'))
          confidence='HIGH' if current>=100 else ('MEDIUM' if current>=40 else ('LOW' if current else 'UNAVAILABLE'))
          out={'schemaVersion':2,'updatedAtUTC':now.isoformat(),'updatedAtET':et.isoformat(),'session':'pre-market','source':'TAGX premarket hot heartbeat event-driven v2.1','trigger':str(__import__('os').environ.get('GITHUB_EVENT_NAME','unknown')),'dataConfidence':confidence,'candidateCount':len(tick),'count':len(rows),'freshCount':current,'fallbackRetainedCount':retained,'laneCounts':lane_counts,'rows':rows,'failClosed':current<20}
          pathlib.Path('tag/data/premarket-hot.json').write_text(json.dumps(out,ensure_ascii=False,indent=2))
          print(json.dumps({'updatedAtET':out['updatedAtET'],'rows':len(rows),'fresh':current,'retained':retained,'candidates':len(tick),'lanes':lane_counts,'confidence':confidence}))
          PY
      - name: Commit heartbeat
        run: |
          git config user.name tagx-premarket-bot
          git config user.email actions@users.noreply.github.com
          git add tag/data/premarket-hot.json
          git diff --cached --quiet && exit 0
          git commit -m 'data: refresh TAGX premarket heartbeat v2.1'
          for i in 1 2 3 4; do git pull --rebase origin main && git push origin HEAD:main && exit 0; sleep $((i*4)); done
          exit 1