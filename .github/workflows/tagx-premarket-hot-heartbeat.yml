name: TAGX Premarket Hot Heartbeat

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/tagx-premarket-hot-heartbeat.yml']
  schedule:
    - cron: '1-56/5 8-13 * * 1-5'

permissions:
  contents: write
concurrency:
  group: tagx-premarket-heartbeat
  cancel-in-progress: true

jobs:
  heartbeat:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
        with: {ref: main, fetch-depth: 0}
      - run: git pull --rebase origin main
      - name: Scan premarket hot universe
        run: |
          python - <<'PY'
          import json,pathlib,datetime,urllib.request,urllib.parse,concurrent.futures,re
          from zoneinfo import ZoneInfo
          ET=ZoneInfo('America/New_York'); now=datetime.datetime.now(datetime.timezone.utc); et=now.astimezone(ET); m=et.hour*60+et.minute
          if not(et.weekday()<5 and 240<=m<570): raise SystemExit(0)
          def load(p):
            try:return json.loads(pathlib.Path(p).read_text())
            except:return {}
          def num(v):
            try:return float(str(v or 0).replace('%','').replace(',','').replace('$',''))
            except:return 0.0
          pools=[]
          for p in ['tag/data/discovery-fast.json','tag/data/discovery.json','tag/data/finviz.json']:
            j=load(p); pools += (j.get('rows') or j.get('data') or [])
          by={}
          for r in pools:
            t=str(r.get('Ticker') or r.get('Symbol') or '').upper().strip()
            if re.match(r'^[A-Z][A-Z0-9.\-]{0,9}$',t): by[t]=r
          # Structural breadth first: low float + prior participation + absolute move, not only current movers.
          tick=sorted(by,key=lambda t:(-(num(by[t].get('Float')) or 1e9),num(by[t].get('Rel Volume')),abs(num(by[t].get('Change')))),reverse=True)[:420]
          prior=load('tag/data/premarket-hot.json'); oldrows=prior.get('rows') or {}
          def one(t):
            try:
              u='https://query1.finance.yahoo.com/v8/finance/chart/'+urllib.parse.quote(t)+'?interval=5m&range=1d&includePrePost=true'
              req=urllib.request.Request(u,headers={'User-Agent':'Mozilla/5.0 TAGXPremarket/1.0','Accept':'application/json'})
              with urllib.request.urlopen(req,timeout=2.8) as z:j=json.loads(z.read())
              x=(j.get('chart',{}).get('result') or [None])[0]
              if not x:return None
              meta=x.get('meta',{}); ts=x.get('timestamp') or []; q=((x.get('indicators',{}).get('quote') or [{}])[0]); cl=q.get('close') or []; vo=q.get('volume') or []
              bars=[(a,float(b),float(c or 0)) for a,b,c in zip(ts,cl,vo) if b is not None]
              reg=(meta.get('currentTradingPeriod') or {}).get('regular') or {}; rs=reg.get('start'); prev=meta.get('chartPreviousClose') or meta.get('previousClose')
              ext=[b for b in bars if rs and b[0]<rs]
              if not ext or not prev:return None
              lt,px,_=ext[-1]
              if now.timestamp()-lt>12*60:return None
              def vel(n):
                a=[b for b in ext if b[0]>=lt-n*60]; base=a[0][1] if a else None; return ((px/base)-1)*100 if base else None
              v5,v15,v30=vel(5),vel(15),vel(30); ch=(px/prev-1)*100
              recent=sum(b[2] for b in ext if b[0]>=lt-15*60); older=sum(b[2] for b in ext if lt-30*60<=b[0]<lt-15*60); va=(recent/older) if older>0 else None
              old=oldrows.get(t,{})
              return t,{'ticker':t,'session':'pre-market','last':px,'timestampUTC':datetime.datetime.fromtimestamp(lt,datetime.timezone.utc).isoformat(),'previousClose':prev,'sessionChangePct':round(ch,3),'changeVsPreviousClosePct':round(ch,3),'priceVelocity5mPct':round(v5,3) if v5 is not None else None,'priceVelocity15mPct':round(v15,3) if v15 is not None else None,'priceVelocity30mPct':round(v30,3) if v30 is not None else None,'extendedVolumeLast15m':recent or None,'volumeAcceleration15m':round(va,3) if va is not None else None,'firstAHSeenUTC':old.get('firstAHSeenUTC') or datetime.datetime.fromtimestamp(lt,datetime.timezone.utc).isoformat(),'firstAHChangePct':old.get('firstAHChangePct') if old.get('firstAHChangePct') is not None else round(ch,3),'peakAHChangePct':max(old.get('peakAHChangePct') or ch,ch),'discoveryQualified':bool(ch>=2 or (v15 or 0)>=1.5 or (va or 0)>=2),'source':'Yahoo Finance premarket-heartbeat'}
            except:return None
          rows={}
          with concurrent.futures.ThreadPoolExecutor(max_workers=56) as ex:
            for z in ex.map(one,tick):
              if z: rows[z[0]]=z[1]
          out={'schemaVersion':1,'updatedAtUTC':now.isoformat(),'updatedAtET':et.isoformat(),'session':'pre-market','source':'TAGX premarket hot heartbeat','dataConfidence':'HIGH' if len(rows)>=80 else ('MEDIUM' if rows else 'UNAVAILABLE'),'candidateCount':len(tick),'count':len(rows),'rows':rows,'failClosed':not bool(rows)}
          pathlib.Path('tag/data/premarket-hot.json').write_text(json.dumps(out,ensure_ascii=False,indent=2))
          print(json.dumps({'updatedAtET':out['updatedAtET'],'rows':len(rows),'candidates':len(tick)}))
          PY
      - name: Commit heartbeat
        run: |
          git config user.name tagx-premarket-bot
          git config user.email actions@users.noreply.github.com
          git add tag/data/premarket-hot.json
          git diff --cached --quiet && exit 0
          git commit -m 'data: refresh TAGX premarket heartbeat'
          for i in 1 2 3; do git pull --rebase origin main && git push origin HEAD:main && exit 0; sleep $((i*4)); done
          exit 1