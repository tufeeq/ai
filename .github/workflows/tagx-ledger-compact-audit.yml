name: TAGX Ledger Compact Audit

on:
  workflow_dispatch:
  schedule:
    - cron: '4-59/5 8-23 * * 1-5'
  push:
    branches: [main]
    paths:
      - 'tag/data/tagx-signal-ledger-v5.json'
      - '.github/workflows/tagx-ledger-compact-audit.yml'

permissions:
  contents: write

concurrency:
  group: tagx-ledger-compact-audit-main
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Sync latest main
        run: git pull --rebase origin main
      - name: Build compact audit
        run: |
          python - <<'PY'
          import json, pathlib, datetime, os, statistics
          SRC=pathlib.Path('tag/data/tagx-signal-ledger-v5.json')
          OUT=pathlib.Path('tag/data/tagx-ledger-compact-audit.json')
          TMP=OUT.with_suffix('.json.tmp')
          if not SRC.exists() or not SRC.stat().st_size:
              raise SystemExit('v5 ledger unavailable; refusing placeholder audit')
          p=json.loads(SRC.read_text(encoding='utf-8'))
          assert p.get('schemaVersion')==5
          tickers=p.get('tickers') or {}
          top=p.get('currentTop20') or []
          if not isinstance(tickers,dict) or not tickers:
              raise SystemExit('ledger has no ticker trace; refusing audit')
          source_counts={}
          path_points=0
          path_lengths=[]
          stale_paths=0
          for e in tickers.values():
              src=str(e.get('firstSource') or 'unknown')
              source_counts[src]=source_counts.get(src,0)+1
              path=e.get('path') or []
              path_points+=len(path); path_lengths.append(len(path))
              if not path: stale_paths+=1
          origin_counts={}
          for x in top:
              c=str(x.get('originClass') or 'UNKNOWN')
              origin_counts[c]=origin_counts.get(c,0)+1
          ah=(p.get('afterHoursContinuationDiagnostic') or [])[:20]
          audit={
            'schemaVersion':1,
            'sourceSchemaVersion':5,
            'sourceAuthority':p.get('ledgerAuthority'),
            'sessionDateET':p.get('sessionDateET'),
            'generatedAtUTC':datetime.datetime.now(datetime.timezone.utc).isoformat(),
            'ledgerUpdatedAtUTC':p.get('updatedAt'),
            'standardTimestampET':p.get('standardTimestampET'),
            'fastTimestampET':p.get('fastTimestampET'),
            'reactiveTimestampET':p.get('reactiveTimestampET'),
            'reactiveFeedValid':bool(p.get('reactiveFeedValid')),
            'trainingEligible':bool(p.get('trainingEligible')),
            'groundTruthEligible':bool(p.get('groundTruthEligible')),
            'tickerCount':len(tickers),
            'pathPointCount':path_points,
            'medianPathPoints':statistics.median(path_lengths) if path_lengths else 0,
            'tickersWithoutPath':stale_paths,
            'firstSourceCounts':source_counts,
            'currentTop20Count':len(top),
            'earlyCaptureUnder10Count':p.get('earlyCaptureUnder10'),
            'earlyCaptureUnder20Count':p.get('earlyCaptureUnder20'),
            'earlyCaptureUnder10Rate':round((p.get('earlyCaptureUnder10') or 0)/len(top),4) if top else None,
            'earlyCaptureUnder20Rate':round((p.get('earlyCaptureUnder20') or 0)/len(top),4) if top else None,
            'coverageMissCount':p.get('coverageMissCount'),
            'originClassCounts':origin_counts,
            'currentTop20':top[:20],
            'afterHoursContinuationTop20':ah,
            'integrity':{
              'nonEmptyTickerTrace':len(tickers)>0,
              'hasPathPoints':path_points>0,
              'top20Consistent':len(top)==int(p.get('currentTop20Count') or 0),
              'compactAuditOnly':True,
              'note':'Diagnostic observability artifact; never training truth or independent market source.'
            }
          }
          TMP.write_text(json.dumps(audit,ensure_ascii=False,indent=2),encoding='utf-8')
          check=json.loads(TMP.read_text(encoding='utf-8'))
          assert check['tickerCount']>0 and check['integrity']['hasPathPoints']
          os.replace(TMP,OUT)
          print('compact audit',check['tickerCount'],'tickers',check['pathPointCount'],'points','top20',check['currentTop20Count'])
          PY
      - name: Validate compact artifact
        run: |
          test -s tag/data/tagx-ledger-compact-audit.json
          python - <<'PY'
          import json
          p=json.load(open('tag/data/tagx-ledger-compact-audit.json',encoding='utf-8'))
          assert p['schemaVersion']==1 and p['tickerCount']>0
          assert p['integrity']['compactAuditOnly'] is True
          print('compact audit contract OK')
          PY
      - name: Commit compact audit
        run: |
          git config user.name "TAGX Ledger Audit"
          git config user.email "actions@users.noreply.github.com"
          git add tag/data/tagx-ledger-compact-audit.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Update TAGX compact ledger audit"
          for i in 1 2 3; do
            git push origin main && exit 0
            git pull --rebase origin main
          done
          exit 1
