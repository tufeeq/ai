name: TAGit v3.2 Minute Backfill Validation

on:
  workflow_dispatch:
  push:
    paths:
      - 'tagit/historical-minute-backfill-v32.py'
      - '.github/workflows/tagit-v32-minute-backfill.yml'

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          filter: blob:none
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check numpy scikit-learn
      - name: Syntax check
        run: python -m py_compile tagit/historical-minute-backfill-v32.py
      - name: Run causal 5m backfill challenger
        run: python tagit/historical-minute-backfill-v32.py
      - name: Verify research contract
        run: |
          python - <<'PY'
          import json
          r=json.load(open('tag/data/tagit-v32-minute-backfill.json'))
          assert r['policy']=='RESEARCH_ONLY_NO_CHAMPION_OVERRIDE'
          assert len(r['results'])==2
          assert r['cohort']['radarObservations']>0
          print('TAGit v3.2 minute backfill contract PASS')
          PY
      - name: Commit derived report only
        run: |
          git config user.name tagit-v32-research-bot
          git config user.email actions@users.noreply.github.com
          git add tag/data/tagit-v32-minute-backfill.json
          git diff --cached --quiet && exit 0
          git commit -m 'data: add TAGit v3.2 minute backfill validation'
          for i in 1 2 3; do
            git pull --rebase --autostash origin main && git push origin HEAD:main && exit 0
            sleep $((i*4))
          done
          exit 1
