name: TAGit v5.4 Context Fusion Audit
on:
  push:
    branches: [main]
    paths:
      - 'tagit/context-fusion-audit-v54.py'
      - '.github/workflows/tagit-v54-context-fusion-audit.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run context fusion audit
        run: python tagit/context-fusion-audit-v54.py
      - name: Validate audit contract
        run: |
          python - <<'PY'
          import json
          r=json.load(open('tag/data/tagit-v54-context-fusion-audit.json'))
          assert r['policy']=='RESEARCH_ONLY_NO_CHAMPION_OVERRIDE'
          assert 'ledgerCoverage' in r and 'blockers' in r
          print('ready=',r['readyForSupervisedContextFusion'],'blockers=',r['blockers'])
          PY
      - name: Commit derived audit
        run: |
          git config user.name tagit-v54-audit-bot
          git config user.email actions@users.noreply.github.com
          git add tag/data/tagit-v54-context-fusion-audit.json
          git diff --cached --quiet && exit 0
          git commit -m 'research: add TAGit v5.4 context fusion audit'
          for i in 1 2 3; do git pull --rebase --autostash origin main && git push origin HEAD:main && exit 0; sleep $((i*5)); done
          exit 1
