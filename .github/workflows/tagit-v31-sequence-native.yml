name: TAGit v3.1 Sequence Native Validation

on:
  workflow_dispatch:
  push:
    paths:
      - 'tagit/sequence-native-v31.py'
      - '.github/workflows/tagit-v31-sequence-native.yml'

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check numpy scikit-learn
      - name: Syntax check
        run: python -m py_compile tagit/sequence-native-v31.py
      - name: Run sequence-native validation
        run: python tagit/sequence-native-v31.py
      - name: Verify contract
        run: |
          python - <<'PY'
          import json
          r=json.load(open('tag/data/tagit-v31-sequence-native.json'))
          assert r['policy']=='RESEARCH_ONLY_NO_CHAMPION_OVERRIDE'
          assert len(r['ablation'])==3
          assert r['coverage']['snapshots']>=200
          assert len(r['coverage']['dates'])>=10
          print('TAGit v3.1 sequence-native contract PASS')
          PY
      - name: Commit report
        run: |
          git config user.name tagit-v31-research-bot
          git config user.email actions@users.noreply.github.com
          git add tag/data/tagit-v31-sequence-native.json
          git diff --cached --quiet && exit 0
          git commit -m 'data: add TAGit v3.1 sequence-native validation'
          for i in 1 2 3; do
            git pull --rebase --autostash origin main && git push origin HEAD:main && exit 0
            sleep $((i*4))
          done
          exit 1
