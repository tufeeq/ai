name: TAGX Proactive Discovery Universe

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tag500-discovery-universe.yml'
  schedule:
    - cron: '*/5 8-23 * * 1-5'

permissions:
  contents: write

concurrency:
  group: tagx-proactive-discovery-main
  cancel-in-progress: true

jobs:
  discovery:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Sync latest main
        run: git pull --rebase origin main

      - name: Fetch pre-move Finviz universe views
        env:
          FINVIZ_TOKEN: ${{ secrets.FINVIZ_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$FINVIZ_TOKEN" || (echo "FINVIZ_TOKEN secret is missing" && exit 1)
          mkdir -p tag/data
          GENERAL_FILTERS="cap_smallunder,sh_avgvol_o100,sh_price_u20,sh_relvol_o0.5"
          GENERAL_BASE="https://elite.finviz.com/export/screener?f=${GENERAL_FILTERS}&auth=${FINVIZ_TOKEN}"
          NANO_FILTERS="cap_smallunder,sh_avgvol_o100,sh_price_u10,sh_float_u20"
          NANO_BASE="https://elite.finviz.com/export/screener?f=${NANO_FILTERS}&auth=${FINVIZ_TOKEN}"
          for lane in general nano; do
            if [ "$lane" = "general" ]; then BASE="$GENERAL_BASE"; else BASE="$NANO_BASE"; fi
            curl --fail --silent --show-error --location --retry 5 --retry-delay 5 --retry-all-errors "${BASE}&v=141" -o "/tmp/tagx-${lane}-performance.csv"
            curl --fail --silent --show-error --location --retry 5 --retry-delay 5 --retry-all-errors "${BASE}&v=131" -o "/tmp/tagx-${lane}-ownership.csv"
            curl --fail --silent --show-error --location --retry 5 --retry-delay 5 --retry-all-errors "${BASE}&v=111" -o "/tmp/tagx-${lane}-overview.csv"
            test -s "/tmp/tagx-${lane}-performance.csv"
            test -s "/tmp/tagx-${lane}-ownership.csv"
            test -s "/tmp/tagx-${lane}-overview.csv"
          done

      - name: Build enriched proactive discovery snapshot
        run: |
          python - <<'PY'
          import csv, json, datetime, pathlib
          from zoneinfo import ZoneInfo
          now_utc=datetime.datetime.now(datetime.timezone.utc)
          now_et=now_utc.astimezone(ZoneInfo('America/New_York'))
          day=now_et.date().isoformat()
          if now_et.weekday()>=5: raise SystemExit('Weekend: no discovery snapshot')
          if datetime.time(4,0)<=now_et.time()<datetime.time(9,30): session='pre-market'
          elif datetime.time(9,30)<=now_et.time()<datetime.time(16,0): session='regular'
          elif datetime.time(16,0)<=now_et.time()<=datetime.time(20,0): session='after-hours'
          else: raise SystemExit('Outside U.S. trading sessions')
          def read_csv(path):
              with open(path,newline='',encoding='utf-8-sig') as f: return list(csv.DictReader(f))
          def ticker(r): return str(r.get('Ticker') or r.get('Symbol') or '').upper().strip()
          def f(v):
              try:return float(str(v or '').replace('%','').replace(',','').replace('$',''))
              except:return None
          def choose(*vals):
              for v in vals:
                  if v not in (None,''): return v
              return ''
          perf={}; own={}; overview={}
          for lane in ('general','nano'):
              for r in read_csv(f'/tmp/tagx-{lane}-performance.csv'): perf.setdefault(ticker(r),{}).update(r)
              for r in read_csv(f'/tmp/tagx-{lane}-ownership.csv'): own.setdefault(ticker(r),{}).update(r)
              for r in read_csv(f'/tmp/tagx-{lane}-overview.csv'): overview.setdefault(ticker(r),{}).update(r)
          symbols=sorted(set(perf)|set(own)|set(overview))
          rows=[]
          for t in symbols:
              p,o,v=perf.get(t,{}),own.get(t,{}),overview.get(t,{})
              price=choose(p.get('Price'),v.get('Price')); change=choose(p.get('Change'),v.get('Change')); volume=choose(p.get('Volume'),v.get('Volume'))
              avg=choose(p.get('Avg Volume'),v.get('Avg Volume')); rel=choose(p.get('Rel Volume'),v.get('Rel Volume')); fl=choose(o.get('Float'),v.get('Float'))
              fln=f(fl); reln=f(rel)
              lanes=[]
              if fln is not None and fln<=20: lanes.append('nano_low_float')
              if reln is not None and reln>=0.5: lanes.append('general')
              if fln is not None and fln<=20 and (reln is None or reln<0.5): lanes.append('nano_quiet_relvol_under_0_5')
              rows.append({'Ticker':t,'Company':choose(v.get('Company'),p.get('Company')),'Sector':v.get('Sector',''),'Industry':v.get('Industry',''),'Country':v.get('Country',''),'Market Cap':choose(v.get('Market Cap'),p.get('Market Cap')),'Price':price,'Change':change,'Volume':volume,'Avg Volume':avg,'Rel Volume':rel,'Float':fl,'Outstanding':choose(o.get('Outstanding'),v.get('Outstanding')),'Short Float':choose(o.get('Short Float'),v.get('Short Float')),'_signals':['pre_move_universe']+(['nano_low_float_watch'] if 'nano_low_float' in lanes else []),'_discoveryUniverse':True,'_discoveryLanes':lanes,'_snapshotTimestampUTC':now_utc.isoformat(),'_snapshotTimestampET':now_et.isoformat(),'_session':session,'_firstObservedTimestampUTC':now_utc.isoformat(),'_firstObservedTimestampET':now_et.isoformat(),'_firstObservedChange':change,'_firstObservedVolume':volume,'_originClass':'EARLY'})
          if not rows: raise SystemExit('empty discovery universe')
          out={'schemaVersion':3,'source':'Finviz Elite proactive multi-lane small-cap universe','sourceType':'PROACTIVE_DISCOVERY','filters':{'general':['cap_smallunder','sh_avgvol_o100','sh_price_u20','sh_relvol_o0.5'],'nano_low_float':['cap_smallunder','sh_avgvol_o100','sh_price_u10','sh_float_u20']},'views':[141,131,111],'updatedAt':now_utc.isoformat(),'snapshotTimestampUTC':now_utc.isoformat(),'snapshotTimestampET':now_et.isoformat(),'session':session,'count':len(rows),'laneCounts':{'nanoLowFloat':sum('nano_low_float' in r['_discoveryLanes'] for r in rows),'nanoQuietRelVolUnder0_5':sum('nano_quiet_relvol_under_0_5' in r['_discoveryLanes'] for r in rows),'general':sum('general' in r['_discoveryLanes'] for r in rows)},'earlyOriginCount':len(rows),'lateOriginCount':0,'executionEligibility':'SEPARATE_SHARIA_AND_DATA_GATES_REQUIRED','trainingEligible':False,'rows':rows}
          pathlib.Path('tag/data/discovery.json').write_text(json.dumps(out,ensure_ascii=False,indent=2),encoding='utf-8')
          print('discovery snapshot',session,now_et.isoformat(),'rows',len(rows))
          PY

      - name: Commit discovery snapshot safely
        run: |
          git config user.name "TAGX Discovery Bot"
          git config user.email "actions@users.noreply.github.com"
          git add tag/data/discovery.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "data: refresh proactive discovery universe"
          for i in 1 2 3 4 5; do
            git pull --rebase origin main && git push origin main && exit 0
            git rebase --abort 2>/dev/null || true
            sleep $((i*3))
          done
          echo "Failed to publish discovery snapshot after retries" >&2
          exit 1
