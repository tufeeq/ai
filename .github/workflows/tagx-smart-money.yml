name: TAGX Smart Money Intelligence

on:
  workflow_dispatch:
  schedule:
    - cron: '*/30 8-23 * * 1-5'
    - cron: '15 1 * * 2-6'

permissions:
  contents: write

concurrency:
  group: tagx-smart-money-main
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Sync main
        run: git pull --rebase origin main
      - name: Build SEC institutional + insider intelligence
        run: python tag/model/build-smart-money.py
      - name: Validate payload
        run: |
          python - <<'PY'
          import json
          x=json.load(open('tag/data/smart-money.json'))
          assert x.get('schemaVersion')==1
          assert isinstance(x.get('tickers'),dict)
          assert x.get('tickerCount',0)>0
          print('validated',x['tickerCount'])
          PY
      - name: Commit smart-money data
        run: |
          git config user.name "TAGX Smart Money Bot"
          git config user.email "actions@users.noreply.github.com"
          git add tag/data/smart-money.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Refresh TAGX smart-money intelligence"
          git pull --rebase origin main
          git push origin main
