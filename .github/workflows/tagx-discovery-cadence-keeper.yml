name: TAGX Discovery Cadence Keeper

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/tagx-discovery-cadence-keeper.yml']
  workflow_run:
    workflows: ["TAG5 Mover Snapshot", "TAGX Premarket Hot Heartbeat"]
    types: [completed]
    branches: [main]
  schedule:
    - cron: '2,12,22,32,42,52 8-23 * * 1-5'

permissions:
  contents: read
  actions: write

concurrency:
  group: tagx-discovery-cadence-keeper-main
  cancel-in-progress: true

jobs:
  keep-discovery-aligned:
    if: >-
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Check discovery and live-quote freshness in U.S. session
        id: guard
        run: |
          python - <<'PY'
          import json, pathlib, datetime, os
          from zoneinfo import ZoneInfo

          now_utc=datetime.datetime.now(datetime.timezone.utc)
          now_et=now_utc.astimezone(ZoneInfo('America/New_York'))
          mins=now_et.hour*60+now_et.minute
          in_session=(240 <= mins <= 1200 and now_et.weekday() < 5)

          def age_minutes(path, keys):
              p=pathlib.Path(path)
              if not p.exists():
                  return 9999.0, None
              try:
                  data=json.loads(p.read_text(encoding='utf-8'))
                  source_ts=next((data.get(k) for k in keys if data.get(k)), None)
                  if not source_ts:
                      return 9999.0, None
                  dt=datetime.datetime.fromisoformat(str(source_ts).replace('Z','+00:00'))
                  return max(0.0,(now_utc-dt.astimezone(datetime.timezone.utc)).total_seconds()/60), source_ts
              except Exception as e:
                  print(f'freshness parse warning {path}:',e)
                  return 9999.0, None

          discovery_age, discovery_ts = age_minutes(
              'tag/data/discovery.json',
              ['snapshotTimestampUTC','updatedAtUTC','updatedAt']
          )
          live_age, live_ts = age_minutes(
              'tag/data/live-quotes.json',
              ['updatedAtUTC','snapshotTimestampUTC','updatedAt']
          )

          # Fail-open only for triggering recovery, never for trading decisions.
          # Discovery is refreshed at >=4m; live quotes at >=7m. Direct live dispatch
          # removes dependence on a successful upstream workflow_run chain.
          dispatch_discovery=in_session and discovery_age >= 4.0
          dispatch_live=in_session and live_age >= 7.0

          print(
              f'ET={now_et.isoformat()} in_session={in_session} '
              f'discovery_age_min={discovery_age:.2f} discovery_ts={discovery_ts} '
              f'live_age_min={live_age:.2f} live_ts={live_ts} '
              f'dispatch_discovery={dispatch_discovery} dispatch_live={dispatch_live}'
          )
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:
              f.write(f'dispatch_discovery={str(dispatch_discovery).lower()}\n')
              f.write(f'discovery_age_min={discovery_age:.2f}\n')
              f.write(f'dispatch_live={str(dispatch_live).lower()}\n')
              f.write(f'live_age_min={live_age:.2f}\n')
          PY

      - name: Dispatch proactive discovery refresh
        if: steps.guard.outputs.dispatch_discovery == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run tag500-discovery-universe.yml --ref main
          echo "Dispatched TAGX discovery; age=${{ steps.guard.outputs.discovery_age_min }}m"

      - name: Dispatch live quote reconciliation directly
        if: steps.guard.outputs.dispatch_live == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run tagx-live-quotes.yml --ref main
          echo "Dispatched TAGX live quotes directly; age=${{ steps.guard.outputs.live_age_min }}m"

      - name: No-op summary
        if: steps.guard.outputs.dispatch_discovery != 'true' && steps.guard.outputs.dispatch_live != 'true'
        run: echo "Discovery and live quotes are fresh, or U.S. trading session is inactive."
