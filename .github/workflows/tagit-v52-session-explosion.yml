name: TAGit v5.2 Session Explosion Patterns
on:
  push:
    branches: [main]
    paths:
      - 'tagit/session-explosion-patterns-v52.py'
      - '.github/workflows/tagit-v52-session-explosion.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: tagit-v52-session-explosion
  cancel-in-progress: true
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check -q numpy scikit-learn
      - name: Syntax check
        run: python -m py_compile tagit/session-explosion-patterns-v52.py
      - name: Train 10/20/50 percent causal pattern models
        run: python tagit/session-explosion-patterns-v52.py
      - name: Verify target and honesty contract
        run: |
          python - <<'PY'
          import json
          r=json.load(open('tag/data/tagit-v52-session-explosion-patterns.json'))
          assert r['policy']=='RESEARCH_ONLY_NO_CHAMPION_OVERRIDE'
          assert r['status'] in ('COMPLETE','INSUFFICIENT')
          if r.get('verdict')=='V52_90_CONFIRMED':
              assert r['calibrationReached90'] and r['holdoutReached90']
              assert r['holdout']['count']>=15 and r['holdout']['precision10Pct']>=90
          print(r.get('verdict'),r.get('splits'),r.get('calibration'),r.get('holdout'))
          PY
      - name: Commit derived pattern report
        run: |
          git config user.name tagit-v52-research-bot
          git config user.email actions@users.noreply.github.com
          git add tag/data/tagit-v52-session-explosion-patterns.json
          git diff --cached --quiet && exit 0
          git commit -m 'research: add TAGit v5.2 session explosion patterns'
          for i in 1 2 3; do git pull --rebase --autostash origin main && git push origin HEAD:main && exit 0; sleep $((i*5)); done
          exit 1
