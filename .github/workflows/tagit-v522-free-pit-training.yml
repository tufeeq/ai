name: TAGit v5.22 Actionable Label PIT Validation

on:
  workflow_dispatch:
  push:
    paths:
      - 'tagit/free-pit-training-v522.py'
      - '.github/workflows/tagit-v522-free-pit-training.yml'

permissions:
  contents: write

concurrency:
  group: tagit-v522-free-pit-training
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      APCA_API_KEY_ID: ${{ secrets.APCA_API_KEY_ID }}
      APCA_API_SECRET_KEY: ${{ secrets.APCA_API_SECRET_KEY }}
      TAGIT_MAX_SYMBOLS: '650'
      TAGIT_HISTORY_DAYS: '730'
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -q numpy scikit-learn
      - name: Syntax check
        run: python -m py_compile tagit/free-pit-training-v522.py
      - name: Run actionable execution-label validation
        run: python tagit/free-pit-training-v522.py
      - name: Verify evidence contract
        run: |
          python - <<'PY'
          import json,pathlib
          p=pathlib.Path('tag/data/tagit-v522-free-pit-training.json')
          assert p.exists()
          r=json.loads(p.read_text())
          assert r['status']=='COMPLETE'
          assert r['validationStatus']=='RESEARCH_COMPARISON_ONLY'
          assert r['holdoutStatus']=='CONSUMED_RESEARCH_HOLDOUT'
          assert r['realDiscoveryPrecisionPct'] is None
          assert r['label']['maeThresholdPct']==-8.0
          assert r['label']['thresholdTuned'] is False
          assert r['providerIntegrity']['marketWidePrecisionClaimAllowed'] is False
          assert 'no regular-session values enter feat vector' in r['antiLeakage']
          print(json.dumps({'label':r['label'],'population':r['population'],'folds':r['development']['foldMetrics'],'researchHoldout':r['researchHoldout']},indent=2))
          PY
      - name: Commit validation evidence
        run: |
          git config user.name "TAGit Research Bot"
          git config user.email "actions@users.noreply.github.com"
          git add tag/data/tagit-v522-free-pit-training.json tag/data/tagit-v522-free-pit-cases.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "research: record v5.22 actionable-label PIT evidence"
          git pull --rebase origin main
          git push origin main
