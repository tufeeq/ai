name: TAGit v5.1 Enhanced Historical Precision
on:
  push:
    branches: [main]
    paths:
      - 'tagit/external-history-v51.py'
      - '.github/workflows/tagit-v51-external-history.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: tagit-v51-external-history
  cancel-in-progress: true
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check -q numpy scikit-learn
      - name: Syntax check
        run: python -m py_compile tagit/external-history-v51.py
      - name: Run enhanced causal historical study
        run: python tagit/external-history-v51.py
      - name: Verify honesty gate
        run: |
          python - <<'PY'
          import json
          r=json.load(open('tag/data/tagit-v51-external-history.json'))
          assert r['policy']=='RESEARCH_ONLY_NO_CHAMPION_OVERRIDE'
          if r.get('verdict')=='V51_EXTERNAL_90_CONFIRMED':
              assert r['calibrationReached90'] and r['holdoutReached90']
              assert r['holdout']['count']>=15 and r['holdout']['precisionPct']>=90
          print(r.get('verdict'),r.get('calibration'),r.get('holdout'))
          PY
      - name: Commit derived report
        run: |
          git config user.name tagit-v51-research-bot
          git config user.email actions@users.noreply.github.com
          git add tag/data/tagit-v51-external-history.json
          git diff --cached --quiet && exit 0
          git commit -m 'research: add TAGit v5.1 enhanced history result'
          for i in 1 2 3; do git pull --rebase --autostash origin main && git push origin HEAD:main && exit 0; sleep $((i*5)); done
          exit 1
