name: TAGit v5.12 Fixed-Cutoff Pre-Open

on:
  workflow_dispatch:
  push:
    paths:
      - 'tagit/preopen-fixed-cutoff-v512.py'

permissions:
  contents: write

concurrency:
  group: tagit-v512-preopen-fixed-cutoff
  cancel-in-progress: false

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -q numpy scikit-learn
      - name: Syntax check
        run: python -m py_compile tagit/preopen-fixed-cutoff-v512.py
      - name: Validate fixed-cutoff pre-open architecture
        run: python tagit/preopen-fixed-cutoff-v512.py
      - name: Verify causal pre-open contract
        run: |
          python - <<'PY'
          import json, pathlib
          p=pathlib.Path('tag/data/tagit-v512-preopen-fixed-cutoff.json')
          assert p.exists()
          r=json.loads(p.read_text())
          assert r['status']=='COMPLETE', r.get('status')
          assert r['decisionPolicy']['cutoffET']=='09:15'
          assert r['validation']['independentUnit']=='ticker-day'
          assert r['validation']['holdoutTouchedAfterFreeze'] is True
          assert r['universeIntegrity']['realDiscoveryPrecisionClaimable'] is False or r['universeIntegrity']['pointInTimeEligible'] is True
          assert r['accuracyGate']['forwardConfirmationRequired'] is True
          print('v5.12 calibration:',r['calibration'])
          print('v5.12 holdout:',r['holdout'])
          print('v5.12 universe integrity:',r['universeIntegrity'])
          PY
      - name: Commit fixed-cutoff evidence
        run: |
          git config user.name "TAGit Research Bot"
          git config user.email "actions@users.noreply.github.com"
          git add tag/data/tagit-v512-preopen-fixed-cutoff.json tag/data/tagit-v512-preopen-cases.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "research: record v5.12 fixed-cutoff pre-open evidence"
          git pull --rebase origin main
          git push origin main
