name: Deploy TAGit + MarginOS + OPERON

on:
  push:
    branches: [main]
    paths:
      - 'tagit/**'
      - 'tagit10/**'
      - 'marginos/**'
      - 'operon/**'
      - '.github/workflows/pages-tagx-deploy.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: tagit-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - name: Use Node 24 for OPERON persistence tests
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Validate frontends
        run: |
          node --check tagit/live-v6.js
          node --check tagit/early-v9.js
          node --check tagit/live-v6-price-overlay.js
          node --check tagit/technical-v7.js
          node --check tagit/feed-recovery-v7.js
          node --check tagit/post-session.js
          node --check tagit10/app.js
          node --check tagit10/trader.js
          node --check tagit10/trade_math.js
          node tagit10/tests/test_trade_math.js
          python -m py_compile tagit10/engine.py tagit10/post_session.py
          node --check operon/engine.js
          node operon/test.js
          node operon/stress-test.js
          node --check operon/marketing.mjs
          node --check operon/app.mjs
          node --check operon/server.mjs
          node --test operon/tests/core.test.mjs operon/tests/api.test.mjs
          node operon/tests/simulation.mjs
          grep -q 'MarginOS' marginos/index.html
          grep -q 'OPERON' operon/index.html
      - name: Build Pages artifact
        run: |
          rm -rf _site
          mkdir -p _site/tagit _site/tagit10 _site/marginos _site/operon
          cp tagit/index.html tagit/post-session.html tagit/post-session.js tagit/post-session.css tagit/live-v6.js tagit/early-v9.js tagit/live-v6-price-overlay.js tagit/technical-v7.js tagit/feed-recovery-v7.js tagit/live-v6.css _site/tagit/
          cp tagit10/index.html tagit10/app.js tagit10/trader.js tagit10/trade_math.js tagit10/style.css _site/tagit10/
          cp marginos/index.html _site/marginos/
          cp operon/index.html operon/engine.js operon/app.mjs operon/core.mjs operon/styles.css operon/favicon.svg operon/welcome.html operon/marketing.css operon/marketing.mjs _site/operon/
          test -e _site/operon/index.html
          test -e _site/operon/engine.js
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
