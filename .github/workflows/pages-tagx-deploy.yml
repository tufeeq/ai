name: Deploy TAGit Live 6

on:
  push:
    branches: [main]
    paths:
      - 'tagit/index.html'
      - 'tagit/live-v6.js'
      - 'tagit/live-v6.css'
      - '.github/workflows/pages-tagx-deploy.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: tagit-live-6-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - name: Build TAGit Live 6 artifact
        run: |
          rm -rf _site
          mkdir -p _site/tagit
          cp tagit/index.html tagit/live-v6.js tagit/live-v6.css _site/tagit/
          test -e _site/tagit/index.html
          test -e _site/tagit/live-v6.js
          test -e _site/tagit/live-v6.css
          echo 'TAGit Live 6 artifact ready'
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
