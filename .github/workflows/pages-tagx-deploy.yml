name: Deploy TAGit + MarginOS + OPERON + DONT CHAOS

on:
  push:
    branches: [main]
    paths:
      - 'tagit/**'
      - 'tagit10/**'
      - 'tagit-next/**'
      - 'marginos/**'
      - 'operon/**'
      - 'dont-chaos/**'
      - '.github/workflows/pages-tagx-deploy.yml'
  workflow_run:
    workflows: ['TAGit Lab']
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: tagit-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - name: Use Node 24 for OPERON persistence tests
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Validate frontends
        run: |
          node --check tagit-next/workspace-tabs.mjs
          node --check tagit-next/lab/lab.mjs
          node --check tagit-next/app.js
          node --check tagit-next/phase1.js
          node --check tagit-next/performance.js
          node --test tagit-next/phase2-view.test.mjs
          python tagit-next/verify-evidence-release.py --local
          node --test tagit-next/tests/opportunity.test.mjs tagit-next/tests/app.test.mjs tagit-next/tests/sources.test.mjs tagit-next/tests/research.test.mjs tagit-next/tests/sipscan.test.mjs tagit-next/tests/sipstudy.test.mjs tagit-next/tests/exitstudy.test.mjs tagit-next/tests/filterstudy.test.mjs tagit-next/tests/dailystudy.test.mjs
          python -m unittest discover -s tagit-next/pipeline -p 'test_*.py'
          for f in tagit-next/src/*.js tagit-next/src/core/*.js tagit-next/src/views/*.js; do node --check "$f"; done
          python -m json.tool tagit-next/execution-latency.json > /dev/null
          python -m json.tool tagit-next/live-config.json > /dev/null
          python -m json.tool tagit-next/snapshot.json > /dev/null
          node --check tagit/live-v6.js
          node --check tagit/early-v9.js
          node --check tagit/live-v6-price-overlay.js
          node --check tagit/technical-v7.js
          node --check tagit/feed-recovery-v7.js
          node --check tagit/post-session.js
          node --check tagit10/execution-ui.js
          node --check tagit10/app.js
          node --check tagit10/trader.js
          node --check tagit10/session-ui.js
          node --check tagit10/explosive-ui.js
          node --check tagit10/trade_math.js
          node tagit10/tests/test_trade_math.js
          python -m py_compile tagit10/engine.py tagit10/post_session.py
          python -m unittest discover -s tagit10/tests -p 'test_execution.py'
          python -m unittest discover -s tagit10/tests -p 'test_engine.py'
          python -m unittest discover -s tagit10/tests -p 'test_quality.py'
          python -m unittest discover -s tagit10/tests -p 'test_integrity.py'
          python -m unittest discover -s tagit10/tests -p 'test_session_signals.py'
          python -m unittest discover -s tagit10/tests -p 'test_discovery.py'
          node --check operon/engine.js
          node operon/test.js
          node operon/stress-test.js
          node operon/tests/day1-engine-validation.js
          node operon/tests/day2-engine-validation.js
          node operon/tests/day2-core-diagnostic.mjs
          node operon/tests/day3-core-calibration.mjs
          node --check operon/marketing.mjs
          node --check operon/app.mjs
          node --check operon/server.mjs
          node --test operon/tests/core.test.mjs operon/tests/api.test.mjs
          node operon/tests/simulation.mjs
          grep -q 'MarginOS' marginos/index.html
          grep -q 'OPERON' operon/index.html
      - name: Build Pages artifact
        run: |
          rm -rf _site
          mkdir -p _site/tagit _site/tagit10 _site/marginos _site/operon _site/tagit-next
          cp tagit-next/opportunity.mjs tagit-next/index.html tagit-next/app.js tagit-next/style.css tagit-next/snapshot.json tagit-next/live-config.json tagit-next/execution-latency.json _site/tagit-next/
          cp -R tagit-next/src _site/tagit-next/src
          cp -R tagit-next/data _site/tagit-next/data
          test -s _site/tagit-next/src/state.js
          cp tagit-next/workspace-tabs.mjs _site/tagit-next/
          cp -R tagit-next/lab _site/tagit-next/lab
          test -s _site/tagit-next/lab/index.html
          test -s _site/tagit-next/index.html
          cp tagit-next/phase1.js tagit-next/phase1-evidence.json tagit-next/performance.html tagit-next/performance.js tagit-next/phase2-view.mjs tagit-next/phase2-evidence.json tagit-next/evidence-release.json _site/tagit-next/
          cp tagit/index.html tagit/post-session.html tagit/post-session.js tagit/post-session.css tagit/live-v6.js tagit/early-v9.js tagit/live-v6-price-overlay.js tagit/technical-v7.js tagit/feed-recovery-v7.js tagit/live-v6.css _site/tagit/
          cp tagit10/index.html tagit10/app.js tagit10/trader.js tagit10/trade_math.js tagit10/explosive-ui.js tagit10/session-ui.js tagit10/execution-ui.js tagit10/style.css _site/tagit10/
          mkdir -p _site/tagit10/reports
          cp tagit10/reports/live-alert-audit-2026-09-14.json tagit10/reports/session-study.json _site/tagit10/reports/
          cp marginos/index.html _site/marginos/
          cp operon/index.html operon/engine.js operon/app.mjs operon/core.mjs operon/styles.css operon/favicon.svg operon/welcome.html operon/marketing.css operon/marketing.mjs _site/operon/
          test -e _site/operon/index.html
          test -e _site/operon/engine.js
      - name: Verify and unpack DONT CHAOS
        run: |
          cat dont-chaos/release.part* > dont-chaos/release.tgz
          sha256sum -c dont-chaos/release.sha256
          mkdir -p _site/dont-chaos
          tar -xzf dont-chaos/release.tgz -C _site/dont-chaos
          python dont-chaos/turbo-install.py _site/dont-chaos
          python dont-chaos/directors-install.py _site/dont-chaos
          python dont-chaos/original-install.py _site/dont-chaos
          test -s _site/dont-chaos/index.html
          python -m json.tool _site/dont-chaos/manifest.webmanifest > /dev/null
          node --check _site/dont-chaos/sw.js
      - name: Browser gate for ORIGINAL CHAOS before publication
        if: contains(github.event.head_commit.message, 'ORIGINAL CHAOS')
        timeout-minutes: 10
        run: |
          npm install --no-save --prefix /tmp/chaos-browser playwright@1.62.1
          node /tmp/chaos-browser/node_modules/playwright/cli.js install --with-deps webkit
          python -m http.server 8765 --directory _site > /tmp/chaos-http.log 2>&1 &
          server=$!
          trap 'kill "$server" || true' EXIT
          SITE_URL=http://127.0.0.1:8765/dont-chaos/ WEBKIT=1 QA_DIR=/tmp/chaos-original-predeploy NODE_PATH=/tmp/chaos-browser/node_modules node /tmp/dont-chaos-original-source/tests/release/smoke.cjs
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify public TAGit NEXT evidence release
        env:
          PAGES_URL: ${{ steps.deployment.outputs.page_url }}
        run: python tagit-next/verify-evidence-release.py
      - name: Verify public DONT CHAOS URL and release bytes
        env:
          PAGES_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          python - <<'PY'
          import hashlib, json, os, pathlib, time, urllib.request
          base = os.environ['PAGES_URL'].rstrip('/') + '/dont-chaos/'
          manifest = json.loads(pathlib.Path('_site/dont-chaos/original-release.json').read_text())
          assert manifest['build'] == 'original-4.1.0'
          names = list(manifest['files']) + ['original-release.json']
          for name in names:
              expected = pathlib.Path('_site/dont-chaos', name).read_bytes()
              path = '' if name == 'index.html' else name
              url = base + path + '?verify=' + os.environ['GITHUB_SHA']
              for attempt in range(6):
                  try:
                      req = urllib.request.Request(url, headers={'Cache-Control': 'no-cache', 'User-Agent': 'DONT-CHAOS-Deployment-Check'})
                      with urllib.request.urlopen(req, timeout=15) as response:
                          actual = response.read()
                          if response.status != 200:
                              raise RuntimeError('Unexpected HTTP status: ' + str(response.status))
                      if actual != expected:
                          raise RuntimeError('Published asset differs from verified release: ' + name)
                      print('HTTP 200, exact release match:', base + path, len(actual), 'bytes, sha256', hashlib.sha256(actual).hexdigest())
                      break
                  except Exception as exc:
                      print('Verification attempt', attempt + 1, name, str(exc))
                      if attempt == 5:
                          raise
                      time.sleep(5)
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              summary.write('## ORIGINAL CHAOS English deployment verified\n\n' + base + '\n\nAll ' + str(len(names)) + ' public assets, including four MP3s and both prior releases, returned HTTP 200 and exactly matched this build.\n')
          PY
      - name: Live-browser check for ORIGINAL CHAOS release
        if: contains(github.event.head_commit.message, 'ORIGINAL CHAOS')
        timeout-minutes: 6
        env:
          PAGES_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          WEBKIT=1 QA_DIR=/tmp/chaos-original-live NODE_PATH=/tmp/chaos-browser/node_modules node /tmp/dont-chaos-original-source/tests/release/smoke.cjs
      - name: Preserve ORIGINAL CHAOS QA reports and screenshots
        if: always() && contains(github.event.head_commit.message, 'ORIGINAL CHAOS')
        uses: actions/upload-artifact@v4
        with:
          name: original-chaos-browser-reports
          path: |
            /tmp/chaos-original-predeploy/
            /tmp/chaos-original-live/
          if-no-files-found: warn

