name: Deploy TAGit Live 9

on:
  push:
    branches: [main]
    paths:
      - 'tagit/index.html'
      - 'tagit/post-session.html'
      - 'tagit/post-session.js'
      - 'tagit/post-session.css'
      - 'tagit/live-v6.js'
      - 'tagit/early-v9.js'
      - 'tagit/live-v6-price-overlay.js'
      - 'tagit/technical-v7.js'
      - 'tagit/feed-recovery-v7.js'
      - 'tagit/live-v6.css'
      - '.github/workflows/pages-tagx-deploy.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: tagit-live-9-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - name: Validate Live 9 frontend
        run: |
          node --check tagit/live-v6.js
          node --check tagit/early-v9.js
          node --check tagit/live-v6-price-overlay.js
          node --check tagit/technical-v7.js
          node --check tagit/feed-recovery-v7.js
          node --check tagit/post-session.js
          grep -q 'id="confirmedCount"' tagit/index.html
          grep -q 'id="opportunities"' tagit/index.html
          grep -q 'post-session.html' tagit/index.html
          grep -q 'id="reportStatus"' tagit/post-session.html
          grep -q 'post-session.js' tagit/post-session.html
      - name: Build TAGit Live 9 artifact
        run: |
          rm -rf _site
          mkdir -p _site/tagit
          cp tagit/index.html tagit/post-session.html tagit/post-session.js tagit/post-session.css tagit/live-v6.js tagit/early-v9.js tagit/live-v6-price-overlay.js tagit/technical-v7.js tagit/feed-recovery-v7.js tagit/live-v6.css _site/tagit/
          test -e _site/tagit/index.html
          test -e _site/tagit/post-session.html
          echo 'TAGit Live 9 artifact ready'
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
