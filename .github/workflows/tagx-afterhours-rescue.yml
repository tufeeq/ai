name: TAGX After-Hours Native Discovery

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tagx-afterhours-rescue.yml'
  schedule:
    - cron: '*/5 20-23 * * 1-5'
    - cron: '*/5 0 * * 2-6'

permissions:
  contents: write

concurrency:
  group: tagx-afterhours-native
  cancel-in-progress: false

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - run: git pull --rebase origin main
      - name: Broad native after-hours discovery
        run: |
          python - <<'PY'
          import json,pathlib,datetime,urllib.request,urllib.parse,concurrent.futures,re
          from zoneinfo import ZoneInfo

          ET=ZoneInfo('America/New_York')
          now=datetime.datetime.now(datetime.timezone.utc)
          et=now.astimezone(ET)
          minute=et.hour*60+et.minute
          if not (et.weekday()<5 and 960<=minute<=1200):
              print('Outside after-hours; preserving last good snapshot')
              raise SystemExit(0)

          def load(p):
              try:return json.loads(pathlib.Path(p).read_text(encoding='utf-8'))
              except:return {}
          def num(v):
              try:return float(str(v or 0).replace('%','').replace(',','').replace('$',''))
              except:return 0.0
          def symbol(r):return str(r.get('Ticker') or r.get('ticker') or r.get('Symbol') or r.get('symbol') or '').upper().strip()

          source_files=[('fast','tag/data/discovery-fast.json'),('standard','tag/data/discovery.json'),('finviz','tag/data/finviz.json')]
          by={}; order=[]
          for src,p in source_files:
              j=load(p)
              for r in (j.get('rows') or j.get('data') or []):
                  t=symbol(r)
                  if not re.match(r'^[A-Z][A-Z0-9.\-]{0,9}$',t):continue
                  if t not in by:by[t]={**r,'_ahUniverseSource':src};order.append(t)
                  else:
                      old=by[t]
                      for k,v in r.items():
                          if v not in (None,'') and old.get(k) in (None,''):old[k]=v
          prior=load('tag/data/extended-hours.json'); prior_rows=(prior.get('rows') or {}) if prior.get('session')=='after-hours' else {}
          # Scan recently active AH names first, then broad universe. This keeps the feed fresh even if the broad tail is slow.
          hot=sorted(prior_rows,key=lambda t:(prior_rows[t].get('nativeRankScore') or 0,prior_rows[t].get('sessionChangePct') or 0),reverse=True)
          seen=set(); tickers=[]
          for t in hot+order:
              if t in by and t not in seen:seen.add(t);tickers.append(t)
          tickers=tickers[:1600]; candidates=[by[t] for t in tickers]

          def one(r):
              t=symbol(r)
              try:
                  url='https://query1.finance.yahoo.com/v8/finance/chart/'+urllib.parse.quote(t)+'?interval=5m&range=1d&includePrePost=true'
                  req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0 TAGXResearch/2.1','Accept':'application/json'})
                  with urllib.request.urlopen(req,timeout=3) as z:j=json.loads(z.read().decode('utf-8'))
                  res=(j.get('chart',{}).get('result') or [None])[0]
                  if not res:return t,None
                  meta=res.get('meta',{});ts=res.get('timestamp') or [];q=((res.get('indicators',{}).get('quote') or [{}])[0]);cl=q.get('close') or [];vo=q.get('volume') or []
                  bars=[(a,float(b),float(c or 0)) for a,b,c in zip(ts,cl,vo) if b is not None]
                  reg=(meta.get('currentTradingPeriod') or {}).get('regular') or {};end=reg.get('end');start=reg.get('start')
                  regular=[b for b in bars if start and end and start<=b[0]<=end];rclose=regular[-1][1] if regular else meta.get('regularMarketPrice') or meta.get('previousClose')
                  ext=[b for b in bars if end and b[0]>end]
                  if not ext or not rclose:return t,None
                  lt,px,_=ext[-1]
                  if now.timestamp()-lt>12*60:return t,None
                  def vel(mins):
                      arr=[b for b in ext if b[0]>=lt-mins*60]
                      if not arr:return None
                      base=arr[0][1];return ((px/base)-1)*100 if base else None
                  v5,v15,v30=vel(5),vel(15),vel(30)
                  arr30=[b for b in ext if b[0]>=lt-1800]
                  sl=None
                  if len(arr30)>=3:
                      ys=[b[1] for b in arr30];xs=list(range(len(ys)));xm=sum(xs)/len(xs);ym=sum(ys)/len(ys);den=sum((x-xm)**2 for x in xs)
                      if den and ys[0]:sl=(sum((x-xm)*(y-ym) for x,y in zip(xs,ys))/den/ys[0])*100
                  recent=[b for b in ext if b[0]>=lt-900];oldv=[b for b in ext if lt-1800<=b[0]<lt-900];rv=sum(b[2] for b in recent);pv=sum(b[2] for b in oldv);ev=sum(b[2] for b in ext);vacc=(rv/pv) if pv>0 else None
                  sch=(px/rclose-1)*100;prev=meta.get('chartPreviousClose') or meta.get('previousClose') or rclose;day=(px/prev-1)*100 if prev else None
                  qualifies=bool(abs(sch)>=2 or abs(v5 or 0)>=1 or abs(v15 or 0)>=1.5 or (ev>=5000 and abs(sch)>=0.75))
                  old=prior_rows.get(t) or {};first_ts=old.get('firstAHSeenUTC');first_ch=old.get('firstAHChangePct')
                  if not first_ts and qualifies:first_ts=datetime.datetime.fromtimestamp(lt,datetime.timezone.utc).isoformat();first_ch=round(sch,3)
                  old_peak=old.get('peakAHChangePct');peak=max([x for x in [old_peak,sch] if isinstance(x,(int,float))],default=sch);giveback=max(0.0,peak-sch) if peak>0 else 0.0
                  score=max(0.0,sch)*4+max(0.0,v5 or 0)*3+max(0.0,v15 or 0)*2
                  if vacc is not None and vacc>=1.5 and (v5 or 0)>0:score+=8
                  if ev>=25000:score+=6
                  if sl is not None and sl>0:score+=4
                  score=max(0,min(100,round(score)))
                  return t,{'ticker':t,'session':'after-hours','last':px,'timestampUTC':datetime.datetime.fromtimestamp(lt,datetime.timezone.utc).isoformat(),'rthClose':rclose,'sessionBase':rclose,'previousClose':prev,'sessionChangePct':round(sch,3),'changeVsPreviousClosePct':round(day,3) if day is not None else None,'priceVelocity5mPct':round(v5,3) if v5 is not None else None,'priceVelocity15mPct':round(v15,3) if v15 is not None else None,'priceVelocity30mPct':round(v30,3) if v30 is not None else None,'persistenceSlope5mPct':round(sl,3) if sl is not None else None,'persistencePass':bool((v15 or 0)>0 and (sl or 0)>0 and (v5 or 0)>=0),'extendedVolume':ev or None,'extendedVolumeLast15m':rv or None,'volumeAcceleration15m':round(vacc,3) if vacc is not None else None,'velocityQuality':'HIGH' if len(recent)>=3 else 'MEDIUM','afterHoursActivityScore':round(abs(sch)+(abs(v15 or 0)*0.7),3),'nativeRankScore':score,'discoveryQualified':qualifies,'firstAHSeenUTC':first_ts,'firstAHChangePct':first_ch,'peakAHChangePct':round(peak,3),'peakGivebackPts':round(giveback,3),'originClass':'AH_NATIVE_EARLY_LT10' if first_ch is not None and first_ch<10 else ('AH_NATIVE_LATE' if first_ch is not None else 'AH_OBSERVED'),'universeSource':r.get('_ahUniverseSource'),'rthChangePct':num(r.get('Change')),'source':'Yahoo Finance chart includePrePost=true'}
              except Exception:return t,None

          rows={}
          with concurrent.futures.ThreadPoolExecutor(max_workers=64) as ex:
              for t,r in ex.map(one,candidates):
                  if r:rows[t]=r
          ranked=sorted(rows.values(),key=lambda r:(r.get('nativeRankScore') or 0,r.get('sessionChangePct') or 0),reverse=True);discoveries=[r for r in ranked if r.get('discoveryQualified')]
          leaders=[{'ticker':r['ticker'],'sessionChangePct':r.get('sessionChangePct'),'firstAHChangePct':r.get('firstAHChangePct'),'priceVelocity15mPct':r.get('priceVelocity15mPct'),'nativeRankScore':r.get('nativeRankScore')} for r in discoveries[:30]]
          out={'schemaVersion':7,'updatedAtUTC':now.isoformat(),'updatedAtET':et.isoformat(),'session':'after-hours','source':'Yahoo Finance chart includePrePost=true broad-universe','scannerMode':'AH_NATIVE_FRESHNESS_FIRST','dataConfidence':'HIGH' if len(rows)>=100 else ('MEDIUM' if len(rows)>=20 else ('LOW' if rows else 'UNAVAILABLE')),'rows':rows,'count':len(rows),'candidateCount':len(candidates),'universeCount':len(by),'discoveryCount':len(discoveries),'scanPolicy':'HOT_FIRST_THEN_BROAD_UNIVERSE','topNativeDiscoveries':leaders,'failClosed':not bool(rows)}
          pathlib.Path('tag/data/extended-hours.json').write_text(json.dumps(out,ensure_ascii=False,indent=2),encoding='utf-8')
          print(json.dumps({'updatedAtET':et.isoformat(),'rows':len(rows),'discoveries':len(discoveries),'leaders':leaders[:8]},ensure_ascii=False))
          PY
      - name: Commit
        run: |
          git config user.name 'tagx-afterhours-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add tag/data/extended-hours.json
          git diff --cached --quiet && exit 0
          git commit -m 'data: refresh TAGX native after-hours discovery'
          for i in 1 2 3 4 5; do git pull --rebase origin main && git push origin HEAD:main && exit 0; sleep $((i*4)); done
          exit 1
