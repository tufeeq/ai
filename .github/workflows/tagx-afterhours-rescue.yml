name: TAGX After-Hours Rescue

on:
  workflow_dispatch:
  schedule:
    - cron: '1-56/5 20-23 * * 1-5'
    - cron: '1 0 * * 2-6'

permissions:
  contents: write

concurrency:
  group: tagx-afterhours-rescue
  cancel-in-progress: false

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - run: git pull --rebase origin main
      - name: Capture after-hours quotes
        run: |
          python - <<'PY'
          import json,pathlib,datetime,urllib.request,urllib.parse,concurrent.futures,re
          from zoneinfo import ZoneInfo
          ET=ZoneInfo('America/New_York'); now=datetime.datetime.now(datetime.timezone.utc); et=now.astimezone(ET); m=et.hour*60+et.minute
          if not (et.weekday()<5 and 960<=m<=1200):
              print('Outside after-hours; preserving last good snapshot'); raise SystemExit(0)
          def load(p):
              try:return json.loads(pathlib.Path(p).read_text())
              except:return {}
          def num(v):
              try:return float(str(v or 0).replace('%','').replace(',',''))
              except:return 0.0
          pool=[]
          for p in ['tag/data/discovery-fast.json','tag/data/discovery.json','tag/data/finviz.json']:
              j=load(p); pool += j.get('rows') or j.get('data') or []
          by={}
          for r in pool:
              t=str(r.get('Ticker') or r.get('Symbol') or '').upper().strip()
              if re.match(r'^[A-Z][A-Z0-9.\-]{0,9}$',t) and (t not in by or abs(num(r.get('Change')))>abs(num(by[t].get('Change')))): by[t]=r
          ranked=sorted(by.values(),key=lambda r:(abs(num(r.get('Change'))),num(r.get('Rel Volume')),num(r.get('Volume'))),reverse=True)[:180]
          def one(r):
              t=str(r.get('Ticker') or r.get('Symbol')).upper()
              try:
                  url='https://query1.finance.yahoo.com/v8/finance/chart/'+urllib.parse.quote(t)+'?interval=5m&range=1d&includePrePost=true'
                  req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0 TAGXResearch/1.0'})
                  with urllib.request.urlopen(req,timeout=6) as z:j=json.loads(z.read())
                  res=(j.get('chart',{}).get('result') or [None])[0]
                  if not res:return t,None
                  meta=res.get('meta',{}); ts=res.get('timestamp') or []; q=((res.get('indicators',{}).get('quote') or [{}])[0]); cl=q.get('close') or []; vo=q.get('volume') or []
                  bars=[(a,float(b),float(c or 0)) for a,b,c in zip(ts,cl,vo) if b is not None]
                  reg=(meta.get('currentTradingPeriod') or {}).get('regular') or {}; end=reg.get('end'); start=reg.get('start')
                  regular=[b for b in bars if start and end and start<=b[0]<=end]
                  rclose=regular[-1][1] if regular else meta.get('regularMarketPrice') or meta.get('previousClose')
                  ext=[b for b in bars if end and b[0]>end]
                  if not ext or not rclose:return t,None
                  lt,px,_=ext[-1]
                  def vel(mins):
                      a=[b for b in ext if b[0]>=lt-mins*60]; base=a[0][1] if a else ext[0][1]; return ((px/base)-1)*100 if base else None
                  v5,v15,v30=vel(5),vel(15),vel(30); recent=[b for b in ext if b[0]>=lt-900]; prior=[b for b in ext if lt-1800<=b[0]<lt-900]; rv=sum(b[2] for b in recent); pv=sum(b[2] for b in prior); ev=sum(b[2] for b in ext)
                  return t,{'ticker':t,'session':'after-hours','last':px,'timestampUTC':datetime.datetime.fromtimestamp(lt,datetime.timezone.utc).isoformat(),'rthClose':rclose,'sessionBase':rclose,'sessionChangePct':round((px/rclose-1)*100,3),'changeVsPreviousClosePct':round((px/(meta.get('chartPreviousClose') or meta.get('previousClose') or rclose)-1)*100,3),'priceVelocity5mPct':round(v5,3) if v5 is not None else None,'priceVelocity15mPct':round(v15,3) if v15 is not None else None,'priceVelocity30mPct':round(v30,3) if v30 is not None else None,'extendedVolume':ev or None,'extendedVolumeLast15m':rv or None,'volumeAcceleration15m':round(rv/pv,3) if pv else None,'velocityQuality':'HIGH' if len(recent)>=3 else 'MEDIUM','source':'Yahoo Finance chart includePrePost=true'}
              except Exception:return t,None
          rows={}
          with concurrent.futures.ThreadPoolExecutor(max_workers=24) as ex:
              for t,r in ex.map(one,ranked):
                  if r: rows[t]=r
          out={'schemaVersion':4,'updatedAtUTC':now.isoformat(),'updatedAtET':et.isoformat(),'session':'after-hours','source':'Yahoo Finance chart includePrePost=true','dataConfidence':'MEDIUM' if len(rows)>=20 else ('LOW' if rows else 'UNAVAILABLE'),'rows':rows,'count':len(rows),'candidateCount':len(ranked),'failClosed':not bool(rows)}
          pathlib.Path('tag/data/extended-hours.json').write_text(json.dumps(out,ensure_ascii=False,indent=2))
          print('after-hours rows',len(rows))
          PY
      - name: Commit
        run: |
          git config user.name 'tagx-afterhours-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add tag/data/extended-hours.json
          git diff --cached --quiet && exit 0
          git commit -m 'data: refresh TAGX after-hours rescue feed'
          for i in 1 2 3 4; do git pull --rebase origin main && git push origin HEAD:main && exit 0; sleep $((i*5)); done
          exit 1
