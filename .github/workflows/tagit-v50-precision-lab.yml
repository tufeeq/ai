name: TAGit v5.0 Strict Precision Lab
on:
  push:
    branches: [main]
    paths:
      - 'tagit/precision-lab-v50.py'
      - '.github/workflows/tagit-v50-precision-lab.yml'
      - 'tag/data/tagit-v39-frozen-groundtruth.json'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: tagit-v50-precision-lab
  cancel-in-progress: true
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Sync latest main
        run: git pull --ff-only origin main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -q numpy scikit-learn
      - name: Syntax check
        run: python -m py_compile tagit/precision-lab-v50.py
      - name: Run strict causal precision lab
        run: python tagit/precision-lab-v50.py
      - name: Verify no fake 90 percent claim
        run: |
          python - <<'PY'
          import json
          r=json.load(open('tag/data/tagit-v50-precision-lab.json'))
          assert r['policy']=='RESEARCH_ONLY_NO_CHAMPION_OVERRIDE'
          assert r['precisionObjectivePct']==90.0
          if r['verdict']=='V50_90PCT_HOLDOUT_CONFIRMED':
              assert r['calibrationReached90'] is True
              assert r['holdoutReached90'] is True
              assert r['holdout']['count']>=8
              assert r['holdout']['precision10Pct']>=90
          print(r['verdict'], r['calibration'], r['holdout'])
          PY
      - name: Commit derived report only
        run: |
          git config user.name tagit-v50-research-bot
          git config user.email actions@users.noreply.github.com
          git add tag/data/tagit-v50-precision-lab.json
          git diff --cached --quiet && exit 0
          git commit -m 'research: add TAGit v5.0 strict precision result'
          for i in 1 2 3; do
            git pull --rebase --autostash origin main && git push origin HEAD:main && exit 0
            sleep $((i*5))
          done
          exit 1
