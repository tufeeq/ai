name: TAGit v3.4 Month Ground Truth Validation

on:
  workflow_dispatch:
  push:
    paths:
      - 'tagit/month-groundtruth-v34.py'
      - '.github/workflows/tagit-v34-month-groundtruth.yml'

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check numpy scikit-learn
      - name: Syntax check
        run: python -m py_compile tagit/month-groundtruth-v34.py
      - name: Run month-scale hard-negative validation
        run: python tagit/month-groundtruth-v34.py
      - name: Verify research contract
        run: |
          python - <<'PY'
          import json
          r=json.load(open('tag/data/tagit-v34-month-groundtruth.json'))
          assert r['policy']=='RESEARCH_ONLY_NO_CHAMPION_OVERRIDE'
          assert len(r['results'])==3
          assert r['coverage']['snapshotEntries']>=200
          assert r['split']['trainRows']>0 and r['split']['holdRows']>0
          print('TAGit v3.4 month-groundtruth contract PASS')
          PY
      - name: Commit derived report only
        run: |
          git config user.name tagit-v34-research-bot
          git config user.email actions@users.noreply.github.com
          git add tag/data/tagit-v34-month-groundtruth.json
          git diff --cached --quiet && exit 0
          git commit -m 'data: add TAGit v3.4 month ground-truth validation'
          for i in 1 2 3; do
            git pull --rebase --autostash origin main && git push origin HEAD:main && exit 0
            sleep $((i*4))
          done
          exit 1
