name: TAGit NEXT daily study

# Pre-registered daily-bar hypotheses (daily-study-1) on Nasdaq listings; development/holdout split.
on:
  workflow_dispatch:
    inputs:
      from:
        description: First session (YYYY-MM-DD)
        default: '2023-01-03'
      to:
        description: Last session (YYYY-MM-DD)
        default: '2026-09-24'
  push:
    branches: ['claude/**']
    paths: ['tagit-next/pipeline/daily_study.mjs', '.github/workflows/tagit-next-daily-study.yml']

permissions:
  contents: write
  actions: write  # request a Pages deploy after publishing

concurrency:
  group: tagit-next-daily-study-${{ github.ref }}
  cancel-in-progress: false

jobs:
  daily:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Tests
        run: node --test tagit-next/tests/dailystudy.test.mjs
      - name: Study
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            node tagit-next/pipeline/daily_study.mjs --from 2025-06-02 --to 2026-09-24 --limit-symbols 300
          else
            node tagit-next/pipeline/daily_study.mjs --from "${{ github.event.inputs.from }}" --to "${{ github.event.inputs.to }}"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: daily-study
          path: tagit-next/data/daily-study.json
      - name: Publish (main)
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name 'github-actions'
          git config user.email 'github-actions@github.com'
          git add tagit-next/data/daily-study.json
          git diff --cached --quiet && { echo 'No change'; exit 0; }
          git commit -m 'data: TAGit NEXT daily study'
          for attempt in 1 2 3 4; do
            if git pull --rebase --autostash origin main && git push origin HEAD:main; then
              gh workflow run pages-tagx-deploy.yml --ref main
              exit 0
            fi
            sleep $((attempt * 5))
          done
          exit 1
