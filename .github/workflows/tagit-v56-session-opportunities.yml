name: TAGit v5.6 Session Opportunity Hunter

on:
  push:
    branches: [main]
    paths:
      - 'tagit/session-opportunity-v56.py'
      - '.github/workflows/tagit-v56-session-opportunities.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: tagit-v56-session-opportunities
  cancel-in-progress: true

jobs:
  research:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -q numpy scikit-learn
      - name: Syntax check
        run: python -m py_compile tagit/session-opportunity-v56.py
      - name: Train session opportunity architecture
        run: python tagit/session-opportunity-v56.py
      - name: Verify causal and actionable contract
        run: |
          python - <<'PY'
          import json,pathlib
          p=pathlib.Path('tag/data/tagit-v56-session-opportunities.json')
          q=pathlib.Path('tag/data/tagit-v56-case-library.json')
          assert p.exists() and q.exists()
          r=json.loads(p.read_text())
          assert r['policy']=='RESEARCH_ONLY_NO_CHAMPION_OVERRIDE'
          o=r['objective']
          assert '15-90 minute runway' in o['primary']
          assert 'pre-market + regular + after-hours'==o['coverage']
          assert r['successCriteria']['precisionIsNotOnlyObjective'] is True
          assert r['successCriteria']['mustPreserveRepeatedSessionOpportunities'] is True
          assert 'thresholds selected on calibration only' in r['antiLeakage']
          assert 'untouched holdout evaluated after freeze' in r['antiLeakage']
          print('v5.6 contract verified')
          PY
      - name: Commit derived reports
        run: |
          git config user.name "TAGit Research Bot"
          git config user.email "actions@users.noreply.github.com"
          git add tag/data/tagit-v56-session-opportunities.json tag/data/tagit-v56-case-library.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "research: record TAGit v5.6 session opportunity results"
          git pull --rebase origin main
          git push origin main
