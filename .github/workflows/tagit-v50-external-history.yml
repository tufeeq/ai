name: TAGit v5.0 External Historical Precision
on:
  push:
    branches: [main]
    paths:
      - 'tagit/external-history-v50.py'
      - '.github/workflows/tagit-v50-external-history.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: tagit-v50-external-history
  cancel-in-progress: true
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -q numpy scikit-learn
      - name: Syntax check
        run: python -m py_compile tagit/external-history-v50.py
      - name: Fetch real historical bars and run causal study
        run: python tagit/external-history-v50.py
      - name: Validate report contract
        run: |
          python - <<'PY'
          import json
          r=json.load(open('tag/data/tagit-v50-external-history.json'))
          assert r['policy']=='RESEARCH_ONLY_NO_CHAMPION_OVERRIDE'
          if r.get('verdict')=='EXTERNAL_90_CONFIRMED':
              assert r['calibrationReached90'] is True and r['holdoutReached90'] is True
              assert r['holdout']['count']>=12 and r['holdout']['precisionPct']>=90
          print(r.get('status'),r.get('verdict'),r.get('rows'),r.get('holdout'))
          PY
      - name: Commit derived report only
        run: |
          git config user.name tagit-v50-history-bot
          git config user.email actions@users.noreply.github.com
          git add tag/data/tagit-v50-external-history.json
          git diff --cached --quiet && exit 0
          git commit -m 'research: add TAGit v5.0 external history result'
          for i in 1 2 3; do
            git pull --rebase --autostash origin main && git push origin HEAD:main && exit 0
            sleep $((i*5))
          done
          exit 1
