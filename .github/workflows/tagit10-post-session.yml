name: TAGit10 Causal Post Session
on:
  workflow_dispatch:
  schedule:
    - cron: '25 20 * * 1-5'
    - cron: '25 21 * * 1-5'
permissions:
  contents: write
concurrency:
  group: tagit10-post-session-main
  cancel-in-progress: true
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - name: Gate 16:15-16:55 ET
        id: gate
        run: |
          ET=$(TZ=America/New_York date +%H%M)
          DOW=$(TZ=America/New_York date +%u)
          if [ "$DOW" -le 5 ] && [ "$ET" -ge 1615 ] && [ "$ET" -le 1655 ]; then echo 'run=yes' >> "$GITHUB_OUTPUT"; else echo 'run=no' >> "$GITHUB_OUTPUT"; fi
      - uses: actions/setup-python@v5
        if: steps.gate.outputs.run == 'yes'
        with:
          python-version: '3.12'
      - name: Read canonical radar evidence
        if: steps.gate.outputs.run == 'yes'
        run: |
          git fetch origin tagit10-live
          git show FETCH_HEAD:tagit10-state.json > /tmp/tagit10-audit-state.json
      - name: Causal root-cause audit
        if: steps.gate.outputs.run == 'yes'
        env:
          TAGIT_STATE_PATH: /tmp/tagit10-audit-state.json
          FINVIZ_TOKEN: ${{ secrets.FINVIZ_TOKEN }}
        run: python tagit10/post_session.py
      - name: Persist audit
        if: steps.gate.outputs.run == 'yes'
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add tag/data/tagit10-post-session.json tagit10/reports/
          git diff --cached --quiet && exit 0
          git commit -m 'data: TAGit10 causal post-session audit'
          git pull --rebase origin main
          git push origin HEAD:main

