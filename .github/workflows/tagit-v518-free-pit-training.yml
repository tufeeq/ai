name: TAGit v5.18 Recurrent Memory PIT Validation

on:
  workflow_dispatch:
  push:
    paths:
      - 'tagit/free-pit-training-v518.py'
      - '.github/workflows/tagit-v518-free-pit-training.yml'

permissions:
  contents: write

concurrency:
  group: tagit-v518-free-pit-training
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      APCA_API_KEY_ID: ${{ secrets.APCA_API_KEY_ID }}
      APCA_API_SECRET_KEY: ${{ secrets.APCA_API_SECRET_KEY }}
      TAGIT_MAX_SYMBOLS: '650'
      TAGIT_HISTORY_DAYS: '730'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check -q numpy scikit-learn
      - name: Syntax check
        run: python -m py_compile tagit/free-pit-training-v518.py tagit/free-pit-training-v517.py
      - name: Run v5.18 validation
        run: python tagit/free-pit-training-v518.py
      - name: Verify anti-leakage/report
        run: |
          python - <<'PY'
          import json,pathlib
          p=pathlib.Path('tag/data/tagit-v518-free-pit-training.json'); assert p.exists()
          r=json.loads(p.read_text()); assert r['status']=='COMPLETE'; assert r['realDiscoveryPrecisionPct'] is None
          assert r['splits']['holdoutRows']>0; assert 'memory computed from prior completed sessions only' in r['antiLeakage']
          print('calibration',r['calibration']); print('holdout',r['holdout'])
          PY
      - name: Commit evidence
        run: |
          git config user.name "TAGit Research Bot"
          git config user.email "actions@users.noreply.github.com"
          git add tag/data/tagit-v518-free-pit-training.json tag/data/tagit-v518-free-pit-cases.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "research: record v5.18 recurrent-memory PIT evidence"
          git pull --rebase origin main
          git push origin main
