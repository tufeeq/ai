name: TAGX Actionability v8 Challenger
on:
  workflow_dispatch:
  push:
    paths:
      - 'tagx/challengers/actionability_v8.py'
      - '.github/workflows/tagx-actionability-v8-challenger.yml'
      - 'tag/data/tagx-authoritative-peak-v7-challenger.json'
  schedule:
    - cron: '7,27,47 13-19 * * 1-5'
permissions:
  contents: write
concurrency:
  group: tagx-actionability-v8
  cancel-in-progress: true
jobs:
  evaluate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Evaluate peak-aware actionability
        run: python tagx/challengers/actionability_v8.py
      - name: Validate output
        run: |
          python - <<'PY'
          import json
          p='tag/data/tagx-actionability-v8-challenger.json'
          x=json.load(open(p))
          assert x['schemaVersion']==8
          assert x['status']=='CHALLENGER_ONLY'
          assert isinstance(x['currentTop20'],list)
          print({'top20':len(x['currentTop20']),'actionable':x['actionableEarlyCount'],'rejected':x['criticRejectedCount']})
          PY
      - name: Commit challenger output
        run: |
          git config user.name 'TAGX Challenger Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add tag/data/tagx-actionability-v8-challenger.json
          git diff --cached --quiet && exit 0
          git commit -m 'Update TAGX actionability v8 challenger'
          for i in 1 2 3; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep $((i*4))
          done
          exit 1
